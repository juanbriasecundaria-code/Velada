<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEG Express — La Velada</title>
<style>
:root{
  --bg:#0a1628; --bg2:#0f2138; --panel:#13243c; --panel2:#17304f;
  --gold:#f0b429; --gold-dim:#8a6a1f; --text:#eef3f8; --text-dim:#9fb3c8;
  --ok:#2ecc71; --bad:#e74c3c; --sea:#1b3a5c; --border:#2a4463;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:linear-gradient(180deg,#081220,#0a1628 40%,#0c1a2c);
  color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{margin:0 0 6px;}
button{
  font:inherit; cursor:pointer; border:none; border-radius:10px; padding:10px 14px;
  background:var(--panel2); color:var(--text); transition:transform .08s ease, background .15s;
}
button:active{transform:scale(.96);}
button:disabled{opacity:.35; cursor:not-allowed;}
button.primary{background:var(--gold); color:#1a1200; font-weight:700;}
button.ghost{background:transparent; border:1px solid var(--border);}
button.small{padding:5px 9px; font-size:12px; border-radius:7px;}
.tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px;}
.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ---------- pantalla de entrada (elegir rol) ---------- */
#gateScreen, #phoneScreen, #dashboardView{display:none;}
#gateScreen.show, #phoneScreen.show, #dashboardView.show{display:block;}
#gateScreen.show{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
.gateCard{width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px; align-items:stretch;}
.gateBrand{font-size:28px; font-weight:800; text-align:center; color:var(--gold);}
.gateSub{font-size:13px; color:var(--text-dim); text-align:center; margin-bottom:10px;}
.gateBtn{
  display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--panel2);
  border:1px solid var(--border); border-radius:14px; text-align:left;
}
.gateBtn .gi{font-size:26px; flex-shrink:0;}
.gateBtn .gt{display:flex; flex-direction:column; gap:2px;}
.gateBtn .gt b{font-size:14px;}
.gateBtn .gt small{font-size:11px; color:var(--text-dim);}
.gateBtn.ghostGate{background:transparent; opacity:.8;}
.gateMsg{font-size:12px; color:var(--text-dim); text-align:center; min-height:16px;}

/* ---------- pantalla de celular (rol 'phone') ---------- */
#phoneScreen{max-width:460px; margin:0 auto; padding:10px;}
#phoneHeaderBar{display:flex; justify-content:space-between; align-items:center; padding:4px 4px 10px;}
#phoneTeamPicker{display:flex; flex-direction:column; gap:8px;}
.teamPickBtn{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px;
  background:var(--panel2); border:2px solid transparent;
}
.teamPickBtn[disabled]{opacity:.35;}
#phoneScreen .device{width:100%; flex:none; min-height:0;}

/* ---------- layout general del modo de prueba ---------- */
#testHeader{
  position:sticky; top:0; z-index:50; background:rgba(8,16,30,.96); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border); padding:8px 10px; display:flex; gap:8px; align-items:center;
  flex-wrap:wrap;
}
#testHeader .brand{font-weight:800; color:var(--gold); margin-right:auto; font-size:15px; white-space:nowrap;}
#testHeader select, #testHeader input[type=number]{
  background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 8px;
}
#stage{padding:12px; display:flex; flex-direction:column; gap:18px; max-width:1800px; margin:0 auto;}
.sectionTitle{display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12px; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px;}
.sectionTitle .line{flex:1; height:1px; background:var(--border);}

/* ---------- TV ---------- */
#tvWrap{background:#061018; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.4);}
#tvTop{display:flex; justify-content:space-between; align-items:center; padding:8px 14px; background:linear-gradient(180deg,#0d1f33,#0a1626); border-bottom:1px solid var(--border);}
#tvTop .clock{font-variant-numeric:tabular-nums; font-weight:800; color:var(--gold); font-size:15px;}
#tvBody{display:flex; gap:0; min-height:420px;}
#mapHost{flex:1; position:relative; background:radial-gradient(ellipse at 50% 40%, #123050, #081524 70%);}
#mapHost svg{width:100%; height:auto; display:block;}
#tvSide{width:230px; flex-shrink:0; background:#0a1a2c; border-left:1px solid var(--border); padding:10px; display:flex; flex-direction:column; gap:10px; overflow:hidden;}
#tvSide h3{font-size:12px; text-transform:uppercase; color:var(--text-dim); letter-spacing:1px;}
.teamChipRow{display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:8px; font-size:12px;}
.teamChipRow.onturn{background:rgba(240,180,41,.15); outline:1px solid var(--gold);}
.dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
#tvHistory{flex:1; overflow-y:auto; font-size:11px; color:var(--text-dim); display:flex; flex-direction:column-reverse; gap:3px;}
#tvHistory div{opacity:.9;}
#tvFinal{position:absolute; inset:0; background:rgba(5,10,20,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px;}

/* ---------- fichas / mapa svg ---------- */
.countryLabel{fill:#dbe8f5; font-size:7px; font-weight:600; text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:#06101c; stroke-width:2px;}
.chipSmall{stroke:rgba(0,0,0,.35); stroke-width:.5;}
.chipBig{stroke:rgba(0,0,0,.45); stroke-width:.6;}
body.polish-chips .chipSmall,body.polish-chips .chipBig{filter:drop-shadow(0 .6px .5px rgba(0,0,0,.55)) drop-shadow(0 0 .4px rgba(255,255,255,.4));}
body.polish-wartable #mapHost{background:
    radial-gradient(ellipse at 50% 35%, #163a5c, #081524 72%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
}
#mapZoomWrap{transition:transform .45s cubic-bezier(.22,.8,.3,1); transform-origin:50% 50%;}

/* ---------- overlays de animación (TV) ---------- */
#animOverlay{position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center;}
.diceBox{background:rgba(6,14,26,.92); border:1px solid var(--gold-dim); border-radius:16px; padding:14px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:popIn .25s ease;}
.diceRow{display:flex; gap:14px; align-items:center;}
.diceGroup{display:flex; gap:5px;}
.die{width:28px; height:28px; border-radius:7px; background:#fdf6e3; color:#1a1200; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.4);}
.die.lose{background:#5c6066; color:#fff;}
.die.rolling{animation:diceSpin .5s steps(6) infinite;}
.vs{font-size:11px; color:var(--text-dim); font-weight:700;}
.diceLabel{font-size:11px; color:var(--text-dim);}
@keyframes diceSpin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
@keyframes popIn{from{opacity:0; transform:scale(.85);}to{opacity:1; transform:scale(1);}}
.chipJump{animation:chipJump .5s ease;}
@keyframes chipJump{0%{transform:translateY(0);}30%{transform:translateY(-6px) scale(1.15);}100%{transform:translateY(14px) scale(.4); opacity:0;}}
.conquestBanner{position:absolute; background:rgba(10,20,10,.0); display:flex; flex-direction:column; align-items:center; gap:4px; animation:popIn .3s ease;}
.conquestBanner .txt{background:rgba(6,14,26,.92); border:1px solid var(--gold); color:var(--gold); font-weight:800; font-size:13px; padding:5px 12px; border-radius:20px; white-space:nowrap;}
.waveRing{fill:none; stroke-width:2; opacity:.9; animation:waveOut 1.1s ease-out forwards;}
@keyframes waveOut{from{r:4; opacity:.9; stroke-width:3;}to{r:34; opacity:0; stroke-width:.3;}}
.continentBanner{position:absolute; top:10%; left:50%; transform:translateX(-50%); background:rgba(6,14,26,.95); border:1px solid var(--gold); border-radius:14px; padding:10px 22px; text-align:center; animation:popIn .3s ease; box-shadow:0 10px 30px rgba(0,0,0,.5);}
.continentBanner b{color:var(--gold); font-size:16px;}

/* último minuto */
#tvWrap.lastMinute #mapHost::after{
  content:""; position:absolute; inset:0; pointer-events:none; background:rgba(200,30,30,.16);
  animation:lastMinutePulse 1s ease-in-out infinite;
}
@keyframes lastMinutePulse{0%,100%{opacity:.35;}50%{opacity:.85;}}
.lastMinuteText{color:var(--bad)!important; animation:lastMinutePulse 1s ease-in-out infinite;}

/* reacciones flotantes */
#reactionsLayer{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.floatEmoji{position:absolute; bottom:6%; font-size:26px; animation:floatUp 2.6s ease-out forwards; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
@keyframes floatUp{0%{transform:translateY(0) scale(.5); opacity:0;}12%{opacity:1; transform:scale(1.15);}100%{transform:translateY(-230px) scale(1); opacity:0;}}
.reactionBtns{display:flex; gap:4px; justify-content:center;}
.reactionBtns button{flex:1; font-size:17px; padding:5px 0; background:var(--panel);}
.chipNum{fill:#fff; font-size:8px; font-weight:800; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:#000; stroke-width:1.5px;}
.borderLine{stroke:#2e4f74; stroke-width:.6; opacity:.55;}
.bridgeLine{stroke:#8a3030; stroke-width:1; stroke-dasharray:2.4,1.6; opacity:.8;}
.countryHit{fill:transparent; cursor:pointer;}
/* ---------- integración con la Velada ---------- */
.rankTag{font-size:11px;color:var(--text-dim);margin-left:6px;font-weight:400;}
#veladaBanner{display:none;margin:8px 12px 0;padding:8px 12px;border:1px solid var(--gold-dim);background:rgba(240,180,41,.08);border-radius:10px;font-size:12.5px;line-height:1.5;}
#veladaBanner label{margin-left:10px;white-space:nowrap;cursor:pointer;}
body.role-tv #testHeader > *:not(.brand):not(#globalClock),
body.role-tv #driverSection,body.role-tv #devicesSection,body.role-tv #veladaBanner{display:none !important;}
/* ---------- mapa antiguo ---------- */
#mapHost{background:radial-gradient(ellipse at 50% 40%, #3a2814, #1c1209 75%);}
body.polish-wartable #mapHost{background:radial-gradient(ellipse at 50% 40%, #3a2814, #1c1209 75%);}
.countryLabel{fill:#2a1608; stroke:#f4e6c4; stroke-width:1.7px; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:700;}
.chipDisc{fill:rgba(18,9,2,.34);}
.mSea{fill:#b9cbbb;}
.mGrat,.mGrat *{stroke:#6f8f8a; stroke-opacity:.42; stroke-width:.12; fill:none;}
.mRing{fill:#c9a24d; stroke:#3b2511; stroke-width:.7; stroke-dasharray:2.1 .7;}
.mRingIn{stroke:#f3e7c3; stroke-width:1.5; fill:none;}
.mRingDash{stroke:#3b2511; stroke-width:1.5; stroke-dasharray:6 6; fill:none;}
.mIce{fill:#f4ecd2; stroke:#3b2511; stroke-width:.8;}
.mSpiral{stroke:#6f8f8a; stroke-width:.32; fill:none; opacity:.6;}
.mBridge{stroke:#7a1f12; stroke-dasharray:2.8 1.4; stroke-width:1.2; fill:none;}
.mArrow{fill:#7a1f12;}
.mThin{stroke:#3b2511; stroke-width:.3; fill:none;}
.mSeaText{fill:#3f5f5a; fill-opacity:.85;}
.mDragon{fill:#4a2f1a; fill-opacity:.85;}
.mIsle{fill:#d8c79a; stroke:#3b2511; stroke-width:.6;}
.mapFrame{fill:none; stroke:#3b2511;}

.countryGlow{filter:drop-shadow(0 0 4px rgba(240,180,41,.9));}
.countryDim{opacity:.35;}
.arrowAnim{stroke:#ffd966; stroke-width:1.6; fill:none; marker-end:url(#arrowhead);}

/* ---------- tarjetas tipo celular / conductor ---------- */
#devicesRow{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px;}
.device{
  flex:0 0 300px; width:300px; background:#0c1d30; border:1px solid var(--border); border-radius:20px;
  padding:10px; display:flex; flex-direction:column; gap:8px; min-height:560px;
}
.device .devHead{display:flex; justify-content:space-between; align-items:center;}
.device .devHead b{font-size:13px;}
.device .objective{background:var(--panel); border-radius:10px; padding:8px; font-size:12px; color:var(--text-dim);}
.device .phaseBadge{font-size:11px; padding:3px 8px; border-radius:20px; background:var(--panel2);}
.device .countryList{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.countryRow{display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:10px; padding:6px 8px; font-size:12px;}
.countryRow .nm{flex:1;}
.countryRow .arm{font-variant-numeric:tabular-nums; min-width:22px; text-align:center; font-weight:700;}
.stepBtn{width:26px; height:26px; border-radius:50%; padding:0; font-size:16px; line-height:1;}
.device .footerBtns{display:flex; gap:6px;}
.device .footerBtns button{flex:1;}
.miniMapHost{background:#081524; border-radius:12px; overflow:hidden;}
.miniMapHost svg{width:100%; display:block;}
.attackPicker{display:flex; flex-direction:column; gap:6px; font-size:12px;}
.pill{display:inline-block; padding:4px 9px; border-radius:20px; background:var(--panel2); font-size:11px; cursor:pointer; margin:2px;}
.pill.sel{background:var(--gold); color:#1a1200; font-weight:700;}
.pill.disabled{opacity:.3; pointer-events:none;}
.msg{font-size:11px; color:var(--bad); min-height:14px;}
.bigClock{font-size:28px; font-weight:800; color:var(--gold); text-align:center; font-variant-numeric:tabular-nums;}
.conquestBox{background:#241406; border:1px solid var(--gold-dim); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px;}

/* driver */
.driverGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; font-size:11px;}
.driverGrid .drow{background:var(--panel); border-radius:8px; padding:6px;}

@media (max-width:700px){
  #tvBody{flex-direction:column;}
  #tvSide{width:auto; border-left:none; border-top:1px solid var(--border);}
}
</style>
</head>

<!-- ───────── Pantalla de entrada: elegir rol ───────── -->
<div id="gateScreen">
  <div class="gateCard">
    <div class="gateBrand">🌍 TEG Express</div>
    <div class="gateSub">La Velada del Año</div>

    <button class="gateBtn" onclick="chooseRole('host')">
      <span class="gi">📺</span>
      <span class="gt"><b>Pantalla</b><small>TV + conductor — la maneja quien organiza</small></span>
    </button>
    <button class="gateBtn" onclick="chooseRole('phone')">
      <span class="gi">📱</span>
      <span class="gt"><b>Soy un equipo</b><small>Elegí tu equipo desde el celular</small></span>
    </button>
    <button class="gateBtn" onclick="chooseRole('tv')">
      <span class="gi">🖥️</span>
      <span class="gt"><b>TV (solo mirar)</b><small>Muestra el mapa en vivo; no maneja la partida</small></span>
    </button>
    <button class="gateBtn ghostGate" onclick="chooseRole('test')">
      <span class="gi">🧪</span>
      <span class="gt"><b>Modo de prueba</b><small>Sin Firebase, simula los 6 equipos acá mismo</small></span>
    </button>
    <div id="gateMsg" class="gateMsg"></div>
  </div>
</div>

<!-- ───────── Celular de un equipo (rol 'phone') ───────── -->
<div id="phoneScreen">
  <div id="phoneHeaderBar">
    <button class="ghost small" onclick="try{localStorage.removeItem('tegRole');localStorage.removeItem('tegMyTeam');}catch(e){}location.href=location.pathname">← Salir</button>
    <span id="phoneConnLabel" style="font-size:11px;color:var(--text-dim);">conectando…</span>
  </div>
  <div id="phoneTeamPicker"></div>
  <div id="phoneDeviceHost"></div>
</div>

<!-- ───────── Pantalla + conductor (roles 'host' y 'test') ───────── -->
<div id="dashboardView">
  <div id="testHeader">
    <div class="brand" id="dashBrand">🌍 TEG Express — modo de prueba</div>

   TEG EXPRESS — Etapa 2

<script>
// ============================================================
// TEG EXPRESS — MOTOR DE JUEGO (lógica pura, sin DOM, sin Firebase)
// Pensado para poder reemplazar luego las mutaciones directas de
// estado por un dispatcher de eventos (Etapa 2 / Firebase).
// ============================================================

(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.TegEngine = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- CONFIG POR DEFECTO ----------
  const DEFAULT_CONFIG = {
    ejercitosInicialesPorEquipo: 24,
    refuerzoMinimoPorRonda: 4,
    objetivoComunTerritorios: 14,
    fichaGrandeEquivale: 5,
    segundosRefuerzos: 45,
    segundosAtaquePorEquipo: 30,
    ofensivasMaximasPorTurno: 4,
    duracionPartidaMinutos: 20,
    avisoPaisesMinimos: 2, // a partir de cuántos países o menos se avisa "contra las cuerdas"
  };

  const TEAM_COLORS = [
    { color: '#e74c3c', name: 'Rojo', shape: 'circle' },
    { color: '#3498db', name: 'Azul', shape: 'square' },
    { color: '#2ecc71', name: 'Verde', shape: 'triangle' },
    { color: '#f1c40f', name: 'Amarillo', shape: 'diamond' },
    { color: '#9b59b6', name: 'Violeta', shape: 'star' },
    { color: '#e67e22', name: 'Naranja', shape: 'hexagon' },
  ];

  // Objetivos secretos (solo de OCUPACIÓN; sin pactos ni objetivos de
  // destrucción en esta versión). `req` es una lista de requisitos:
  //  {cont, all:true}      -> debe ocupar TODOS los países de ese continente
  //  {cont, count:N}       -> debe ocupar al menos N países de ese continente
  const OBJECTIVES = [
    { id: 1, text: 'Ocupar Oceanía + 4 países de otro continente', req: [{ cont: 'OC', all: true }, { cont: 'ANY', count: 4 }] },
    { id: 2, text: 'Ocupar América del Sur + 5 países de Asia', req: [{ cont: 'AS2', all: true }, { cont: 'AA', count: 5 }] },
    { id: 3, text: 'Ocupar América del Norte + 4 países de Europa', req: [{ cont: 'AN', all: true }, { cont: 'EU', count: 4 }] },
    { id: 4, text: 'Ocupar Europa + 4 países de Asia + 2 de América del Sur', req: [{ cont: 'EU', all: true }, { cont: 'AA', count: 4 }, { cont: 'AS2', count: 2 }] },
    { id: 5, text: 'Ocupar Asia + 2 países de América del Sur', req: [{ cont: 'AA', all: true }, { cont: 'AS2', count: 2 }] },
    { id: 6, text: 'Ocupar África + 5 países de América del Norte y 4 de Europa', req: [{ cont: 'AF', all: true }, { cont: 'AN', count: 5 }, { cont: 'EU', count: 4 }] },
    { id: 7, text: 'Ocupar Oceanía + América del Norte + 2 países de Europa', req: [{ cont: 'OC', all: true }, { cont: 'AN', all: true }, { cont: 'EU', count: 2 }] },
    { id: 8, text: 'Ocupar América del Sur + África + 4 países de Asia', req: [{ cont: 'AS2', all: true }, { cont: 'AF', all: true }, { cont: 'AA', count: 4 }] },
    { id: 9, text: 'Ocupar Oceanía + África + 5 países de América del Norte', req: [{ cont: 'OC', all: true }, { cont: 'AF', all: true }, { cont: 'AN', count: 5 }] },
  ];

  // ---------- UTILIDADES ----------
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor((rng ? rng() : Math.random()) * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rollDie(rng) {
    return 1 + Math.floor((rng ? rng() : Math.random()) * 6);
  }

  function rollDice(n, rng) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(rollDie(rng));
    out.sort((a, b) => b - a);
    return out;
  }

  function log(state, text, extra) {
    state.log.push(Object.assign({ text, t: state.elapsedGameSeconds }, extra || {}));
    if (state.log.length > 200) state.log.shift();
  }

  function pushEvent(state, ev) {
    // Cada evento lleva un número de secuencia creciente: en vez de
    // consumir la cola con shift() (que no sirve cuando varios
    // dispositivos miran la MISMA `state` sincronizada por Firebase),
    // cada cliente recuerda hasta qué `seq` ya animó. La cola se
    // acota para no crecer sin límite.
    state._eventSeq = (state._eventSeq || 0) + 1;
    ev.seq = state._eventSeq;
    state.eventQueue.push(ev);
    if (state.eventQueue.length > 60) state.eventQueue.splice(0, state.eventQueue.length - 60);
  }

  // ---------- MOTOR ----------
  function createEngine(countriesData, continentsData, config, rng) {
    const CONFIG = Object.assign({}, DEFAULT_CONFIG, config || {});
    const COUNTRIES = countriesData; // array
    const BY_ID = {};
    countriesData.forEach((c) => (BY_ID[c.id] = c));
    const CONTINENTS = continentsData;
    const random = rng || Math.random;

    function neighborsOf(id) {
      const c = BY_ID[id];
      return c.n.concat(c.b);
    }

    function isNeighbor(a, b) {
      return neighborsOf(a).indexOf(b) !== -1;
    }

    function countriesOfContinent(cont) {
      return COUNTRIES.filter((c) => c.cont === cont).map((c) => c.id);
    }

    // ---------- SETUP ----------
    function setupGame(numTeams, teamNames) {
      const state = {
        phase: 'reinforce',
        round: 1,
        gameStarted: true,
        paused: false,
        timeUp: false,
        elapsedGameSeconds: 0,
        phaseTimer: CONFIG.segundosRefuerzos,
        teams: [],
        countries: {},
        turnOrder: [],
        currentTeamIndex: 0,
        reinforceAmount: {},
        reinforceAlloc: {},
        reinforceConfirmed: {},
        offensivesUsed: {},
        regroupUsed: {},
        currentOffensive: null,
        pendingConquest: null,
        log: [],
        eventQueue: [],
        _eventSeq: 0,
        winner: null,
        winReason: null,
        stats: { conquests: {}, diceLost: {}, battles: [] },
      };

      for (let i = 0; i < numTeams; i++) {
        const meta = TEAM_COLORS[i];
        state.teams.push({
          id: 't' + i,
          name: (teamNames && teamNames[i]) || meta.name,
          color: meta.color,
          shape: meta.shape,
          alive: true,
          objective: null,
        });
      }

      // reparto de países
      const shuffledCountries = shuffle(COUNTRIES.map((c) => c.id), random);
      shuffledCountries.forEach((cid, idx) => {
        const teamId = state.teams[idx % numTeams].id;
        state.countries[cid] = { owner: teamId, armies: 1 };
      });

      // repartir el resto de los ejércitos iniciales en países de frontera propios
      state.teams.forEach((team) => {
        const owned = shuffledCountries.filter((cid) => state.countries[cid].owner === team.id);
        let remaining = CONFIG.ejercitosInicialesPorEquipo - owned.length;
        let guard = 0;
        while (remaining > 0 && guard < 10000) {
          guard++;
          const cid = owned[Math.floor(random() * owned.length)];
          state.countries[cid].armies++;
          remaining--;
        }
      });

      // orden de turnos
      state.turnOrder = shuffle(state.teams.map((t) => t.id), random);

      // objetivos secretos (sin repetir)
      const pool = shuffle(OBJECTIVES, random);
      state.teams.forEach((team, idx) => {
        team.objective = pool[idx % pool.length];
      });

      startReinforcePhase(state);
      return state;
    }

    // ---------- CONTEO / REFUERZOS ----------
    function teamCountryIds(state, teamId) {
      return Object.keys(state.countries).filter((cid) => state.countries[cid].owner === teamId);
    }

    function teamOwnsFullContinent(state, teamId, cont) {
      const ids = countriesOfContinent(cont);
      return ids.every((cid) => state.countries[cid].owner === teamId);
    }

    function computeReinforcement(state, teamId) {
      const owned = teamCountryIds(state, teamId);
      const n = owned.length;
      let base = Math.max(Math.floor(n / 2), CONFIG.refuerzoMinimoPorRonda);
      let reasonParts = ['Tenés ' + n + ' países → ' + base + ' tropas'];
      let bonusTotal = 0;
      Object.keys(CONTINENTS).forEach((cont) => {
        if (teamOwnsFullContinent(state, teamId, cont)) {
          const bonus = CONTINENTS[cont].bonus;
          bonusTotal += bonus;
          reasonParts.push('+' + bonus + ' por ' + CONTINENTS[cont].name + ' completo');
        }
      });
      return { amount: base + bonusTotal, reason: reasonParts.join(' · ') };
    }

    function startReinforcePhase(state) {
      state.phase = 'reinforce';
      state.phaseTimer = CONFIG.segundosRefuerzos;
      state.reinforceAmount = {};
      state.reinforceAlloc = {};
      state.reinforceConfirmed = {};
      if (!state._contOwned) state._contOwned = {};
      state.teams.forEach((team) => {
        if (!team.alive) return;
        const r = computeReinforcement(state, team.id);
        state.reinforceAmount[team.id] = r.amount;
        state.reinforceAlloc[team.id] = {};
        state.reinforceConfirmed[team.id] = false;

        // detectar continentes recién completados (para el festejo en TV)
        const prev = state._contOwned[team.id] || [];
        const now = Object.keys(CONTINENTS).filter((cont) => teamOwnsFullContinent(state, team.id, cont));
        now.filter((c) => prev.indexOf(c) === -1).forEach((cont) => {
          pushEvent(state, { type: 'continent-bonus', teamId: team.id, cont, bonus: CONTINENTS[cont].bonus });
          log(state, '🌎 ' + equipoNombre(state, team.id) + ' completó ' + CONTINENTS[cont].name + ' (+' + CONTINENTS[cont].bonus + ').');
        });
        state._contOwned[team.id] = now;
      });
      log(state, 'Ronda ' + state.round + ' — fase de refuerzos.');
      pushEvent(state, { type: 'phase', phase: 'reinforce', round: state.round });
    }

    function allocatedSoFar(state, teamId) {
      const alloc = state.reinforceAlloc[teamId] || {};
      return Object.values(alloc).reduce((a, b) => a + b, 0);
    }

    function allocateReinforcement(state, teamId, countryId, delta) {
      if (state.phase !== 'reinforce') return { ok: false, error: 'No es la fase de refuerzos' };
      if (state.reinforceConfirmed[teamId]) return { ok: false, error: 'Ya confirmaste tus refuerzos' };
      const c = state.countries[countryId];
      if (!c || c.owner !== teamId) return { ok: false, error: 'Ese país no es tuyo' };
      const alloc = state.reinforceAlloc[teamId];
      const current = alloc[countryId] || 0;
      const used = allocatedSoFar(state, teamId);
      const total = state.reinforceAmount[teamId];
      const next = current + delta;
      if (next < 0) return { ok: false, error: 'No podés bajar de 0' };
      if (used - current + next > total) return { ok: false, error: 'No te quedan tropas para repartir' };
      alloc[countryId] = next;
      if (alloc[countryId] === 0) delete alloc[countryId];
      return { ok: true };
    }

    function confirmReinforcement(state, teamId) {
      if (state.phase !== 'reinforce') return { ok: false, error: 'No es la fase de refuerzos' };
      state.reinforceConfirmed[teamId] = true;
      log(state, equipoNombre(state, teamId) + ' confirmó sus refuerzos.');
      const allConfirmed = state.teams.filter((t) => t.alive).every((t) => state.reinforceConfirmed[t.id]);
      if (allConfirmed) applyReinforcements(state);
      return { ok: true };
    }

    function applyReinforcements(state) {
      state.teams.forEach((team) => {

        Object.keys(alloc).forEach((cid) => {

        let remaining = (state.reinforceAmount[team.id] || 0) - used;
        if (remaining > 0) {

          let guard = 0;
          while (remaining > 0 && guard < 10000 && owned.length) {
            guard++;
            const cid = owned[Math.floor(random() * owned.length)];
            state.countries[cid].armies++;
            remaining--;
          }
          log(state, equipoNombre(state, team.id) + ' no repartió a tiempo: ' + (state.reinforceAmount[team.id] - used) + ' tropas se ubicaron solas.');
        }
      });
      pushEvent(state, { type: 'reinforce-applied' });
      startAttackPhase(state);
    }

    // ---------- FASE DE ATAQUE ----------
    function startAttackPhase(state) {
      state.phase = 'attack';
      state.currentTeamIndex = 0;
      skipDeadTeams(state);
      beginTeamTurn(state);
    }

    function skipDeadTeams(state) {
      let guard = 0;
      while (guard < state.turnOrder.length + 2) {
        const tid = state.turnOrder[state.currentTeamIndex];
        const team = state.teams.find((t) => t.id === tid);
        if (team && team.alive) return;
        state.currentTeamIndex = (state.currentTeamIndex + 1) % state.turnOrder.length;
        guard++;
      }
    }

    function beginTeamTurn(state) {
      const teamId = state.turnOrder[state.currentTeamIndex];
      state.offensivesUsed[teamId] = 0;
      state.regroupUsed[teamId] = false;
      state.currentOffensive = null;
      state.pendingConquest = null;
      state.phaseTimer = CONFIG.segundosAtaquePorEquipo;
      log(state, 'Turno de ' + equipoNombre(state, teamId) + '.');
      pushEvent(state, { type: 'turn', teamId });
    }

    function equipoNombre(state, teamId) {
      const t = state.teams.find((tt) => tt.id === teamId);
      return t ? t.name : teamId;
    }

    function currentTeamId(state) {
      return state.turnOrder[state.currentTeamIndex];
    }

    function canAttack(state, teamId, originId, destId) {
      if (state.phase !== 'attack') return { ok: false, error: 'No es fase de ataque' };
      if (currentTeamId(state) !== teamId) return { ok: false, error: 'No es tu turno' };
      if (state.pendingConquest) return { ok: false, error: 'Primero resolvé la conquista pendiente' };
      if (state.regroupUsed[teamId]) return { ok: false, error: 'Ya reagrupaste: no podés atacar más este turno' };
      const origin = state.countries[originId];
      const dest = state.countries[destId];
      if (!origin || origin.owner !== teamId) return { ok: false, error: 'Ese país de origen no es tuyo' };
      if (origin.armies < 2) return { ok: false, error: 'Necesitás más de 1 ejército para atacar' };
      if (!dest || dest.owner === teamId) return { ok: false, error: 'El destino debe ser de otro equipo' };
      if (!isNeighbor(originId, destId)) return { ok: false, error: 'No son países limítrofes' };
      const isSameOffensive = state.currentOffensive && state.currentOffensive.originId === originId && state.currentOffensive.destId === destId;
      if (!isSameOffensive && state.offensivesUsed[teamId] >= CONFIG.ofensivasMaximasPorTurno) {
        return { ok: false, error: 'Ya usaste tus ' + CONFIG.ofensivasMaximasPorTurno + ' ofensivas de este turno' };
      }
      return { ok: true };
    }

    function singleRoll(state, teamId, originId, destId) {
      const check = canAttack(state, teamId, originId, destId);
      if (!check.ok) return check;

      const isSameOffensive = state.currentOffensive && state.currentOffensive.originId === originId && state.currentOffensive.destId === destId;
      if (!isSameOffensive) {
        state.offensivesUsed[teamId]++;
        state.currentOffensive = { originId, destId };
        log(state, equipoNombre(state, teamId) + ' ataca de ' + BY_ID[originId].name + ' a ' + BY_ID[destId].name + '.');
      }

      const origin = state.countries[originId];
      const dest = state.countries[destId];
      const atkCount = Math.min(origin.armies - 1, 3);
      const defCount = Math.min(dest.armies, 3);
      const atkDice = rollDice(atkCount, random);
      const defDice = rollDice(defCount, random);

      let atkLoss = 0;
      let defLoss = 0;
      const pairs = Math.min(atkDice.length, defDice.length);
      for (let i = 0; i < pairs; i++) {
        if (atkDice[i] > defDice[i]) defLoss++;
        else atkLoss++;
      }
      origin.armies -= atkLoss;
      dest.armies -= defLoss;

      // ---- estadísticas para el resumen final ----
      const defOwnerBefore = dest.owner;
      state.stats.diceLost[teamId] = (state.stats.diceLost[teamId] || 0) + atkLoss;
      state.stats.diceLost[defOwnerBefore] = (state.stats.diceLost[defOwnerBefore] || 0) + defLoss;
      if (atkLoss > 0 && defLoss > 0) {
        state.stats.battles.push({ originId, destId, teamId, defTeamId: defOwnerBefore, atkDice, defDice, atkLoss, defLoss, totalDice: atkDice.length + defDice.length });
      }

      pushEvent(state, {
        type: 'combat', teamId, originId, destId, atkDice, defDice, atkLoss, defLoss,
        atkArmiesLeft: origin.armies, defArmiesLeft: dest.armies,
        firstOfOffensive: !isSameOffensive,
      });
      log(state, '  Dados ' + atkDice.join('-') + ' vs ' + defDice.join('-') + ' → pierde ataque ' + atkLoss + ', pierde defensa ' + defLoss + '.');

      let conquered = false;
      if (dest.armies <= 0) {
        conquered = true;
        const maxMove = Math.min(3, origin.armies - 1);
        state.pendingConquest = { teamId, originId, destId, maxMove, minMove: 1, defeatedTeam: dest.owner };
        state._lastConquestRoll = { originId, destId, teamId, atkDice, defDice, atkLoss, defLoss };
        pushEvent(state, { type: 'conquest-pending', originId, destId, maxMove });
      }

      const offensiveOver = conquered || origin.armies <= 1;
      if (offensiveOver && !conquered) {
        state.currentOffensive = null;
      }

      return { ok: true, atkDice, defDice, atkLoss, defLoss, conquered, offensiveOver };
    }

    function attackUntilEnd(state, teamId, originId, destId, maxIterations) {
      const results = [];
      let guard = maxIterations || 50;
      while (guard-- > 0) {
        const r = singleRoll(state, teamId, originId, destId);
        if (!r.ok) {
          if (results.length === 0) return r;
          break;
        }
        results.push(r);
        if (r.conquered || r.offensiveOver) break;
      }
      return { ok: true, rolls: results };
    }

    function confirmConquestMove(state, teamId, amount) {
      const pc = state.pendingConquest;
      if (!pc) return { ok: false, error: 'No hay conquista pendiente' };
      if (pc.teamId !== teamId) return { ok: false, error: 'No es tu conquista' };
      const n = Math.max(pc.minMove, Math.min(pc.maxMove, amount | 0));
      const origin = state.countries[pc.originId];
      const dest = state.countries[pc.destId];
      origin.armies -= n;
      dest.owner = teamId;
      dest.armies = n;
      state.stats.conquests[teamId] = (state.stats.conquests[teamId] || 0) + 1;

      // ¿el equipo derrotado queda sin países? (no hay objetivos de
      // destrucción en esta versión, pero igual lo marcamos como eliminado)
      const defeated = state.teams.find((t) => t.id === pc.defeatedTeam);
      let defeatedRemaining = null;
      if (defeated) {
        defeatedRemaining = teamCountryIds(state, defeated.id).length;
        if (defeatedRemaining <= 0) {
          defeated.alive = false;
          log(state, equipoNombre(state, defeated.id) + ' quedó sin países y fue eliminado.');
        } else if (defeatedRemaining <= (CONFIG.avisoPaisesMinimos || 2)) {
          pushEvent(state, { type: 'low-countries', teamId: defeated.id, count: defeatedRemaining });
          log(state, '⚠️ ' + equipoNombre(state, defeated.id) + ' está contra las cuerdas (' + defeatedRemaining + ' país/es).');
        }
      }

      log(state, equipoNombre(state, teamId) + ' conquista ' + BY_ID[pc.destId].name + ' (' + n + ' ejércitos).');
      pushEvent(state, { type: 'conquest', teamId, originId: pc.originId, destId: pc.destId, amount: n });
      state.pendingConquest = null;
      state.currentOffensive = null;

      const wasUndecided = !state.winner;
      checkWinConditions(state);
      if (wasUndecided && state.winner && state._lastConquestRoll) {
        state.stats.decisiveAttack = Object.assign({}, state._lastConquestRoll, { amount: n });
      }
      return { ok: true };
    }

    // ---------- REAGRUPAR ----------
    function regroup(state, teamId, fromId, toId, amount) {
      if (state.phase !== 'attack') return { ok: false, error: 'No es fase de ataque' };
      if (currentTeamId(state) !== teamId) return { ok: false, error: 'No es tu turno' };
      if (state.pendingConquest) return { ok: false, error: 'Primero resolvé la conquista pendiente' };
      if (state.regroupUsed[teamId]) return { ok: false, error: 'Ya reagrupaste este turno' };
      const from = state.countries[fromId];
      const to = state.countries[toId];
      if (!from || from.owner !== teamId) return { ok: false, error: 'El origen debe ser tuyo' };
      if (!to || to.owner !== teamId) return { ok: false, error: 'El destino debe ser tuyo' };
      if (!isNeighbor(fromId, toId)) return { ok: false, error: 'No son países limítrofes' };
      const n = amount | 0;
      if (n < 1 || n >= from.armies) return { ok: false, error: 'Tenés que dejar al menos 1 ejército en origen' };
      from.armies -= n;
      to.armies += n;
      state.regroupUsed[teamId] = true;
      state.currentOffensive = null;
      log(state, equipoNombre(state, teamId) + ' reagrupa ' + n + ' de ' + BY_ID[fromId].name + ' a ' + BY_ID[toId].name + '.');
      pushEvent(state, { type: 'regroup', teamId, fromId, toId, amount: n });
      return { ok: true };
    }

    // ---------- FIN DE TURNO / RONDA ----------
    function endTeamTurn(state) {
      if (state.pendingConquest) return { ok: false, error: 'Resolvé la conquista pendiente primero' };
      state.currentTeamIndex = (state.currentTeamIndex + 1) % state.turnOrder.length;
      skipDeadTeams(state);
      const backToStart = state.currentTeamIndex === state.turnOrder.indexOf(state.turnOrder[0]) && allTeamsHadTurn(state);
      // detectar si completamos la vuelta: usamos un contador simple
      state._turnsThisRound = (state._turnsThisRound || 0) + 1;
      const aliveCount = state.teams.filter((t) => t.alive).length;
      if (state._turnsThisRound >= aliveCount) {
        state._turnsThisRound = 0;
        endRound(state);
      } else {
        beginTeamTurn(state);
      }
      return { ok: true };
    }

    function allTeamsHadTurn() { return true; }

    function endRound(state) {
      if (state.timeUp) {
        finishGame(state, null, 'Se acabó el tiempo. Gana quien tenga más territorios.');
        return;
      }
      state.round++;
      startReinforcePhase(state);
    }

    // ---------- OBJETIVOS / VICTORIA ----------
    function teamMeetsObjective(state, teamId, objective) {
      const owned = new Set(teamCountryIds(state, teamId));
      let anyPoolUsed = new Set();
      for (const req of objective.req) {
        if (req.cont === 'ANY') {
          const count = owned.size; // ya controlado por los otros requisitos; simplificación
          if (count < req.count) return false;
          continue;
        }
        const ids = countriesOfContinent(req.cont);
        if (req.all) {
          if (!ids.every((cid) => owned.has(cid))) return false;
        } else if (req.count) {
          const have = ids.filter((cid) => owned.has(cid)).length;
          if (have < req.count) return false;
        }
      }
      return true;
    }

    function checkWinConditions(state) {
      if (state.winner) return;
      // objetivo común
      for (const team of state.teams) {
        if (!team.alive) continue;
        const count = teamCountryIds(state, team.id).length;
        if (count >= CONFIG.objetivoComunTerritorios) {
          finishGame(state, team.id, equipoNombre(state, team.id) + ' alcanzó el objetivo común (' + CONFIG.objetivoComunTerritorios + ' territorios).');
          return;
        }
        if (team.objective && teamMeetsObjective(state, team.id, team.objective)) {
          finishGame(state, team.id, equipoNombre(state, team.id) + ' cumplió su objetivo secreto.');
          return;
        }
      }
    }

    function finishGame(state, winnerTeamId, reason) {
      state.phase = 'ended';
      if (!winnerTeamId) {
        // definir por más territorios, desempatando por tropas
        let best = null;
        state.teams.forEach((t) => {
          if (!t.alive) return;
          const cnt = teamCountryIds(state, t.id).length;
          const armies = teamCountryIds(state, t.id).reduce((a, cid) => a + state.countries[cid].armies, 0);
          if (!best || cnt > best.cnt || (cnt === best.cnt && armies > best.armies)) {
            best = { id: t.id, cnt, armies };
          }
        });
        winnerTeamId = best && best.id;
      }
      state.winner = winnerTeamId;
      state.winReason = reason;
      pushEvent(state, { type: 'game-over', winnerTeamId, reason });
      log(state, '🏆 ' + (winnerTeamId ? equipoNombre(state, winnerTeamId) + ' gana. ' : '') + reason);
    }

    // ---------- TICK (reloj) ----------
    function tick(state, seconds) {
      if (!state.gameStarted || state.paused || state.phase === 'ended') return;
      state.elapsedGameSeconds += seconds;
      if (state.elapsedGameSeconds >= CONFIG.duracionPartidaMinutos * 60) {
        state.timeUp = true;
      }
      state.phaseTimer -= seconds;
      if (state.phaseTimer <= 0) {
        if (state.phase === 'reinforce') {
          state.teams.forEach((t) => {
            if (t.alive && !state.reinforceConfirmed[t.id]) state.reinforceConfirmed[t.id] = true;
          });
          applyReinforcements(state);
        } else if (state.phase === 'attack') {
          if (state.pendingConquest) {
            confirmConquestMove(state, state.pendingConquest.teamId, state.pendingConquest.maxMove);
          }
          endTeamTurn(state);
        }
      }
    }

    return {
      CONFIG, COUNTRIES, BY_ID, CONTINENTS, OBJECTIVES,
      setupGame, computeReinforcement, allocateReinforcement, confirmReinforcement,
      canAttack, singleRoll, attackUntilEnd, confirmConquestMove, regroup,
      endTeamTurn, tick, teamCountryIds, isNeighbor, neighborsOf, currentTeamId,
      checkWinConditions,
    };
  }

  return { createEngine, DEFAULT_CONFIG, TEAM_COLORS, OBJECTIVES };
});

<script>
/* ============================================================
   TEG EXPRESS — capa de interfaz (Etapa 2: con Firebase)

   Tres roles posibles (se eligen en la pantalla de entrada):
   - 'host'  → el dispositivo del conductor. Es el único que corre
               el motor (ENGINE.*) de verdad y el único que hace
               avanzar el reloj. Después de cada acción, publica el
               estado entero en Firebase (velada/teg/state).
               Además escucha velada/teg/actions: ahí llegan los
               pedidos de los celulares, y el conductor los aplica
               con el mismo motor (así los dados se resuelven en
               un solo lugar, como pedía el enunciado).
   - 'phone' → el celular de un equipo. NUNCA toca el motor: arma
               la selección (origen/destino, cuánto reagrupar, etc.)
               en DEVICE_UI local como siempre, pero al confirmar
               una acción la manda a velada/teg/actions en vez de
               llamar a ENGINE directo. Para pintar su pantalla lee
               velada/teg/state (de solo lectura).
   - 'test'  → el modo de prueba de la Etapa 1, sin Firebase: motor
               y los 6 "celulares" simulados, todo local. Se sigue
               pudiendo usar para ensayar sin conexión.

   La UI (renderDeviceCard, renderMapSVG, etc.) es la MISMA para
   los tres roles — no sabe ni le importa si está en modo prueba o
   en vivo; sólo lee STATE. Lo único que cambia entre roles es,
   literalmente, qué hacen los window.do* al confirmar una acción.
   ============================================================ */

var ENGINE = null; // global a propósito: facilita depurar
var STATE = null;

// ============================================================
// FIREBASE (Etapa 2)
// ============================================================
const FB_CFG = {
  apiKey: "AIzaSyB37WkRQqBWVYkZ84AE2u17pAOs_9ZCgCg",
  authDomain: "guessmovie-905e2.firebaseapp.com",
  databaseURL: "https://guessmovie-905e2-default-rtdb.firebaseio.com",
  projectId: "guessmovie-905e2",
  storageBucket: "guessmovie-905e2.firebasestorage.app",
  messagingSenderId: "313601369235",

};
const FB_PATH = 'velada/teg';

  role: null, // 'host' | 'phone' | 'tv' | 'test'

  db: null,
  activation: null, // ronda activada desde velada.html (velada/teg/activation)
  wantTeam: null, // equipo pedido por URL (?team=) desde participante.html
  // el id se guarda para que recargar la pestaña no cuente como "otro conductor"
  clientId: (function () {
    try {
      var v = localStorage.getItem('tegClientId');
      if (!v) { v = 'c' + Math.random().toString(36).slice(2, 10); localStorage.setItem('tegClientId', v); }

function fbInit() {
  if (LIVE.db) return LIVE.db;

    if (typeof firebase === 'undefined') return null;
    if (!firebase.apps.some((a) => a.name === '[DEFAULT]')) firebase.initializeApp(FB_CFG);

/** HOST: publica el estado completo (sin varias cosas que no hace
 * falta sincronizar) en velada/teg/state. */
function fbPushFullState(label) {
  if (LIVE.role !== 'host' || !STATE) return;
  const db = fbInit();
  if (!db) return;
  db.ref(FB_PATH + '/state').set(STATE).catch((e) => console.warn('No pude publicar el estado', e));
  db.ref(FB_PATH + '/meta').update({ updatedAt: Date.now(), label: label || null, active: STATE.phase !== 'ended', hostClient: LIVE.clientId }).catch(() => {});
}

/** PHONE: en vez de tocar el motor, deja un pedido para que el
 * conductor lo aplique. */
function fbSendAction(action) {
  const db = fbInit();
  if (!db) { deviceUI(action.teamId).msg = 'Sin conexión — no se pudo enviar.'; render(); return; }
  action.from = LIVE.clientId;
  action.ts = Date.now();
  db.ref(FB_PATH + '/actions').push(action).catch((e) => console.warn('No pude enviar la acción', e));
}

/** HOST: aplica un pedido llegado de un celular, usando el MISMO
 * motor y el mismo camino (afterAction) que usaría si el conductor
 * tocara la pantalla él mismo. */
function fbApplyAction(action) {
  if (!STATE || !ENGINE) return;
  const t = action.teamId;
  switch (action.type) {
    case 'allocDelta': ENGINE.allocateReinforcement(STATE, t, action.countryId, action.delta); break;
    case 'confirmReinforce': ENGINE.confirmReinforcement(STATE, t); break;
    case 'singleRoll': ENGINE.singleRoll(STATE, t, action.originId, action.destId); break;
    case 'attackUntilEnd': ENGINE.attackUntilEnd(STATE, t, action.originId, action.destId, 30); break;
    case 'confirmConquest': ENGINE.confirmConquestMove(STATE, t, action.amount); break;
    case 'regroup': ENGINE.regroup(STATE, t, action.fromId, action.toId, action.amount); break;
    case 'endTurn': ENGINE.endTeamTurn(STATE); break;
    default: console.warn('Acción desconocida de un celular:', action); return;
  }
  render();
  pumpAnimationQueue();
  fbPublishResultIfEnded();
  fbPushFullState();
}

/** Puntos que la partida le suma a cada equipo en el ranking de la Velada:
 * misma escala que Guess Movies — 3 al 1.º, 1 al 2.º (si hay más de 2
 * equipos) y 0 al resto. */
function veladaPointsFor(place, n) { return place === 1 ? 3 : (place === 2 && n > 2 ? 1 : 0); }

/** Las claves de Firebase no admiten . # $ / [ ] — mismo codificado que team-maps.js. */
function wireKey(name) { return encodeURIComponent(name).replace(/\./g, '%2E'); }

/** Tabla final: primero quien ganó (por objetivo o por tiempo), después por
 * países y por ejércitos. Si dos equipos empatan en todo comparten puesto. */
function computeFinalStandings() {
  const rows = STATE.teams.map((t) => {
    const ids = ENGINE.teamCountryIds(STATE, t.id);
    return {
      teamId: t.id, name: t.name, veladaName: t.veladaName || null, color: t.color,
      countries: ids.length, armies: ids.reduce((acc, cid) => acc + STATE.countries[cid].armies, 0),
      isWinner: STATE.winner === t.id,
    };
  });
  rows.sort((a, b) => (Number(b.isWinner) - Number(a.isWinner)) || (b.countries - a.countries) || (b.armies - a.armies));
  let place = 0;
  rows.forEach((r, i) => {
    const prev = rows[i - 1];
    const tie = prev && !r.isWinner && !prev.isWinner && prev.countries === r.countries && prev.armies === r.armies;
    place = tie ? place : i + 1;
    r.puesto = place;
    r.puntos = veladaPointsFor(place, rows.length);
  });
  return rows;
}

/** HOST: cuando termina la partida, publica la tabla final en
 * velada/teg/resultado. Si los equipos vienen de la Velada, también
 * publica `byTeam` (puntos por nombre de equipo, claves codificadas) y
 * el `activationId`: es lo que teg-fixture.js lee para cargar el
 * resultado en velada.html. */
function fbPublishResultIfEnded() {
  if (LIVE.role !== 'host' || !STATE || STATE.phase !== 'ended' || STATE._resultPublished) return;
  STATE._resultPublished = true;
  const standings = computeFinalStandings();
  STATE.finalStandings = standings; // la TV muestra los puntos de la ronda
  const db = fbInit();
  if (!db) return;
  const payload = {
    game: 'teg', winner: STATE.winner || null, winReason: STATE.winReason || null,
    standings, finishedAt: Date.now(), ts: Date.now(), activationId: STATE.activationId || null,
  };
  if (standings.every((r) => r.veladaName)) {
    const byTeam = {};
    standings.forEach((r) => { byTeam[wireKey(r.veladaName)] = r.puntos; });
    payload.byTeam = byTeam;
    payload.teamMapEncoding = 'uri-v1';
  }
  db.ref(FB_PATH + '/resultado').set(payload)
    .catch((e) => console.warn('No pude publicar el resultado', e));
}

/** HOST: escucha los pedidos de los celulares y los va aplicando en
 * el orden en que llegaron. Cada pedido se borra apenas se aplica. */
function fbListenActionsAsHost() {
  const db = fbInit();
  if (!db) return;
  db.ref(FB_PATH + '/actions').on('child_added', (snap) => {
    const action = snap.val();
    db.ref(FB_PATH + '/actions/' + snap.key).remove().catch(() => {});
    fbApplyAction(action);
  });
}

/** PHONE y TV secundaria: se limitan a reflejar velada/teg/state. */
// Firebase Realtime Database NO guarda objetos/arrays vacíos: al volver a leer el estado,
// {} y [] desaparecen (undefined) y el render del celular/TV se rompía en silencio (pantalla en blanco).
// Esta función los repone antes de usar el estado remoto.
function normalizeRemoteState(st) {
  if (!st || typeof st !== 'object') return st;
  ['reinforceAmount','reinforceAlloc','reinforceConfirmed','offensivesUsed','regroupUsed','countries'].forEach((k) => { if (!st[k] || typeof st[k] !== 'object') st[k] = {}; });
  ['teams','turnOrder','log','eventQueue'].forEach((k) => {
    if (!st[k]) st[k] = [];
    else if (!Array.isArray(st[k]) && typeof st[k] === 'object') st[k] = Object.keys(st[k]).sort((a, b) => a - b).map((i) => st[k][i]);
  });
  if (!st.stats || typeof st.stats !== 'object') st.stats = {};
  ['conquests','diceLost'].forEach((k) => { if (!st.stats[k] || typeof st.stats[k] !== 'object') st.stats[k] = {}; });
  if (!Array.isArray(st.stats.battles)) st.stats.battles = st.stats.battles ? Object.values(st.stats.battles) : [];
  st.teams.forEach((t) => { if (t && t.alive === undefined) t.alive = true; });
  return st;
}

function fbListenStateReadOnly() {
  const db = fbInit();
  if (!db) return;
  db.ref(FB_PATH + '/state').on('value', (snap) => {
    const remote = snap.val();
    if (!remote) { // la Velada reactivó la ronda y borró la partida anterior
      if (STATE) { STATE = null; ANIM_LAST_SEQ = 0; render(); }
      return;
    }
    STATE = normalizeRemoteState(remote);
    render();
    pumpAnimationQueue();
  });
}

// ============================================================
// RONDA DE LA VELADA (velada/teg/activation)
// "▶ Activar ronda" en velada.html escribe acá los equipos del
// ranking. El conductor los usa al tocar "Nueva partida".
// ============================================================
function fbListenActivation() {
  const db = fbInit();
  if (!db) return;
  db.ref(FB_PATH + '/activation').on('value', (snap) => {
    const a = snap.val();
    LIVE.activation = (a && a.active && Array.isArray(a.teams) && a.teams.length) ? a : null;
    syncActivation();
  });
}

function activationFits() {
  const a = LIVE.activation;
  return !!a && a.teams.length >= 2 && a.teams.length <= 6;
}

/** ¿Se arma la partida con los equipos de la Velada? */
function useVeladaTeams() {
  if (!activationFits()) return false;
  const cb = document.getElementById('useVeladaTeams');
  return !cb || cb.checked;
}

function rankTagHtml(t) {
  if (!t || !t.rankPos) return '';
  return '<span class="rankTag">#' + t.rankPos + (Number.isFinite(t.rankPts) ? ' · ' + t.rankPts + ' pts' : '') + '</span>';
}

function refreshActivationUI() {
  const banner = document.getElementById('veladaBanner');
  const sel = document.getElementById('numTeamsSel');
  const inp = document.getElementById('teamNamesInput');
  if (!banner || !sel || !inp) return;
  const a = LIVE.activation;
  if (LIVE.role !== 'host' || !a) {
    banner.style.display = 'none';
    sel.disabled = false; inp.readOnly = false;
    if (inp.dataset.auto === '1') { inp.value = ''; inp.dataset.auto = ''; }
    return;
  }
  const n = a.teams.length;
  const info = Array.isArray(a.info) ? a.info.slice() : [];
  const ordered = info.length === n ? info.slice().sort((x, y) => (x.pos || 99) - (y.pos || 99)) : a.teams.map((name) => ({ name }));
  const label = document.getElementById('useVeladaLabel');
  banner.style.display = 'block';
  let txt = '🎙️ <b>Ronda de la Velada activada</b>' + (a.round ? ' (ronda ' + escapeHtml(String(a.round)) + ')' : '') + ' · ';
  if (!activationFits()) {
    txt += 'la Velada tiene ' + n + ' equipos y TEG Express admite de 2 a 6: armá la partida a mano.';
    label.style.display = 'none';
  } else {
    txt += n + ' equipos del ranking: ' + ordered.map((r) => (r.pos ? '#' + r.pos + ' ' : '') + escapeHtml(String(r.name)) + (Number.isFinite(r.pts) ? ' (' + r.pts + ')' : '')).join(' · ');
    label.style.display = '';
  }
  document.getElementById('veladaBannerText').innerHTML = txt;
  if (useVeladaTeams()) {
    sel.value = String(n); sel.disabled = true;
    inp.value = a.teams.join(' · '); inp.readOnly = true; inp.dataset.auto = '1';
  } else {
    sel.disabled = false; inp.readOnly = false;
    if (inp.dataset.auto === '1') { inp.value = ''; inp.dataset.auto = ''; }
  }
}

function syncActivation() {
  // si la Velada activó otra ronda, la partida anterior ya no corresponde
  if (LIVE.role === 'host' && LIVE.activation && STATE && STATE.activationId !== LIVE.activation.id) {
    STATE = null; ANIM_LAST_SEQ = 0; REACTIONS = [];
  }
  refreshActivationUI();
  render();
}

/** Reacciones: cualquier dispositivo puede mandar una y todos las
 * ven — no pasan por el motor, así que no hace falta el host. */
function fbListenReactions() {
  const db = fbInit();
  if (!db) return;
  const startedAt = Date.now();
  db.ref(FB_PATH + '/reactions').limitToLast(20).on('child_added', (snap) => {
    const r = snap.val();
    if (!r || r.ts < startedAt - 4000) return; // no repetir reacciones viejas al conectar
    REACTIONS.push({ id: snap.key, emoji: r.emoji, x: 8 + Math.random() * 78, createdAt: Date.now() });
  });
}

const DEVICE_UI = {}; // teamId -> {mode, originId, destId, reinforceFocus, regroupFrom, regroupTo, regroupAmount, conquestAmount, msg}

function deviceUI(teamId) {
  if (!DEVICE_UI[teamId]) {
    DEVICE_UI[teamId] = { mode: 'attack', originId: null, destId: null, reinforceFocus: null, regroupFrom: null, regroupTo: null, regroupAmount: 1, conquestAmount: null, msg: '' };
  }
  return DEVICE_UI[teamId];
}
function resetDeviceUIForTurn(teamId) {
  DEVICE_UI[teamId] = { mode: 'attack', originId: null, destId: null, reinforceFocus: null, regroupFrom: null, regroupTo: null, regroupAmount: 1, conquestAmount: null, msg: '' };
}

// ---------- formato ----------
function fmtClock(totalSeconds) {
  const s = Math.max(0, Math.ceil(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
function teamById(teamId) { return STATE.teams.find((t) => t.id === teamId); }

function shapeBadgeMarkup(shape, cx, cy, s, fill) {
  const st = 'fill="' + fill + '" stroke="#0a1420" stroke-width="0.6"';
  switch (shape) {
    case 'circle': return '<circle cx="' + cx + '" cy="' + cy + '" r="' + s + '" ' + st + '/>';
    case 'square': return '<rect x="' + (cx - s) + '" y="' + (cy - s) + '" width="' + (2 * s) + '" height="' + (2 * s) + '" ' + st + '/>';
    case 'diamond': return '<polygon points="' + cx + ',' + (cy - s * 1.3) + ' ' + (cx + s * 1.3) + ',' + cy + ' ' + cx + ',' + (cy + s * 1.3) + ' ' + (cx - s * 1.3) + ',' + cy + '" ' + st + '/>';
    case 'triangle': return '<polygon points="' + cx + ',' + (cy - s * 1.3) + ' ' + (cx + s * 1.2) + ',' + (cy + s) + ' ' + (cx - s * 1.2) + ',' + (cy + s) + '" ' + st + '/>';
    case 'hexagon': {
      const pts = [];
      for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 6; pts.push((cx + s * 1.15 * Math.cos(a)).toFixed(1) + ',' + (cy + s * 1.15 * Math.sin(a)).toFixed(1)); }
      return '<polygon points="' + pts.join(' ') + '" ' + st + '/>';
    }
    case 'star': {
      const pts = [];
      for (let i = 0; i < 10; i++) { const a = Math.PI / 5 * i - Math.PI / 2; const r = i % 2 === 0 ? s * 1.4 : s * 0.6; pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
      return '<polygon points="' + pts.join(' ') + '" ' + st + '/>';
    }
    default: return '';
  }
}

function chipsMarkup(cx, cy, radius, armies, color) {
  const ficha = ENGINE.CONFIG.fichaGrandeEquivale;
  let out = '';
  if (armies <= 6) {
    const pts = PIPS[armies] || PIPS[6];
    const r = radius * 0.22;
    pts.forEach(([dx, dy]) => {
      out += '<circle class="chipSmall" cx="' + (cx + dx * radius * 0.62).toFixed(1) + '" cy="' + (cy + dy * radius * 0.62).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + color + '"/>';
    });
    return out;
  }
  const big = Math.floor(armies / ficha);
  const rem = armies % ficha;
  if (big > 6) {
    out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (radius * 0.75).toFixed(1) + '" fill="' + color + '" class="chipBig"/>';
    out += '<text class="chipNum" x="' + cx + '" y="' + cy + '">' + armies + '</text>';
    return out;
  }
  const pts = PIPS[big] || [];
  const rB = radius * 0.3;
  pts.forEach(([dx, dy]) => {
    out += '<circle class="chipBig" cx="' + (cx + dx * radius * 0.6).toFixed(1) + '" cy="' + (cy + dy * radius * 0.6).toFixed(1) + '" r="' + rB.toFixed(1) + '" fill="' + color + '"/>';
  });
  if (rem > 0) {
    out += '<circle class="chipSmall" cx="' + (cx + radius * 0.68).toFixed(1) + '" cy="' + (cy + radius * 0.68).toFixed(1) + '" r="' + (radius * 0.26).toFixed(1) + '" fill="#07131f" stroke="' + color + '" stroke-width="1"/>';
    out += '<text class="chipNum" x="' + (cx + radius * 0.68).toFixed(1) + '" y="' + (cy + radius * 0.68).toFixed(1) + '" style="font-size:6px;">+' + rem + '</text>';
  }
  return out;
}

/**
 * Dibuja el mapa como SVG.
 * opts: {
 *   showNumbers: bool,        // mostrar el número total además de las fichas (celular)
 *   clickTeamId: string|null, // si está, los países propios/atacables son tappables
 *   originId, destIds:[],     // resaltes de selección de ataque
 *   regroupFrom, regroupTo,
 *   dimToTeamId: string|null, // en TV: atenuar todo lo que no sea el equipo en turno
 *   small: bool
 * }
 */
function shadeHex(hex, amt) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const h = hex.slice(1);
  const ch = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16));
  const f = (v) => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return 'rgb(' + f(ch[0]) + ',' + f(ch[1]) + ',' + f(ch[2]) + ')';
}
const MAP_OUTLINES = '<g fill="none" stroke="#2a1608" stroke-width="1" stroke-linejoin="round">' +
  COUNTRIES.map((c) => '<use href="#cp-' + c.id + '"/>').join('') + '</g>';

function renderMapSVG(opts) {
  opts = opts || {};
  const big = !opts.small;

  let lands = '', glowLands = '', nodes = '';
  COUNTRIES.forEach((c) => {
    const cs = STATE.countries[c.id];
    const team = teamById(cs.owner);
    const R = Math.max(8, Math.min(RADIUS[c.size], (c.r || 99) * 0.95));
    const isOnTurnTeam = opts.dimToTeamId ? cs.owner === opts.dimToTeamId : true;
    const dim = opts.dimToTeamId && !isOnTurnTeam ? ' countryDim' : '';
    let glow = '';
    if (opts.originId === c.id) glow = ' countryGlow';
    if (opts.destIds && opts.destIds.indexOf(c.id) !== -1) glow = ' countryGlow';
    if (opts.regroupFrom === c.id || opts.regroupTo === c.id) glow = ' countryGlow';
    if (opts.reinforceFocus === c.id) glow = ' countryGlow';

    let clickAttr = '';
    if (opts.clickTeamId) {
      clickAttr = ' onclick="handleMapClick(\'' + opts.clickTeamId + '\',\'' + c.id + '\')"';
    }

    // forma real del país: relleno del color del dueño + borde de costa más oscuro (clipeado al país)
    const landG = '<g class="landNode' + dim + glow + '" data-land="' + c.id + '">' +
      '<use href="#cp-' + c.id + '" fill="' + team.color + '"/>' +
      '<use href="#cp-' + c.id + '" clip-path="url(#cc-' + c.id + ')" fill="none" stroke="' + shadeHex(team.color, -0.32) + '" stroke-width="3.6" stroke-opacity=".7"/>' +
      '</g>';
    if (glow) glowLands += landG; else lands += landG;

    nodes += '<g class="countryNode' + dim + glow + '" data-cid="' + c.id + '">';
    nodes += '<circle class="chipDisc" cx="' + c.x + '" cy="' + c.y + '" r="' + R + '"/>';
    nodes += shapeBadgeMarkup(team.shape, c.x + R * 0.66, c.y - R * 0.66, Math.max(2.6, R * 0.3), team.color);
    nodes += chipsMarkup(c.x, c.y, R, cs.armies, '#fff4d6');
    if (opts.showNumbers) {
      nodes += '<text class="chipNum" x="' + c.x + '" y="' + (c.y + R + 6) + '" style="fill:#ffd966;stroke:#07131f;font-size:6.5px;">' + cs.armies + '</text>';
    }
    if (!opts.small || opts.showNumbers) {
      nodes += '<text class="countryLabel" x="' + c.x + '" y="' + (c.y - R - 3) + '" style="font-size:' + (opts.small ? 6 : 7) + 'px;">' + c.name + '</text>';
    }
    if (clickAttr) {
      nodes += '<g transform="' + ART_T + '"><use href="#cp-' + c.id + '" class="countryHit"' + clickAttr + '/></g>';
    }
    nodes += '</g>';
  });

  const art = '<g transform="' + ART_T + '">' +
    MAP_ART.bgPre +
    (big ? MAP_ART.ripples : '') +
    MAP_ART.isles +
    lands + glowLands +
    MAP_OUTLINES +
    MAP_ART.bgBridge +
    (big ? MAP_ART.bgText : '') +
    '</g>';

  return (
    '<svg viewBox="0 0 ' + MAP_W + ' ' + MAP_H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker></defs>' +
    '<rect width="' + MAP_W + '" height="' + MAP_H + '" fill="url(#mapParch)"/>' +
    (big ? '<rect width="' + MAP_W + '" height="' + MAP_H + '" fill="url(#mapPaper)" opacity=".28" style="mix-blend-mode:multiply"/>' : '') +
    art +
    (big ? '<rect width="' + MAP_W + '" height="' + MAP_H + '" fill="url(#mapVign)" pointer-events="none"/>' : '') +
    '<rect class="mapFrame" x="3" y="3" width="' + (MAP_W - 6) + '" height="' + (MAP_H - 6) + '" stroke-width="3"/>' +
    '<rect class="mapFrame" x="8" y="8" width="' + (MAP_W - 16) + '" height="' + (MAP_H - 16) + '" stroke-width=".8"/>' +
    nodes +
    '</svg>'
  );
}

// ============================================================
// SONIDO (Web Audio, sin archivos externos) — no arranca hasta
// que el conductor lo active (restricción de autoplay).
// ============================================================
var AUDIO_CTX = null;
var AUDIO_VOLUME = 0.5;
var AUDIO_MUTED = false;

function initAudio() {
  if (AUDIO_CTX || !POLISH.sound) return;
  try {
    AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { /* sin soporte: seguimos sin sonido */ }
}
function tone(freq, dur, type, gainMul) {
  if (!AUDIO_CTX || AUDIO_MUTED || !POLISH.sound) return;
  const t0 = AUDIO_CTX.currentTime;
  const osc = AUDIO_CTX.createOscillator();
  const gain = AUDIO_CTX.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  const g = AUDIO_VOLUME * (gainMul == null ? 1 : gainMul);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(g, 0.0005), t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(AUDIO_CTX.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
function sfxDice() { tone(320, 0.09, 'square', 0.35); setTimeout(() => tone(260, 0.08, 'square', 0.3), 70); }
function sfxHit() { tone(110, 0.18, 'sawtooth', 0.5); }
function sfxConquest() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.4), i * 90)); }
function sfxContinent() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.45), i * 110)); }
function sfxRegroup() { tone(220, 0.12, 'sine', 0.3); }
function sfxAlert() { [660, 0, 660].forEach((f, i) => setTimeout(() => { if (f) tone(f, 0.16, 'square', 0.4); }, i * 180)); }

function vibrate(pattern) {
  if (!POLISH.vibration) return;
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

// ============================================================
// COLA DE ANIMACIÓN DE LA TV — consume STATE.eventQueue de a un
// evento por vez (combate, conquista, reagrupe, continente) para
// que la TV pueda mostrar el "suspenso" antes de revelar el
// resultado final (que ya está aplicado en STATE).
// ============================================================
var ANIM_ACTIVE = null;
var ANIM_PHASE = 'idle'; // 'rolling' | 'result' | 'idle'
var ANIM_BUSY = false;
var ANIM_LAST_SEQ = 0; // hasta qué evento (por seq) ya animamos EN ESTE dispositivo

function pumpAnimationQueue() {
  if (ANIM_BUSY || !STATE || !STATE.eventQueue || !STATE.eventQueue.length) return;
  const ev = STATE.eventQueue.find((e) => e.seq > ANIM_LAST_SEQ);
  if (!ev) return;
  ANIM_LAST_SEQ = ev.seq;
  const animatedTypes = ['combat', 'conquest', 'regroup', 'continent-bonus', 'low-countries'];
  if (animatedTypes.indexOf(ev.type) === -1) {
    pumpAnimationQueue();
    return;
  }
  if (ev.type === 'low-countries' && !POLISH.dramaticAlerts) { pumpAnimationQueue(); return; }
  if (ev.type === 'continent-bonus' && !POLISH.continentBanner) { pumpAnimationQueue(); return; }
  ANIM_BUSY = true;
  ANIM_ACTIVE = ev;

  if (ev.type === 'combat') {
    ANIM_PHASE = POLISH.diceSuspense ? 'rolling' : 'result';
    sfxDice();
    const rollMs = POLISH.diceSuspense ? (ev.firstOfOffensive ? 650 : 280) : 0;
    render();
    setTimeout(() => {
      ANIM_PHASE = 'result';
      sfxHit();
      if (ev.destId && STATE && teamById(STATE.countries[ev.destId] && STATE.countries[ev.destId].owner)) vibrate(60);
      render();
      const parejo = ev.atkLoss > 0 && ev.defLoss > 0;
      const resultMs = (ev.firstOfOffensive ? 1050 : 420) + (parejo ? 350 : 0);
      setTimeout(finishAnim, resultMs);
    }, rollMs);
  } else if (ev.type === 'conquest') {
    sfxConquest();
    vibrate([40, 30, 80]);
    render();
    setTimeout(finishAnim, 1500);
  } else if (ev.type === 'regroup') {
    sfxRegroup();
    render();
    setTimeout(finishAnim, 850);
  } else if (ev.type === 'continent-bonus') {
    sfxContinent();
    render();
    setTimeout(finishAnim, 1800);
  } else if (ev.type === 'low-countries') {
    sfxAlert();
    vibrate([50, 60, 50, 60, 50]);
    render();
    setTimeout(finishAnim, 1700);
  } else {
    finishAnim();
  }
}
function finishAnim() {
  ANIM_ACTIVE = null;
  ANIM_PHASE = 'idle';
  ANIM_BUSY = false;
  render();
  pumpAnimationQueue();
}

function dieFace(n, cls) { return '<div class="die ' + (cls || '') + '">' + n + '</div>'; }

function renderAnimOverlay() {
  if (!ANIM_ACTIVE) return '';
  const ev = ANIM_ACTIVE;
  if (ev.type === 'combat') {
    const rolling = ANIM_PHASE === 'rolling';
    const atkName = BY_ID[ev.originId].name, defName = BY_ID[ev.destId].name;
    const atkDiceHtml = ev.atkDice.map((d, i) => {
      const lose = !rolling && i < ev.defDice.length && d <= ev.defDice[i];
      return dieFace(rolling ? '?' : d, (rolling ? 'rolling' : '') + (lose ? ' lose' : ''));
    }).join('');
    const defDiceHtml = ev.defDice.map((d, i) => {
      const lose = !rolling && i < ev.atkDice.length && ev.atkDice[i] > d;
      return dieFace(rolling ? '?' : d, (rolling ? 'rolling' : '') + (lose ? ' lose' : ''));
    }).join('');
    return '<div class="diceBox">' +
      '<div class="diceLabel">⚔️ ' + escapeHtml(atkName) + ' ataca ' + escapeHtml(defName) + '</div>' +
      '<div class="diceRow"><div class="diceGroup">' + atkDiceHtml + '</div><span class="vs">VS</span><div class="diceGroup">' + defDiceHtml + '</div></div>' +
      (!rolling ? '<div class="diceLabel">Pierde ataque ' + ev.atkLoss + ' · Pierde defensa ' + ev.defLoss + '</div>' : '') +
      '</div>';
  }
  if (ev.type === 'conquest') {
    const c = BY_ID[ev.destId];
    const team = teamById(ev.teamId);
    let ring = '';
    if (POLISH.conquestWave) {
      ring = '<svg viewBox="0 0 ' + MAP_W + ' ' + MAP_H + '" style="position:absolute;inset:0;width:100%;height:100%;"><g transform="translate(' + MARGIN + ',' + MARGIN + ')">' +
        '<circle class="waveRing" cx="' + c.x + '" cy="' + c.y + '" r="4" stroke="' + team.color + '"/></g></svg>';
    }
    return ring + '<div class="conquestBanner"><div class="txt">🏳️ ' + escapeHtml(team.name) + ' conquista ' + escapeHtml(c.name) + '</div></div>';
  }
  if (ev.type === 'continent-bonus') {
    const team = teamById(ev.teamId);
    const contName = CONTINENTS[ev.cont].name;
    return '<div class="continentBanner">🌎 <b>' + escapeHtml(team.name) + '</b> completó<br><b>' + escapeHtml(contName) + '</b> · +' + ev.bonus + ' ejércitos</div>';
  }
  if (ev.type === 'low-countries') {
    const team = teamById(ev.teamId);
    return '<div class="continentBanner" style="border-color:var(--bad);"><span style="color:var(--bad);">⚠️ ¡' + escapeHtml(team.name) + ' está contra las cuerdas!</span><br>Le queda' + (ev.count === 1 ? '' : 'n') + ' ' + ev.count + ' país' + (ev.count === 1 ? '' : 'es') + '</div>';
  }
  return '';
}

/** Para el zoom automático de la TV: centro + escala según el evento activo. */
function computeZoomTransform() {
  if (!POLISH.autoZoom || !ANIM_ACTIVE) return '';
  const ev = ANIM_ACTIVE;
  let ids = [];
  if (ev.type === 'combat') ids = [ev.originId, ev.destId];
  else if (ev.type === 'conquest') ids = [ev.originId, ev.destId];
  else if (ev.type === 'regroup') ids = [ev.fromId, ev.toId];
  if (!ids.length) return '';
  const pts = ids.map((id) => BY_ID[id]);
  const cx = (pts[0].x + pts[1].x) / 2 + MARGIN;
  const cy = (pts[0].y + pts[1].y) / 2 + MARGIN;
  const scale = 2.1;
  const originXPct = (cx / (MAP_W + MARGIN * 2)) * 100;
  const originYPct = (cy / (MAP_H + MARGIN * 2)) * 100;
  return 'transform-origin:' + originXPct.toFixed(1) + '% ' + originYPct.toFixed(1) + '%; transform:scale(' + scale + ');';
}

// ============================================================
// ACCIONES (llamadas desde la UI, mutan STATE vía ENGINE)

function afterAction() { render(); pumpAnimationQueue(); fbPublishResultIfEnded(); }

window.handleMapClick = function (teamId, countryId) {
  if (!STATE || STATE.phase === 'ended') return;
  const ui = deviceUI(teamId);
  ui.msg = '';
  if (STATE.phase === 'reinforce') {
    if (STATE.countries[countryId].owner !== teamId) return;
    ui.reinforceFocus = countryId;
    afterAction();
    return;
  }
  if (STATE.phase !== 'attack' || ENGINE.currentTeamId(STATE) !== teamId) return;
  if (STATE.pendingConquest) return;

  if (ui.mode === 'regroup') {
    const cs = STATE.countries[countryId];
    if (!ui.regroupFrom) {
      if (cs.owner !== teamId || cs.armies < 2) { ui.msg = 'Elegí un país tuyo con más de 1 ejército.'; afterAction(); return; }
      ui.regroupFrom = countryId;
    } else if (!ui.regroupTo) {
      if (countryId === ui.regroupFrom) { ui.regroupFrom = null; afterAction(); return; }
      if (cs.owner !== teamId || !ENGINE.isNeighbor(ui.regroupFrom, countryId)) { ui.msg = 'Tiene que ser un país tuyo limítrofe.'; afterAction(); return; }
      ui.regroupTo = countryId;
      ui.regroupAmount = 1;
    }
    afterAction();
    return;
  }

  // modo ataque
  const cs = STATE.countries[countryId];
  if (!ui.originId) {
    if (cs.owner !== teamId || cs.armies < 2) { ui.msg = 'Elegí un país tuyo con más de 1 ejército.'; afterAction(); return; }
    ui.originId = countryId;
    ui.destId = null;
  } else if (!ui.destId) {
    if (countryId === ui.originId) { ui.originId = null; afterAction(); return; }
    const check = ENGINE.canAttack(STATE, teamId, ui.originId, countryId);
    if (!check.ok) { ui.msg = check.error; afterAction(); return; }
    ui.destId = countryId;
  } else {
    // ya hay origen+destino elegidos: tocar otro país propio cambia el origen
    if (cs.owner === teamId && cs.armies > 1) { ui.originId = countryId; ui.destId = null; }
  }
  afterAction();
};

window.doNewGame = function (teamNames) {
  const act = useVeladaTeams() ? LIVE.activation : null;
  const n = act ? act.teams.length : parseInt(document.getElementById('numTeamsSel').value, 10);
  ENGINE = TegEngine.createEngine(COUNTRIES, CONTINENTS, {});
  STATE = ENGINE.setupGame(n, act ? act.teams.slice() : teamNames);
  if (act) {
    // equipos y ranking de la Velada: nombre exacto para devolver los puntos, y posición/puntos para mostrar
    STATE.activationId = act.id;
    STATE.teams.forEach((t, i) => {
      t.veladaName = String(act.teams[i]);
      const inf = act.info && act.info[i];
      if (inf) {
        if (Number.isFinite(inf.pos)) t.rankPos = inf.pos;
        if (Number.isFinite(inf.pts)) t.rankPts = inf.pts;
        if (Array.isArray(inf.members) && inf.members.length) t.members = inf.members.map(String);
      }
    });
  }
  STATE.teams.forEach((t) => resetDeviceUIForTurn(t.id));
  ANIM_LAST_SEQ = 0;
  REACTIONS = [];
  if (LIVE.role === 'host') { // sin restos de la partida anterior
    const db = fbInit();
    if (db) {
      db.ref(FB_PATH + '/resultado').remove().catch(() => {});
      db.ref(FB_PATH + '/actions').remove().catch(() => {});
    }
  }
  render();
  fbPushFullState('Nueva partida (' + n + ' equipos)');
};

window.doTogglePause = function () {
  if (!STATE || LIVE.role === 'phone') return; // pausar es cosa del conductor
  STATE.paused = !STATE.paused;
  render();
  fbPushFullState();
};

// Helper: en 'phone' el pedido se manda a Firebase y lo aplica el
// conductor; en 'host'/'test' se aplica acá mismo con el motor.
function dispatchOrSend(teamId, action, applyLocally) {
  if (LIVE.role === 'phone') {
    fbSendAction(Object.assign({ teamId }, action));
    return;
  }
  applyLocally();
  if (LIVE.role === 'host') fbPushFullState();
}

window.doAllocDelta = function (teamId, countryId, delta) {
  dispatchOrSend(teamId, { type: 'allocDelta', countryId, delta }, () => {

    deviceUI(teamId).msg = r.ok ? '' : r.error;

window.doConfirmReinforce = function (teamId) {

    ENGINE.confirmReinforcement(STATE, teamId);
    afterAction();
  });
};

window.doSingleRoll = function (teamId) {
  const ui = deviceUI(teamId);
  if (!ui.originId || !ui.destId) return;
  dispatchOrSend(teamId, { type: 'singleRoll', originId: ui.originId, destId: ui.destId }, () => {
    const r = ENGINE.singleRoll(STATE, teamId, ui.originId, ui.destId);
    if (!r.ok) { ui.msg = r.error; afterAction(); return; }
    if (r.conquered) ui.conquestAmount = STATE.pendingConquest.maxMove;

  });

window.doAttackUntilEnd = function (teamId) {

  if (!ui.originId || !ui.destId) return;
  dispatchOrSend(teamId, { type: 'attackUntilEnd', originId: ui.originId, destId: ui.destId }, () => {
    const r = ENGINE.attackUntilEnd(STATE, teamId, ui.originId, ui.destId, 30);
    if (!r.ok) { ui.msg = r.error; afterAction(); return; }
    if (STATE.pendingConquest) ui.conquestAmount = STATE.pendingConquest.maxMove;
    else { ui.originId = null; ui.destId = null; }
    afterAction();
  });
};

window.doConquestAmount = function (teamId, delta) {
  // ajuste puramente local de la UI, no hace falta avisarle a nadie
  // hasta que se confirme
  const ui = deviceUI(teamId);
  const pc = STATE.pendingConquest;
  if (!pc) return;
  let n = (ui.conquestAmount == null ? pc.maxMove : ui.conquestAmount) + delta;
  n = Math.max(pc.minMove, Math.min(pc.maxMove, n));
  ui.conquestAmount = n;
  render();
};

window.doConfirmConquest = function (teamId) {
  const ui = deviceUI(teamId);
  const pc = STATE.pendingConquest;
  if (!pc) return;
  const n = ui.conquestAmount == null ? pc.maxMove : ui.conquestAmount;
  dispatchOrSend(teamId, { type: 'confirmConquest', amount: n }, () => {
    ENGINE.confirmConquestMove(STATE, teamId, n);
    afterAction();
  });
  ui.originId = null; ui.destId = null; ui.conquestAmount = null;
  if (LIVE.role === 'phone') render();
};

window.doSetMode = function (teamId, mode) {
  const ui = deviceUI(teamId);
  ui.mode = mode; ui.originId = null; ui.destId = null; ui.regroupFrom = null; ui.regroupTo = null; ui.msg = '';
  render();
};

window.doRegroupAmount = function (teamId, delta) {
  const ui = deviceUI(teamId);
  if (!ui.regroupFrom) return;
  const max = STATE.countries[ui.regroupFrom].armies - 1;
  ui.regroupAmount = Math.max(1, Math.min(max, (ui.regroupAmount || 1) + delta));
  render();
};

window.doConfirmRegroup = function (teamId) {
  const ui = deviceUI(teamId);
  if (!ui.regroupFrom || !ui.regroupTo) return;
  const payload = { fromId: ui.regroupFrom, toId: ui.regroupTo, amount: ui.regroupAmount || 1 };
  dispatchOrSend(teamId, Object.assign({ type: 'regroup' }, payload), () => {
    const r = ENGINE.regroup(STATE, teamId, payload.fromId, payload.toId, payload.amount);
    if (!r.ok) { ui.msg = r.error; afterAction(); return; }
    ui.regroupFrom = null; ui.regroupTo = null; ui.mode = 'attack';
    afterAction();
  });
  if (LIVE.role === 'phone') { ui.regroupFrom = null; ui.regroupTo = null; ui.mode = 'attack'; render(); }
};

window.doEndTurn = function (teamId) {
  if (ENGINE.currentTeamId(STATE) !== teamId) return;
  dispatchOrSend(teamId, { type: 'endTurn' }, () => {
    const r = ENGINE.endTeamTurn(STATE);
    if (!r.ok) { deviceUI(teamId).msg = r.error; afterAction(); return; }
    resetDeviceUIForTurn(ENGINE.currentTeamId(STATE));
    afterAction();

window.doDriverSkipTurn = function () {
  if (!STATE || STATE.phase !== 'attack' || LIVE.role === 'phone') return;
  const teamId = ENGINE.currentTeamId(STATE);
  const r = ENGINE.endTeamTurn(STATE);

window.doSendReaction = function (teamId, emoji) {
  if (!POLISH.reactions || !STATE) return;
  const ui = deviceUI(teamId);
  const now = Date.now();
  if (ui.lastReactionAt && now - ui.lastReactionAt < REACTION_COOLDOWN_MS) return;
  ui.lastReactionAt = now;
  if (LIVE.role === 'phone' || LIVE.role === 'host') {
    const db = fbInit();
    if (db) db.ref(FB_PATH + '/reactions').push({ emoji, teamId, ts: now }).catch(() => {});
    if (LIVE.role === 'host') REACTIONS.push({ id: Math.random(), emoji, x: 8 + Math.random() * 78, createdAt: now });
  } else {
    REACTIONS.push({ id: Math.random(), emoji, x: 8 + Math.random() * 78, createdAt: now });
  }
  if (REACTIONS.length > 30) REACTIONS.shift();
};

function renderReactionsLayer() {
  if (!POLISH.reactions) return;
  const host = document.getElementById('reactionsLayer');
  if (!host) return;
  const now = Date.now();
  REACTIONS = REACTIONS.filter((r) => now - r.createdAt < 2600);
