window.doSetVolume = function (v) { AUDIO_VOLUME = parseFloat(v); };

// ============================================================
// RENDER: TV
// ============================================================
function renderTV() {
  const mapHost = document.getElementById('mapDynamic');
  const tvRoundLabel = document.getElementById('tvRoundLabel');
  const tvClock = document.getElementById('tvClock');
  const tvTeams = document.getElementById('tvTeams');
  const tvHistory = document.getElementById('tvHistory');

  if (!STATE) {
    mapHost.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim);">' + (LIVE.role === 'tv' ? 'Esperando a que empiece la partida…' : 'Tocá "Nueva partida" para empezar.') + '</div>';
    tvRoundLabel.textContent = 'Ronda —';
    tvClock.textContent = '00:00';
    tvTeams.innerHTML = '';
    tvHistory.innerHTML = '';
    return;
  }

  const onTurnTeam = STATE.phase === 'attack' ? ENGINE.currentTeamId(STATE) : null;
  const zoomStyle = computeZoomTransform();
  mapHost.innerHTML =
    '<div id="mapZoomWrap" style="' + zoomStyle + '">' + renderMapSVG({ showNumbers: false, dimToTeamId: onTurnTeam }) + '</div>' +
    '<div id="animOverlay">' + renderAnimOverlay() + '</div>';

  // "fichas que saltan": marcamos las últimas N fichas del bando
  // perdedor en el resultado de un combate (post-proceso del DOM
  // recién pintado, no forma parte del estado del juego).
  if (ANIM_ACTIVE && ANIM_ACTIVE.type === 'combat' && ANIM_PHASE === 'result') {
    const ev = ANIM_ACTIVE;
    if (ev.atkLoss > 0) markChipsLost(ev.originId, ev.atkLoss);
    if (ev.defLoss > 0) markChipsLost(ev.destId, ev.defLoss);
  }

  if (STATE.phase === 'ended') {
    const w = STATE.winner ? teamById(STATE.winner) : null;
    mapHost.innerHTML += '<div id="tvFinal"><div style="font-size:14px;color:var(--text-dim);">🏆 FIN DE LA PARTIDA</div>' +
      '<div style="font-size:26px;font-weight:800;color:' + (w ? w.color : 'var(--gold)') + ';">' + (w ? w.name : '—') + '</div>' +
      '<div style="font-size:13px;color:var(--text-dim);max-width:320px;">' + (STATE.winReason || '') + '</div>' +
      (STATE.finalStandings ? '<div style="margin:8px 0;font-size:13px;text-align:left;">' + STATE.finalStandings.map((r) => '<div>' + r.puesto + '° ' + escapeHtml(r.name) + ' <b style="color:var(--gold);">+' + r.puntos + ' pts</b></div>').join('') + '</div>' : '') +
      (POLISH.closingSummary ? renderClosingSummary() : '') +
      '</div>';
  }

  const totalSec = ENGINE.CONFIG.duracionPartidaMinutos * 60;
  const remaining = totalSec - STATE.elapsedGameSeconds;
  tvRoundLabel.textContent = 'Ronda ' + STATE.round + (STATE.timeUp ? ' (última)' : '') + ' · ' + (STATE.phase === 'reinforce' ? 'Refuerzos' : STATE.phase === 'attack' ? 'Ataque' : 'Fin');
  tvClock.textContent = fmtClock(Math.max(0, remaining)) + ' restante de partida';

  const lastMinute = POLISH.lastMinuteRed && STATE.phase !== 'ended' && remaining > 0 && remaining <= 60;
  document.getElementById('tvWrap').classList.toggle('lastMinute', lastMinute);
  if (lastMinute) tvClock.classList.add('lastMinuteText'); else tvClock.classList.remove('lastMinuteText');

  tvTeams.innerHTML = STATE.teams.map((t) => {
    const cnt = ENGINE.teamCountryIds(STATE, t.id).length;
    const isTurn = onTurnTeam === t.id;
    return '<div class="teamChipRow' + (isTurn ? ' onturn' : '') + '" style="' + (!t.alive ? 'opacity:.35;' : '') + '">' +
      '<span class="dot" style="background:' + t.color + ';"></span>' +
      '<span style="flex:1;">' + escapeHtml(t.name) + rankTagHtml(t) + '</span><b>' + cnt + '</b></div>';
  }).join('');

  tvHistory.innerHTML = STATE.log.slice(-40).map((l) => '<div>' + escapeHtml(l.text) + '</div>').join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function topTeamBy(dict) {
  let bestId = null, bestVal = -1;
  Object.keys(dict || {}).forEach((tid) => { if (dict[tid] > bestVal) { bestVal = dict[tid]; bestId = tid; } });
  return bestId ? { team: teamById(bestId), value: bestVal } : null;
}

function renderClosingSummary() {
  const stats = STATE.stats || {};
  const rows = [];

  const conq = topTeamBy(stats.conquests);
  if (conq) rows.push('🗡️ <b>Más conquistas:</b> ' + escapeHtml(conq.team.name) + ' (' + conq.value + ')');

  const lost = topTeamBy(stats.diceLost);
  if (lost) rows.push('💀 <b>Más dados perdidos:</b> ' + escapeHtml(lost.team.name) + ' (' + lost.value + ')');

  let bestBattle = null;
  if (stats.battles && stats.battles.length) {
    bestBattle = stats.battles.slice().sort((a, b) => (b.totalDice - a.totalDice) || (Math.abs(a.atkLoss - a.defLoss) - Math.abs(b.atkLoss - b.defLoss)))[0];
  }
  if (bestBattle) {
    rows.push('⚖️ <b>Batalla más pareja:</b> ' + escapeHtml(teamById(bestBattle.teamId).name) + ' vs ' + escapeHtml(teamById(bestBattle.defTeamId).name) +
      ' en ' + escapeHtml(BY_ID[bestBattle.destId].name) + ' (' + bestBattle.atkDice.join('-') + ' vs ' + bestBattle.defDice.join('-') + ')');
  }

  let replay = '';
  const da = stats.decisiveAttack;
  if (da) {
    replay = '<div class="diceLabel" style="margin-top:6px;">🎬 Ataque decisivo — ' + escapeHtml(BY_ID[da.originId].name) + ' → ' + escapeHtml(BY_ID[da.destId].name) + '</div>' +
      '<div class="diceRow"><div class="diceGroup">' + da.atkDice.map((d, i) => dieFace(d, i < da.defDice.length && d <= da.defDice[i] ? 'lose' : '')).join('') +
      '</div><span class="vs">VS</span><div class="diceGroup">' + da.defDice.map((d, i) => dieFace(d, i < da.atkDice.length && da.atkDice[i] > d ? 'lose' : '')).join('') + '</div></div>';
  }

  if (!rows.length && !replay) return '';
  return '<div class="diceBox" style="margin-top:8px;max-width:360px;">' +
    '<div style="font-size:12px;color:var(--text-dim);text-align:left;line-height:1.9;">' + rows.join('<br>') + '</div>' +
    replay + '</div>';
}

function markChipsLost(countryId, n) {
  if (!POLISH.chipVolume) return; // reutilizamos la misma bandera de "fichas con volumen"
  const g = document.querySelector('#mapHost [data-cid="' + countryId + '"]');
  if (!g) return;
  const chips = g.querySelectorAll('.chipSmall, .chipBig');
  const list = Array.prototype.slice.call(chips).slice(-n);
  list.forEach((el) => el.classList.add('chipJump'));
}

// ============================================================
// RENDER: CONDUCTOR
// ============================================================
function renderDriver() {
  const host = document.getElementById('driverHost');
  if (!STATE) {
    host.innerHTML = '<div style="padding:14px;color:var(--text-dim);">Sin partida activa.</div>';
    return;
  }
  const onTurnTeam = STATE.phase === 'attack' ? teamById(ENGINE.currentTeamId(STATE)) : null;
  let html = '<div class="device" style="flex:1 1 auto; min-height:0; width:auto;">';
  html += '<div class="devHead"><b>Estado de la partida</b><span class="phaseBadge">' + (STATE.paused ? 'PAUSADA' : STATE.phase.toUpperCase()) + '</span></div>';
  html += '<div class="driverGrid">';
  html += '<div class="drow">Ronda<br><b>' + STATE.round + '</b></div>';
  html += '<div class="drow">Fase<br><b>' + STATE.phase + '</b></div>';
  html += '<div class="drow">En turno<br><b>' + (onTurnTeam ? onTurnTeam.name : '—') + '</b></div>';
  html += '<div class="drow">Reloj fase<br><b>' + fmtClock(STATE.phaseTimer) + '</b></div>';
  html += '<div class="drow">Tiempo total<br><b>' + fmtClock(STATE.elapsedGameSeconds) + ' / ' + (ENGINE.CONFIG.duracionPartidaMinutos) + 'm</b></div>';
  html += '</div>';
  html += '<div class="footerBtns" style="margin-top:8px;">';
  html += '<button class="ghost" onclick="doDriverSkipTurn()" ' + (STATE.phase !== 'attack' ? 'disabled' : '') + '>⏭️ Saltear turno</button>';
  html += '<button class="ghost" onclick="doTogglePause()">' + (STATE.paused ? '▶️ Reanudar' : '⏸️ Pausar') + '</button>';
  html += '</div>';
  if (POLISH.sound) {
    html += '<div class="footerBtns" style="margin-top:6px;align-items:center;">';
    html += AUDIO_CTX
      ? '<button class="ghost small" onclick="doToggleMute()">' + (AUDIO_MUTED ? '🔇 Sonido apagado' : '🔊 Sonido activo') + '</button>'
      : '<button class="primary small" onclick="doActivateAudio()">🔊 Activar audio</button>';
    html += '<input type="range" min="0" max="1" step="0.05" value="' + AUDIO_VOLUME + '" oninput="doSetVolume(this.value)" style="flex:1;"/>';
    html += '</div>';
  }
  html += '</div>';
  host.innerHTML = html;
}

// ============================================================
// RENDER: CELULARES (uno por equipo)
// ============================================================
function renderDevices() {
  const row = document.getElementById('devicesRow');
  if (!STATE) { row.innerHTML = ''; return; }
  row.innerHTML = STATE.teams.map((t) => renderDeviceCard(t)).join('');
}

function renderDeviceCard(team) {
  const ui = deviceUI(team.id);
  const isMyReinforce = STATE.phase === 'reinforce';
  const isMyAttackTurn = STATE.phase === 'attack' && ENGINE.currentTeamId(STATE) === team.id;
  const myCount = ENGINE.teamCountryIds(STATE, team.id).length;

  let body = '';

  if (!team.alive) {
    body = '<div style="padding:20px;text-align:center;color:var(--text-dim);">Equipo eliminado.</div>';
  } else if (STATE.phase === 'reinforce') {
    const total = STATE.reinforceAmount[team.id] || 0;
    const alloc = STATE.reinforceAlloc[team.id] || {};
    const used = Object.values(alloc).reduce((a, b) => a + b, 0);
    const confirmed = STATE.reinforceConfirmed[team.id];
    const r = ENGINE.computeReinforcement(STATE, team.id);
    body += '<div class="objective">🎯 ' + escapeHtml(team.objective.text) + '</div>';
    body += '<div class="bigClock">' + fmtClock(STATE.phaseTimer) + '</div>';
    body += '<div style="font-size:12px;color:var(--text-dim);">' + escapeHtml(r.reason) + '</div>';
    body += '<div style="text-align:center;font-size:22px;font-weight:800;color:var(--gold);">' + (total - used) + ' <span style="font-size:11px;color:var(--text-dim);">por repartir</span></div>';
    body += '<div class="miniMapHost">' + renderMapSVG({ showNumbers: true, clickTeamId: team.id, small: true, reinforceFocus: ui.reinforceFocus }) + '</div>';
    if (ui.reinforceFocus) {
      const cname = BY_ID[ui.reinforceFocus].name;
      const here = alloc[ui.reinforceFocus] || 0;
      body += '<div class="countryRow"><span class="nm">' + cname + '</span>' +
        '<button class="stepBtn" onclick="doAllocDelta(\'' + team.id + '\',\'' + ui.reinforceFocus + '\',-1)">−</button>' +
        '<span class="arm">' + here + '</span>' +
        '<button class="stepBtn" onclick="doAllocDelta(\'' + team.id + '\',\'' + ui.reinforceFocus + '\',1)">+</button></div>';
    } else {
      body += '<div style="font-size:11px;color:var(--text-dim);text-align:center;">Tocá un país tuyo en el mapa para repartir.</div>';
    }
    body += '<div class="msg">' + escapeHtml(ui.msg || '') + '</div>';
    body += '<div class="footerBtns"><button class="primary" ' + (confirmed ? 'disabled' : '') + ' onclick="doConfirmReinforce(\'' + team.id + '\')">' + (confirmed ? '✅ Confirmado' : 'Confirmar refuerzos') + '</button></div>';
  } else if (STATE.phase === 'attack') {
    if (!isMyAttackTurn) {
      const onTurn = teamById(ENGINE.currentTeamId(STATE));
      body += '<div class="objective">🎯 ' + escapeHtml(team.objective.text) + '</div>';
      body += '<div style="text-align:center;padding:10px;color:var(--text-dim);">Esperando turno de <b style="color:' + onTurn.color + ';">' + onTurn.name + '</b>…</div>';
      body += '<div class="miniMapHost">' + renderMapSVG({ showNumbers: true, small: true }) + '</div>';
    } else if (STATE.pendingConquest && STATE.pendingConquest.teamId === team.id) {
      const pc = STATE.pendingConquest;
      const n = ui.conquestAmount == null ? pc.maxMove : ui.conquestAmount;
      body += '<div class="bigClock">' + fmtClock(STATE.phaseTimer) + '</div>';
      body += '<div class="conquestBox">¡Conquistaste ' + BY_ID[pc.destId].name + '! ¿Cuántos ejércitos pasás?' +
        '<div style="display:flex;align-items:center;justify-content:center;gap:10px;">' +
        '<button class="stepBtn" onclick="doConquestAmount(\'' + team.id + '\',-1)">−</button>' +
        '<span style="font-size:20px;font-weight:800;">' + n + '</span>' +
        '<button class="stepBtn" onclick="doConquestAmount(\'' + team.id + '\',1)">+</button></div>' +
        '<button class="primary" onclick="doConfirmConquest(\'' + team.id + '\')">Confirmar</button></div>';
      body += '<div class="miniMapHost">' + renderMapSVG({ showNumbers: true, small: true, destIds: [pc.destId], originId: pc.originId }) + '</div>';
    } else {
      const offLeft = ENGINE.CONFIG.ofensivasMaximasPorTurno - (STATE.offensivesUsed[team.id] || 0);
      body += '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<div class="bigClock" style="text-align:left;">' + fmtClock(STATE.phaseTimer) + '</div>' +
        '<div style="font-size:11px;color:var(--text-dim);text-align:right;">Ofensivas: ' + Math.max(0, offLeft) + '/' + ENGINE.CONFIG.ofensivasMaximasPorTurno + '</div></div>';
      body += '<div class="footerBtns">' +
        '<button class="' + (ui.mode === 'attack' ? 'primary' : 'ghost') + ' small" onclick="doSetMode(\'' + team.id + '\',\'attack\')">⚔️ Atacar</button>' +
        '<button class="' + (ui.mode === 'regroup' ? 'primary' : 'ghost') + ' small" ' + (STATE.regroupUsed[team.id] ? 'disabled' : '') + ' onclick="doSetMode(\'' + team.id + '\',\'regroup\')">🔁 Reagrupar</button>' +
        '</div>';

      const destIds = ui.mode === 'attack' && ui.originId ? ENGINE.neighborsOf(ui.originId).filter((nb) => STATE.countries[nb].owner !== team.id) : [];
      body += '<div class="miniMapHost">' + renderMapSVG({
        showNumbers: true, small: true, clickTeamId: team.id,
        originId: ui.mode === 'attack' ? ui.originId : null,
        destIds: ui.mode === 'attack' ? (ui.destId ? [ui.destId] : destIds) : [],
        regroupFrom: ui.regroupFrom, regroupTo: ui.regroupTo,
      }) + '</div>';

      if (ui.mode === 'attack') {
        if (!ui.originId) {
          body += '<div style="font-size:11px;color:var(--text-dim);text-align:center;">Tocá un país tuyo (con más de 1 ejército) para atacar.</div>';
        } else if (!ui.destId) {
          body += '<div style="font-size:11px;color:var(--text-dim);text-align:center;">Atacás desde <b>' + BY_ID[ui.originId].name + '</b>. Tocá un destino enemigo resaltado.</div>';
        } else {
          body += '<div style="font-size:12px;text-align:center;">' + BY_ID[ui.originId].name + ' (' + STATE.countries[ui.originId].armies + ') ⚔️ ' + BY_ID[ui.destId].name + ' (' + STATE.countries[ui.destId].armies + ')</div>';
          body += '<div class="footerBtns"><button onclick="doSingleRoll(\'' + team.id + '\')">🎲 Una tirada</button><button class="primary" onclick="doAttackUntilEnd(\'' + team.id + '\')">⚡ Atacar hasta el final</button></div>';
        }
      } else {
        if (!ui.regroupFrom) {
          body += '<div style="font-size:11px;color:var(--text-dim);text-align:center;">Tocá el país de origen.</div>';
        } else if (!ui.regroupTo) {
          body += '<div style="font-size:11px;color:var(--text-dim);text-align:center;">Origen: <b>' + BY_ID[ui.regroupFrom].name + '</b>. Tocá el destino (tuyo, limítrofe).</div>';
        } else {
          body += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;">' +
            '<button class="stepBtn" onclick="doRegroupAmount(\'' + team.id + '\',-1)">−</button>' +
            '<span style="font-weight:800;">' + ui.regroupAmount + '</span>' +
            '<button class="stepBtn" onclick="doRegroupAmount(\'' + team.id + '\',1)">+</button></div>';
          body += '<button class="primary" onclick="doConfirmRegroup(\'' + team.id + '\')">Confirmar reagrupe</button>';
        }
      }
      body += '<div class="msg">' + escapeHtml(ui.msg || '') + '</div>';
      body += '<div class="footerBtns"><button class="ghost" onclick="doEndTurn(\'' + team.id + '\')">Terminar turno ✅</button></div>';
    }
  } else if (STATE.phase === 'ended') {
    const win = STATE.winner === team.id;
    body += '<div style="text-align:center;padding:20px;">' + (win ? '🏆 ¡Ganaron!' : 'Partida terminada') + '<br><span style="font-size:12px;color:var(--text-dim);">' + escapeHtml(STATE.winReason || '') + '</span></div>';
  }

  const reactionRow = POLISH.reactions && team.alive
    ? '<div class="reactionBtns">' + REACTION_EMOJIS.map((e) => '<button class="small" onclick="doSendReaction(\'' + team.id + '\',\'' + e + '\')">' + e + '</button>').join('') + '</div>'
    : '';

  return '<div class="device">' +
    '<div class="devHead"><span class="dot" style="background:' + team.color + ';width:14px;height:14px;"></span><b>' + escapeHtml(team.name) + '</b><span style="font-size:11px;color:var(--text-dim);">' + myCount + ' países</span></div>' +
    body +
    reactionRow +
    '</div>';
}

// ============================================================
// LOOP PRINCIPAL
// ============================================================
function render() {
  if (LIVE.role === 'phone') { renderPhoneScreen(); return; }
  if (LIVE.role === 'tv') { // pantalla secundaria: solo el mapa
    if (!document.getElementById('tvRoundLabel')) return;
    renderTV();
    const tvc = document.getElementById('globalClock');
    if (tvc) tvc.textContent = STATE ? fmtClock(STATE.phaseTimer) : '';
    return;
  }
  if (!document.getElementById('tvRoundLabel')) return; // todavía no se eligió rol
  renderTV();
  renderDriver();
  renderDevices();
  const gc = document.getElementById('globalClock');
  if (gc) gc.textContent = STATE ? fmtClock(STATE.phaseTimer) : '';
}

// ============================================================
// PANTALLA DE CELULAR (rol 'phone')
// ============================================================
function renderPhoneScreen() {
  try { renderPhoneScreenInner(); }
  catch (err) {
    console.error('renderPhoneScreen', err);
    const h = document.getElementById('phoneDeviceHost');
    if (h) h.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">No se pudo dibujar la partida.<br><button class="ghost small" style="margin-top:10px" onclick="location.reload()">Reintentar</button><br><small style="opacity:.6">' + escapeHtml(String(err && err.message || err)) + '</small></div>';
  }
}
function renderPhoneScreenInner() {
  const connLabel = document.getElementById('phoneConnLabel');
  const picker = document.getElementById('phoneTeamPicker');
  const host = document.getElementById('phoneDeviceHost');
  if (!connLabel || !picker || !host) return;

  if (!STATE) {
    connLabel.textContent = LIVE.connected ? 'esperando a que el conductor inicie la partida…' : 'conectando…';
    picker.innerHTML = '';
    host.innerHTML = '';
    return;
  }
  if (LIVE.wantTeam) { // viene de participante.html con ?team=
    const mine = STATE.teams.find((t) => t.veladaName === LIVE.wantTeam || t.name === LIVE.wantTeam);
    if (mine) { LIVE.myTeamId = mine.id; try { localStorage.setItem('tegMyTeam', mine.id); } catch (e) {} }
    LIVE.wantTeam = null;
  }
  connLabel.textContent = '🟢 en vivo';

  if (!LIVE.myTeamId || !teamById(LIVE.myTeamId)) {
    picker.style.display = '';
    host.innerHTML = '';
    picker.innerHTML = '<div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">¿Cuál es tu equipo?</div>' +
      STATE.teams.map((t) => '<button class="teamPickBtn" style="border-color:' + t.color + ';" onclick="pickTeam(\'' + t.id + '\')">' +
        '<span class="dot" style="background:' + t.color + ';width:16px;height:16px;"></span><b>' + escapeHtml(t.name) + '</b>' + rankTagHtml(t) + '</button>').join('');
    return;
  }
  picker.style.display = 'none';
  const team = teamById(LIVE.myTeamId);
  host.innerHTML = renderDeviceCard(team);
}

window.pickTeam = function (teamId) {
  LIVE.myTeamId = teamId;
  try { localStorage.setItem('tegMyTeam', teamId); } catch (e) {}
  render();
};

// ============================================================
// PANTALLA DE ENTRADA — elegir rol
// ============================================================
window.applyRole = function (role) {
  LIVE.role = role;
  if (role !== 'tv') { try { localStorage.setItem('tegRole', role); } catch (e) {} } // la TV no pisa el rol guardado
  document.getElementById('gateScreen').classList.remove('show');

  if (role === 'test') {
    ENGINE = TegEngine.createEngine(COUNTRIES, CONTINENTS, {});
    document.getElementById('dashboardView').classList.add('show');
    document.getElementById('dashBrand').textContent = '🌍 TEG Express — modo de prueba';
    document.getElementById('devicesSection').style.display = '';
    render();
  } else if (role === 'host') {
    ENGINE = TegEngine.createEngine(COUNTRIES, CONTINENTS, {});
    document.getElementById('dashboardView').classList.add('show');
    document.getElementById('dashBrand').textContent = '🌍 TEG Express — conductor';
    document.getElementById('devicesSection').style.display = 'none';
    const db = fbInit();
    fbListenReactions();
    fbListenActionsAsHost();
    fbListenActivation();
    if (db) {
      db.ref(FB_PATH + '/state').once('value').then((snap) => {
        const remote = snap.val();
        if (remote) {
          STATE = normalizeRemoteState(remote);
          STATE.teams.forEach((t) => resetDeviceUIForTurn(t.id));
          if (LIVE.activation && STATE.activationId !== LIVE.activation.id) STATE = null; // quedó de otra ronda
        }
        render();
      }).catch(() => render());
    } else {
      render();
    }
  } else if (role === 'tv') {
    ENGINE = TegEngine.createEngine(COUNTRIES, CONTINENTS, {});
    document.body.classList.add('role-tv');
    document.getElementById('dashboardView').classList.add('show');
    document.getElementById('dashBrand').textContent = '🌍 TEG Express';
    fbInit();
    fbListenReactions();
    fbListenStateReadOnly();
    render();
  } else if (role === 'phone') {
    ENGINE = TegEngine.createEngine(COUNTRIES, CONTINENTS, {});
    document.getElementById('phoneScreen').classList.add('show');
    try { const saved = localStorage.getItem('tegMyTeam'); if (saved) LIVE.myTeamId = saved; } catch (e) {}
    const db = fbInit();
    LIVE.connected = !!db;
    fbListenReactions();
    fbListenStateReadOnly();
    render();
  }
};

/** Elegir rol. Para 'host' avisa si ya hay otro conductor trabajando
 * (dos conductores a la vez se pisan el estado). */
window.chooseRole = function (role) {
  if (role !== 'host') { window.applyRole(role); return; }
  const db = fbInit();
  if (!db) { window.applyRole(role); return; }
  db.ref(FB_PATH + '/meta').once('value').then((snap) => {
    const m = snap.val();
    const other = m && m.hostClient && m.hostClient !== LIVE.clientId && m.active && (Date.now() - (m.updatedAt || 0)) < 15000;
    if (other && !confirm('Ya hay otra pantalla conductora con una partida en marcha. Si abrís esta también, se van a pisar. ¿Tomar el control igual?')) return;
    window.applyRole(role);
  }).catch(() => window.applyRole(role));
};

setInterval(() => {
  if (LIVE.role === 'phone' || LIVE.role === 'tv') return; // el reloj lo maneja solo el conductor
  if (STATE && STATE.gameStarted && !STATE.paused && STATE.phase !== 'ended') {
    ENGINE.tick(STATE, 1);
    render();
    pumpAnimationQueue();
    fbPublishResultIfEnded();
    if (LIVE.role === 'host') fbPushFullState();
  }
}, 1000);

document.getElementById('btnNewGame').addEventListener('click', () => {
  const raw = (document.getElementById('teamNamesInput').value || '').trim();
  const names = raw ? raw.split(',').map((s) => s.trim()).filter(Boolean) : null;
  window.doNewGame(names);
});
document.getElementById('btnPause').addEventListener('click', window.doTogglePause);

if (POLISH.chipVolume) document.body.classList.add('polish-chips');
if (POLISH.warTable) document.body.classList.add('polish-wartable');

// ---- arranque: ?role=host|phone|tv (y ?team= para el celular) o el rol guardado; si no, la entrada ----
(function boot() {
  let urlRole = null, urlTeam = null;
  try { const q = new URLSearchParams(location.search); urlRole = q.get('role'); urlTeam = q.get('team'); } catch (e) {}
  if (urlTeam) LIVE.wantTeam = urlTeam;
  if (urlRole === 'host' || urlRole === 'phone' || urlRole === 'tv') { window.chooseRole(urlRole); return; }
  let savedRole = null;
  try { savedRole = localStorage.getItem('tegRole'); } catch (e) {}
  if (savedRole === 'host' || savedRole === 'phone') {
    window.chooseRole(savedRole);
  } else {
    document.getElementById('gateScreen').classList.add('show');
  }
})();
