}

// Resultados: junta los duelos jugados de ambas fases. Si un duelo no
// aparece en la fixture (porque cambió el roster), no se inventa un
// nombre de juego con "?": directamente se omite ese dato.
function buildResultsFeed() {
  const items = [];
  const state = latestState;
  Object.entries(state.f1 || {}).forEach(([k, res]) => {
    const [r, a, b] = k.split('-').map(Number);
    const match = F1_FIXTURE.find(m => m[0] === r && m[1] === a && m[2] === b);
    items.push({ f2: false, r, a, b, res, game: match ? gameNameF1(match[3]) : null });
  });
  Object.entries(state.f2 || {}).forEach(([k, res]) => {
    const [r, a, b] = k.split('-').map(Number);
    const match = F2_FIXTURE.find(m => m[0] === r && m[1] === a && m[2] === b);
    items.push({ f2: true, r, a, b, res, game: match ? gameNameF2(match[3]) : null });
  });
  return items.reverse();
}

// ── EVOLUCIÓN (gráfico de líneas de la noche, para el participante) ──────
// Mismo gráfico que el Modo TV pero embebido acá, para que cada jugador lo
// pueda ver desde su teléfono si quiere. Reusa los datos que ya llegan por
// Firebase (latestState / latestRules) y las mismas reglas de puntaje que
// getPoints, así el gráfico cuenta la misma historia que la tabla.
let _evoMode = 'f1';  // 'f1' | 'f2' | 'total'
let _evoView = 'pts'; // 'pts' | 'pos'
try { _evoMode = localStorage.getItem('ndj_guest_evo_mode') || 'f1'; } catch (e) {}
try { _evoView = localStorage.getItem('ndj_guest_evo_view') || 'pts'; } catch (e) {}

// Orden cronológico real: por timestamp (res.t) cuando existe, con fallback al
// orden del fixture. Mismo criterio que el TV y los créditos.
function evoChrono(fixture, store) {
  const entries = [];
  fixture.forEach(([r, a, b, g], fixtureIdx) => {
    const key = r + '-' + a + '-' + b;
    const res = store[key];
    if (res) entries.push({ r, a, b, g, res, fixtureIdx, t: (typeof res.t === 'number' ? res.t : null) });
  });
  return entries.sort((x, y) => {
    if (x.t != null && y.t != null) return x.t - y.t;
    if (x.t != null && y.t == null) return 1;
    if (x.t == null && y.t != null) return -1;
    return x.fixtureIdx - y.fixtureIdx;
  });
}

// Construye las series [{name, color, points:[...], total, wins, played}] para
// el modo pedido. Devuelve también cuántos pasos (partidos) hubo.
function buildEvoSeriesGuest(mode) {
  const RC = latestRules;
  const st = latestState;
  const teamOfPlayer = {};
  TEAMS.forEach((t, ti) => { String(t || '').split('/').forEach(p => { teamOfPlayer[p.trim()] = ti; }); });

  function delta(kind, idxA, idxB, nameA, nameB, res, g) {
    const gCfg = (RC && RC[kind] && RC[kind][g]) ? RC[kind][g] : null;
    const winPts = gCfg ? gCfg.pts_win : 3, bonusPts = gCfg ? gCfg.pts_bonus : 1, drawPts = gCfg ? gCfg.pts_draw : 1;
    const d = {};
    if (res.winner === 'empate') { d[nameA] = drawPts; d[nameB] = drawPts; }
    else { const wIsA = (res.winner === idxA); d[wIsA ? nameA : nameB] = winPts + (res.bonus ? bonusPts : 0); d[wIsA ? nameB : nameA] = 0; }
    return d;
  }

  // Extras finales (bonus, impostor, comodines, apuestas, QLD, ajustes) — se
  // suman como un último "paso" para que el total del gráfico coincida con la
  // tabla. Reproduce la misma lógica que getPoints, pero por nombre.
  function f1Extras() {
    const ex = {}; PLAYERS.forEach(n => ex[n] = 0);
    try {
      const impNoPts = (RC && RC.impostor) ? RC.impostor.pts_noDescubierto : 4;
      const impDesPts = (RC && RC.impostor) ? RC.impostor.pts_descubierto : 2;
      if (st.impostor && Array.isArray(st.impostor.rounds)) {
        st.impostor.rounds.forEach(rd => {
          if (rd.mode === 'noDescubierto' && ex[rd.impostorName] !== undefined) ex[rd.impostorName] += impNoPts;
          else if (rd.mode === 'descubierto' && ex[rd.accusedName] !== undefined) ex[rd.accusedName] += impDesPts;
        });
      }
      const bm = st.bonusManual || {};
      PLAYERS.forEach(n => { if (bm[n] && bm[n].pts) ex[n] += Number(bm[n].pts) || 0; });
      (st.comodines || []).forEach(c => { if (c.status === 'done' && ex[c.player] !== undefined) ex[c.player] += Number(c.delta) || 0; });
      const bets = st.bets || {}, bw = {}, bb = {};
      Object.keys(bets).forEach(k => {
        const res = (st.f1 || {})[k]; if (!res || res.winner === 'empate') return;
        const pp = k.split('-').map(Number);
        Object.keys(bets[k]).forEach(who => {
          const own = (PLAYERS[pp[1]] === who || PLAYERS[pp[2]] === who);
          if (bets[k][who] === res.winner) bw[who] = (bw[who] || 0) + 1; else if (own) bb[who] = true;
        });
      });
      Object.keys(bw).forEach(who => { if (!bb[who] && ex[who] !== undefined) ex[who] += bw[who]; });
      (((st.adjust || {}).f1) || []).forEach(a => { if (ex[a.name] !== undefined) ex[a.name] += Number(a.pts) || 0; });
      const vs = st.vsJC || {};
      PLAYERS.forEach(n => { if (typeof vs[n] === 'number') ex[n] += vs[n]; });
    } catch (e) {}
    return ex;
  }
  function f2Extras() {
    const ex = {}; TEAMS.forEach(n => ex[n] = 0);
    try {
      const qld = st.qldTeamPoints || {};
      Object.keys(qld).forEach(k => { const t = TEAMS[parseInt(k, 10)]; if (t !== undefined && ex[t] !== undefined) ex[t] += Number(qld[k]) || 0; });
      (st.comodinesF2 || []).forEach(c => { if (c.status === 'done' && ex[c.player] !== undefined) ex[c.player] += Number(c.delta) || 0; });
      (((st.adjust || {}).f2) || []).forEach(a => { if (ex[a.name] !== undefined) ex[a.name] += Number(a.pts) || 0; });
    } catch (e) {}
    return ex;
  }

  let names, steps = [], extras, wins = {}, played = {};

  if (mode === 'f2') {
    names = TEAMS.slice();
    const entries = evoChrono(F2_FIXTURE, st.f2 || {});
    const run = {}; names.forEach(n => run[n] = 0);
    entries.forEach(e => {
      const d = delta('f2', e.a, e.b, names[e.a], names[e.b], e.res, e.g);
      Object.keys(d).forEach(n => { if (run[n] !== undefined) run[n] += d[n]; });
      [names[e.a], names[e.b]].forEach(n => played[n] = (played[n] || 0) + 1);
      if (e.res.winner !== 'empate') { const w = names[e.res.winner]; wins[w] = (wins[w] || 0) + 1; }
      steps.push(Object.assign({}, run));
    });
    extras = f2Extras();
  } else if (mode === 'total') {
    names = PLAYERS.slice();
    const f1e = evoChrono(F1_FIXTURE, st.f1 || {}).map(e => Object.assign({ type: 'f1' }, e));
    const f2e = evoChrono(F2_FIXTURE, st.f2 || {}).map(e => Object.assign({ type: 'f2' }, e));
    // Intercalar por timestamp real; los sin t van al final por fixture.
    const all = f1e.concat(f2e).sort((x, y) => {
      if (x.t != null && y.t != null) return x.t - y.t;
      if (x.t != null && y.t == null) return -1;
      if (x.t == null && y.t != null) return 1;
      return 0;
    });
    const run = {}; names.forEach(n => run[n] = 0);
    all.forEach(e => {
      if (e.type === 'f1') {
        const d = delta('f1', e.a, e.b, names[e.a], names[e.b], e.res, e.g);
        Object.keys(d).forEach(n => { if (run[n] !== undefined) run[n] += d[n]; });
        [names[e.a], names[e.b]].forEach(n => played[n] = (played[n] || 0) + 1);
        if (e.res.winner !== 'empate') { const w = names[e.res.winner]; wins[w] = (wins[w] || 0) + 1; }
      } else {
        const teamA = TEAMS[e.a], teamB = TEAMS[e.b];
        const d = delta('f2', e.a, e.b, teamA, teamB, e.res, e.g);
        Object.keys(d).forEach(teamName => {
          String(teamName).split('/').forEach(p => { const pn = p.trim(); if (run[pn] !== undefined) run[pn] += d[teamName]; });
        });
      }
      steps.push(Object.assign({}, run));
    });
    const exF1 = f1Extras(), exF2 = f2Extras();
    extras = {}; names.forEach(n => extras[n] = (exF1[n] || 0) + (teamOfPlayer[n] !== undefined ? (exF2[TEAMS[teamOfPlayer[n]]] || 0) : 0));
  } else {
    names = PLAYERS.slice();
    const entries = evoChrono(F1_FIXTURE, st.f1 || {});
    const run = {}; names.forEach(n => run[n] = 0);
    entries.forEach(e => {
      const d = delta('f1', e.a, e.b, names[e.a], names[e.b], e.res, e.g);
      Object.keys(d).forEach(n => { if (run[n] !== undefined) run[n] += d[n]; });
      [names[e.a], names[e.b]].forEach(n => played[n] = (played[n] || 0) + 1);
      if (e.res.winner !== 'empate') { const w = names[e.res.winner]; wins[w] = (wins[w] || 0) + 1; }
      steps.push(Object.assign({}, run));
    });
    extras = f1Extras();
  }

  const lastRun = steps.length ? Object.assign({}, steps[steps.length - 1]) : (() => { const z = {}; names.forEach(n => z[n] = 0); return z; })();
  names.forEach(n => {
    let target = null;
    if (mode === 'f2') target = liveTotal('f2', n);
    else if (mode === 'total') {
      const a = liveTotal('f1', n);
      const t = teamOfPlayer[n] !== undefined ? TEAMS[teamOfPlayer[n]] : null;
      const b = t != null ? liveTotal('f2', t) : 0;
      if (a !== null && b !== null) target = a + b;
    } else target = liveTotal('f1', n);
    if (target !== null) extras[n] = target - (lastRun[n] || 0);
  });
  const hasExtras = Object.values(extras).some(v => v);
  if (hasExtras) { names.forEach(n => lastRun[n] = (lastRun[n] || 0) + (extras[n] || 0)); steps.push(lastRun); }

  const finalTotals = steps.length ? steps[steps.length - 1] : lastRun;
  const series = names.map((n, i) => ({
    name: n, idx: i, color: avatarColor(n),
    points: [0].concat(steps.map(s => s[n] || 0)),
    total: finalTotals[n] || 0, wins: wins[n] || 0, played: played[n] || 0
  })).filter(s => s.points.some(p => p > 0) || s.total > 0);
  series.sort((a, b) => b.total - a.total);
  return { series, steps: steps.length };
}

function renderEvoSVGGuest(series, maxSteps, viewMode) {
  const W = 600, H = 260, padL = 8, padR = 8, padT = 12, padB = 12;
  const n = maxSteps + 1;
  const x = i => padL + (n > 1 ? (i / (n - 1)) * (W - padL - padR) : (W - padL - padR) / 2);

  let grid = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const gy = padT + f * (H - padT - padB);
    grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>';
  });

  const matrix = series.map(s => { const pts = s.points.slice(0, n); while (pts.length < n) pts.push(pts[pts.length - 1] || 0); return pts; });
  let lines = '';

  if (viewMode === 'pos') {
    const count = series.length;
    const ranks = matrix.map(() => new Array(n).fill(1));
    for (let j = 0; j < n; j++) {
      const order = matrix.map((_, i) => i).sort((a, b) => { const diff = matrix[b][j] - matrix[a][j]; return diff !== 0 ? diff : (a - b); });
      order.forEach((i, rank) => { ranks[i][j] = rank + 1; });
    }
    const y = r => count > 1 ? padT + ((r - 1) / (count - 1)) * (H - padT - padB) : (padT + (H - padT - padB) / 2);
    series.forEach((s, si) => {
      const rs = ranks[si];
      const d = rs.map((r, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(r).toFixed(1)).join(' ');
      lines += '<path class="gh-evo-line" data-si="' + si + '" d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>';
      lines += '<circle class="gh-evo-line" data-si="' + si + '" cx="' + x(n - 1).toFixed(1) + '" cy="' + y(rs[rs.length - 1]).toFixed(1) + '" r="4.5" fill="' + s.color + '"/>';
    });
  } else {
    const maxY = Math.max(1, ...series.map(s => Math.max(...s.points)));
    const y = v => H - padB - (v / maxY) * (H - padT - padB);
    series.forEach((s, si) => {
      const pts = matrix[si];
      const d = pts.map((v, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
      lines += '<path class="gh-evo-line" data-si="' + si + '" d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>';
      lines += '<circle class="gh-evo-line" data-si="' + si + '" cx="' + x(n - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1]).toFixed(1) + '" r="4.5" fill="' + s.color + '"/>';
    });
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + grid + lines + '</svg>';
}

function evoModeLabelGuest(mode) { return mode === 'f2' ? 'Fase Grupal' : (mode === 'total' ? 'Total de la noche' : 'Impostor'); }

function evoHighlightGuest(si) {
  const wrap = document.getElementById('gh-evo-wrap');
  const box = document.getElementById('gh-evo');
  if (!wrap || !box) return;
  wrap.classList.toggle('dim-others', si !== null);
  box.querySelectorAll('.gh-evo-line, .gh-evo-row').forEach(el => {
    el.classList.toggle('active', si !== null && el.dataset.si === String(si));
  });
}

// Arma el contenido interno del bloque de evolución (toggles + gráfico + lista).
function evoInnerHtml() {
  const mode = _evoMode, view = _evoView;
  const data = buildEvoSeriesGuest(mode);
  const toggleHtml = '<div class="gh-evo-toggle">'
    + ['f1', 'f2', 'total'].map(m => '<button data-mode="' + m + '" class="' + (m === mode ? 'active' : '') + '">'
      + (m === 'f1' ? 'Impostor' : m === 'f2' ? 'Grupal' : 'Total') + '</button>').join('')
    + '</div>';
  const viewToggleHtml = '<div class="gh-evo-toggle gh-evo-toggle2">'
    + ['pts', 'pos'].map(v => '<button data-view="' + v + '" class="' + (v === view ? 'active' : '') + '">'
      + (v === 'pts' ? '📈 Puntos' : '🪜 Posición') + '</button>').join('')
    + '</div>';

  let body;
  if (!data.series.length || data.steps === 0) {
    body = '<div class="gh-evo-empty">Todavía no hay resultados cargados en esta fase 🎲</div>';
  } else {
    const chart = renderEvoSVGGuest(data.series, data.steps, view);
    const list = data.series.map((s, i) =>
      '<div class="gh-evo-row" data-si="' + i + '" style="border-color:' + s.color + '">'
      + '<span class="gh-evo-pos">#' + (i + 1) + '</span>'
      + '<span class="gh-evo-name">' + avatarHtml(s.name, 26) + '<span><div>' + escapeHtml(s.name.replace('/', ' & ')) + '</div>'
      + (mode !== 'total' ? '<div class="gh-evo-sub">' + s.wins + ' de ' + s.played + ' ganados</div>' : '') + '</span></span>'
      + '<span class="gh-evo-pts" style="color:' + s.color + '">' + s.total + ' pts</span>'
      + '</div>').join('');
    body = '<div class="gh-evo-chart-wrap" id="gh-evo-wrap">' + chart + '</div><div class="gh-evo-list">' + list + '</div>';
  }
  return '<div class="gh-evo-titlebar">📈 Evolución — ' + evoModeLabelGuest(mode) + '</div>' + toggleHtml + viewToggleHtml + body;
}

// Re-render solo del interior del bloque (sin tocar el <details>) para que
// tocar un toggle no cierre el acordeón ni haga saltar el scroll.
function refreshEvoInner() {
  const box = document.getElementById('gh-evo');
  if (!box) return;
  box.innerHTML = evoInnerHtml();
  wireEvo();
}

function wireEvo() {
  const box = document.getElementById('gh-evo');
  if (!box) return;
  box.querySelectorAll('.gh-evo-toggle:not(.gh-evo-toggle2) button').forEach(btn => {
    btn.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); _evoMode = btn.dataset.mode;
      try { localStorage.setItem('ndj_guest_evo_mode', _evoMode); } catch (e) {} refreshEvoInner(); });
  });
  box.querySelectorAll('.gh-evo-toggle2 button').forEach(btn => {
    btn.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); _evoView = btn.dataset.view;
      try { localStorage.setItem('ndj_guest_evo_view', _evoView); } catch (e) {} refreshEvoInner(); });
  });
  box.querySelectorAll('.gh-evo-row, .gh-evo-line').forEach(el => {
    const si = el.dataset.si;
    el.addEventListener('mouseenter', () => evoHighlightGuest(si));
    el.addEventListener('mouseleave', () => evoHighlightGuest(null));
    el.addEventListener('touchstart', ev => { ev.stopPropagation(); evoHighlightGuest(si); }, { passive: true });
  });
}

function renderVivo() {
  evPhase='f2';
  const root = document.getElementById('vivo-app');
  if (!root) return;
  const isF1 = evPhase === 'f1';
  const entities = isF1 ? PLAYERS : TEAMS;
  const fixture = isF1 ? F1_FIXTURE : F2_FIXTURE;
  const list = ranked(evPhase);
  const done = fixture.filter(m => (isF1 ? (latestState.f1 || {}) : (latestState.f2 || {}))[m[0] + '-' + m[1] + '-' + m[2]]).length;
  const pct = fixture.length ? Math.round((done / fixture.length) * 100) : 0;

  const top3 = list.slice(0, 3);
  const rest = list.slice(3);
  const podHtml = top3.map((e, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
    return `<div class="gh-pod-row p${i + 1}">
      <span class="gh-pod-medal">${medal}</span>
      <span class="gh-pod-name">${avatarHtml(e.n, 30)}<span>${escapeHtml(e.n)}</span></span>
      <span class="gh-pod-pts">${e.total}</span>

  const restHtml = rest.map((e, i) => `

    <td class="pts">${e.total}</td></tr>`).join('');

  // Cada fila de resultado usa las mismas clases que "Próximo/Último resultado"
  // en la pestaña Yo, para que el texto nunca quede pegado ni descuadrado.
  const resultsFeed = buildResultsFeed();
  const resultsHtml = resultsFeed.length ? resultsFeed.map(it => {
    const ents = it.f2 ? TEAMS : PLAYERS;
    const nameA = shortName(ents[it.a] || '?', !it.f2);
    const nameB = shortName(ents[it.b] || '?', !it.f2);
    const tagParts = ['R' + it.r];
    if (it.game) tagParts.push(it.game);
    if (it.f2) tagParts.push('Fase grupal');
    const tag = escapeHtml(tagParts.join(' · '));
    if (it.res.winner === 'empate') {
      return `<div class="gh-match"><span class="gh-match-icon">🤝</span><div class="gh-match-text"><span class="gh-match-tag">${tag}</span>${escapeHtml(nameA)} vs ${escapeHtml(nameB)} — empate</div></div>`;
    }
    const winner = shortName(ents[it.res.winner] || '?', !it.f2);
    const loser = it.res.winner === it.a ? nameB : nameA;
    return `<div class="gh-match"><span class="gh-match-icon">⚡</span><div class="gh-match-text"><span class="gh-match-tag">${tag}</span><b>${escapeHtml(winner)}</b> venció a ${escapeHtml(loser)}${it.res.bonus ? ' · +bonus' : ''}</div></div>`;
  }).join('') : `<div class="gh-empty">Todavía no hay resultados cargados.</div>`;

  const logros = detectLogros().reverse();
  const logrosHtml = logros.length ? logros.slice(0, 25).map(l => `
    <div class="gh-logro-row"><span class="gh-logro-emoji">${l.emoji}</span>
      <div class="gh-logro-text"><span class="gh-logro-title">${escapeHtml(l.title)}</span><span class="gh-logro-who">${escapeHtml(l.who)}</span><span class="gh-logro-desc">${escapeHtml(l.desc)}</span></div>
    </div>`).join('') : `<div class="gh-empty">Todavía no se desbloqueó nada.</div>`;

  root.innerHTML = `
    <div class="gh-header">
      <div class="gh-eyebrow">🎮 La Velada del Año</div>
      <div class="gh-title">En vivo</div>
    </div>

    <div class="gh-relator"><span class="gh-relator-emoji" id="gh-relator-emoji">📣</span><span class="gh-relator-txt" id="gh-relator-txt">Cargando novedades…</span></div>

    <div class="gh-seg">
      <button class="gh-seg-btn f2 ${!isF1 ? 'active' : ''}" data-phase="f2">Fase grupal</button>
    </div>

    <div class="card ${isF1 ? '' : 'f2'}">
      <div class="card-head"><span class="card-label ${isF1 ? 'accent-label' : ''}">Podio</span></div>
      <div class="gh-podium">${podHtml || `<div class="gh-empty">Todavía no hay resultados.</div>`}</div>
      <div class="gh-progress-label"><span>Duelos jugados</span><b>${done}/${fixture.length}</b></div>
      <div class="gh-progress-bar"><div class="gh-progress-fill" style="width:${pct}%"></div></div>
      ${rest.length ? `
      <details class="gh-toggle-wrap" data-acc-key="vivo-rank-${evPhase}"${accOpen('vivo-rank-' + evPhase, false) ? ' open' : ''}>
        <summary class="gh-toggle">
          <span class="card-label">Ver tabla completa</span><span class="gh-toggle-arrow">▶</span>
        </summary>
        <table class="ranking"><tbody>${restHtml}</tbody></table>
      </details>` : ''}
    </div>

    <details class="gh-acc" data-acc-key="vivo-results"${accOpen('vivo-results', false) ? ' open' : ''}>
      <summary class="gh-acc-summary">
        <span class="gh-acc-summary-left">
          <span class="gh-acc-icon">📰</span>
          <span class="gh-acc-title-wrap"><span class="gh-acc-title">Resultados</span><span class="gh-acc-hint">Últimos duelos jugados</span></span>
        </span>
        <span class="gh-acc-summary-right"><span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
      </summary>
      <div class="gh-acc-body"><div class="gh-b-list">${resultsHtml}</div></div>
    </details>

    <details class="gh-acc" data-acc-key="vivo-logros"${accOpen('vivo-logros', false) ? ' open' : ''}>
      <summary class="gh-acc-summary">
        <span class="gh-acc-summary-left">
          <span class="gh-acc-icon">🏅</span>
          <span class="gh-acc-title-wrap"><span class="gh-acc-title">Logros</span><span class="gh-acc-hint">${logros.length} desbloqueados</span></span>
        </span>
        <span class="gh-acc-summary-right"><span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
      </summary>
      <div class="gh-acc-body">${logrosHtml}</div>
    </details>

    <details class="gh-acc info" data-acc-key="vivo-evo"${accOpen('vivo-evo', false) ? ' open' : ''}>
      <summary class="gh-acc-summary">
        <span class="gh-acc-summary-left">
          <span class="gh-acc-icon">📈</span>
          <span class="gh-acc-title-wrap"><span class="gh-acc-title">Evolución</span><span class="gh-acc-hint">El gráfico de la noche</span></span>
        </span>
        <span class="gh-acc-summary-right"><span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
      </summary>
      <div class="gh-acc-body"><div id="gh-evo" class="gh-evo"></div></div>
    </details>

    <div class="gh-footer"><span class="gh-dot"></span><span class="gh-connection${liveFromCache || !navigator.onLine ? ' cached' : ''}">${connectionStatusHtml()}</span></div>
  `;

  root.querySelectorAll('.gh-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => { evPhase = btn.dataset.phase; renderVivo(); });
  });
  wireAccordions();
  // Pintar el gráfico de evolución dentro de su acordeón.
  try { refreshEvoInner(); } catch (e) { console.warn('evo render:', e); }
}

let _relatorTimerStarted = false;
function startRelator() {
  if (_relatorTimerStarted) return;
  _relatorTimerStarted = true;
  tickRelator();
  _relatorTimer = setInterval(tickRelator, 6500);
}

function render() {
  if (!ready) { document.getElementById('app').innerHTML = '<div class="gh-loading">Cargando…</div>'; return; }
  if (!PLAYERS.length || !TEAMS.length) {
    document.getElementById('tabbar').classList.add('hidden');
    document.getElementById('app').innerHTML = '<div class="gh-loading">Esperando los participantes y equipos publicados por el conductor…</div>';
    return;
  }
  const who = localStorage.getItem('ndj_guest_who');
  const tabbar = document.getElementById('tabbar');
  if (who && PLAYERS.includes(who)) {
    document.body.classList.remove('sel-mode', 'sel-painted');
    tabbar.classList.remove('hidden');
    renderDashboard(who);
    renderVivo();
    startRelator();
  } else {
    // Si el organizador sacó a esta persona del roster, su panel desaparecía
    // sin explicación. Le avisamos antes de mandarla de vuelta a elegir.
    if (who) {
      try { localStorage.removeItem('ndj_guest_who'); } catch (e) {}
      _rosterAviso = 'Tu nombre ya no está en la lista. Elegí de nuevo quién sos.';
    }
    tabbar.classList.add('hidden');
    renderSelection();
  }
}

// ── Firebase: solo lectura, en vivo ──────────────────────────
// El conductor publica el roster que usa cada fase junto a su fixture. Ese
// canal prevalece sobre un snapshot viejo del estado de Firestore.
onValue(dbRef(getDatabase(fixtureApp), 'velada/fixture'), snap => {
  const data = snap.val();
  if (!data || !Array.isArray(data.f1?.players) || !Array.isArray(data.f2?.teams) ||
      !data.f1.players.length || !data.f2.teams.length) return;
  PLAYERS = data.f1.players.slice();
  TEAMS = data.f2.teams.slice();
  F1_FIXTURE = [];
  F2_FIXTURE = Array.isArray(data.f2.fixture) ? data.f2.fixture : [];
  FULL_NAMES = data.f2.fullNames || {};
  fixtureRosterPublished = true;
  if (ready) render();
}, err => console.warn('No se pudo leer el roster de las fases:', err));

onSnapshot(doc(db, 'ndj', 'state'), { includeMetadataChanges: true }, (snap) => {
  if (snap.exists()) {
    try {
      const raw = snap.data().data;
      const parsed = Object.assign({ f1: {}, f2: {}, impostor: { rounds: [] } }, JSON.parse(raw));
      latestState = parsed;
      if (!fixtureRosterPublished) {
        if (Array.isArray(parsed.playersSnapshot) && parsed.playersSnapshot.length) PLAYERS = parsed.playersSnapshot.slice();
        if (Array.isArray(parsed.teamsSnapshot) && parsed.teamsSnapshot.length) TEAMS = parsed.teamsSnapshot.slice();
        F1_FIXTURE = [];
        F2_FIXTURE = Array.isArray(parsed.f2FixtureSnapshot?.fixture) ? parsed.f2FixtureSnapshot.fixture : [];
      }
      latestFinal = parsed.finalPublic || { final: {}, tercero: {} };
    } catch (e) { console.warn('Error al parsear estado:', e); }
  }
  liveFromCache = snap.metadata.fromCache;
  if (!liveFromCache) lastUpdate = new Date();
  ready = true;
  try {
    const who = localStorage.getItem('ndj_guest_who');
    if (who && !liveFromCache) {
      checkMyNews(who);
      chequearAdelantamiento(who);
      const wi = PLAYERS.indexOf(who);
      if (wi >= 0) chequearTurno(who, wi, teamIndexForPlayer(who));
    }
  } catch (e) {}
  render();
}, (err) => {
  console.warn('Firebase onSnapshot error (state):', err);
  liveFromCache = true;
  if (ready) updateConnectionStatus();
  else document.getElementById('app').innerHTML = '<div class="gh-loading">No se pudo conectar. Revisá tu conexión a internet.</div>';
});

// Apuestas en vivo: las escriben los propios invitados, no vienen en `state`
// Apuestas de Fase grupal en vivo (equipos)

<script>
// ── Pantalla siempre encendida ─────────────────────────────────────────
// Evita que el celular (o la notebook del TV) apague la pantalla mientras
// la página está abierta. Si el navegador no lo soporta, no pasa nada.
(function mantenerPantallaEncendida() {
  if (!('wakeLock' in navigator)) return;
  let lock = null;
  async function pedir() {
    if (document.visibilityState !== 'visible' || lock) return;
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch (e) { lock = null; }
  }
  pedir();
  document.addEventListener('visibilitychange', pedir);
  // Algunos navegadores (Safari) solo lo dan después de un toque
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, pedir, { passive: true }));
})();
</script>
