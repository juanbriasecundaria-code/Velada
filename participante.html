<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  :root {
    --bg: #08080c;
    --bg-2: #0f0f16;
    --surface: #15151d;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f2f1ea;
    --muted: #8b8b96;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.10);
    --accent-glow: rgba(200,240,96,0.35);
    --gold: #f5c842;
    --gold-dim: rgba(245,200,66,0.10);
    --silver: #a0b4c8;
    --silver-dim: rgba(160,180,200,0.12);
    --danger: #ff5f6b;
    --success: #4ecb7e;
    --info: #60b4f0;
    --info-dim: rgba(96,180,240,0.10);
    --info-glow: rgba(96,180,240,0.35);
    --radius: 10px;
    --radius-lg: 18px;
    --font-display: 'Orbitron', 'Segoe UI', sans-serif;
    --font-head: 'Rajdhani', -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  html { background: var(--bg); }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(200,240,96,0.10), transparent 60%),
      radial-gradient(ellipse 600px 380px at 105% 8%, rgba(96,180,240,0.09), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 110%, rgba(245,200,66,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── layout raíz: paneles (Yo / En vivo) + barra de pestañas ── */
  #panels { flex: 1; min-height: 0; position: relative; }
  .panel { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .panel.hidden { display: none; }
  #app, #vivo-app { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 1.75rem; }

  .tabbar {
    display: flex; flex-shrink: 0; border-top: 1px solid var(--border2);
    background: rgba(15,15,22,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar.hidden { display: none; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
    padding: 0.6rem 0 0.5rem; font-family: var(--font-head); font-size: 11px; font-weight: 700;
    letter-spacing: 0.03em; transition: color .15s;
  }
  .tab-btn .tab-ic { font-size: 19px; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active .tab-ic { filter: drop-shadow(0 0 8px var(--accent-glow)); }

  /* ── selector de fase (En vivo) ── */
  .gh-seg { display: flex; background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; padding: 3px; margin-bottom: 1rem; }
  .gh-seg-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: var(--font-head); font-size: 12.5px; font-weight: 700; padding: 0.55rem 0.4rem; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; }
  .gh-seg-btn.active { background: var(--accent-dim); color: var(--accent); }
  .gh-seg-btn.active.f2 { background: var(--info-dim); color: var(--info); }

  /* ── relator: cartel fijo con novedades automáticas ── */
  .gh-relator {
    display: flex; align-items: center; gap: 0.55rem;
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border2); border-radius: var(--radius-lg);
    padding: 0.75rem 0.95rem; margin-bottom: 1rem; min-height: 44px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
    position: relative; overflow: hidden;
  }
  .gh-relator::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8; }
  .gh-relator-emoji { font-size: 17px; flex-shrink: 0; }
  .gh-relator-txt { flex: 1; transition: opacity .35s var(--ease); }
  .gh-relator-txt.fade { opacity: 0; }
  .gh-relator-txt b { color: var(--gold); }
  .gh-relator-empty { color: var(--muted); font-style: italic; }

  /* ── podio vertical (En vivo) ── */
  .gh-podium { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.9rem; }
  .gh-pod-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.8rem; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); }
  .gh-pod-row.p1 { border-color: rgba(245,200,66,0.45); background: var(--gold-dim); }
  .gh-pod-row.p2 { border-color: rgba(160,180,200,0.4); background: var(--silver-dim); }
  .gh-pod-row.p3 { border-color: rgba(205,127,50,0.4); background: var(--bronze-dim); }
  .gh-pod-medal { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
  .gh-pod-name { flex: 1; min-width: 0; font-family: var(--font-head); font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.55rem; }
  .gh-pod-pts { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card.f2 .gh-pod-pts { color: var(--info); }

  /* ── barra de progreso de duelos jugados ── */
  .gh-progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-progress-label b { color: var(--text); }
  .gh-progress-bar { height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .gh-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #9fe066); transition: width .4s var(--ease); }
  .card.f2 .gh-progress-fill { background: linear-gradient(90deg, var(--info), #7fc4f5); }

  /* ── logros (En vivo) ── */
  .gh-logro-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.6rem 0.7rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); margin-bottom: 0.5rem; }
  .gh-logro-row:last-child { margin-bottom: 0; }
  .gh-logro-emoji { font-size: 20px; flex-shrink: 0; line-height: 1.3; }
  .gh-logro-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .gh-logro-title { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--gold); }
  .gh-logro-who { font-size: 12px; font-weight: 700; color: var(--text); }
  .gh-logro-desc { font-size: 11px; color: var(--muted); }

  #vivo-app .gh-empty, #vivo-app .gh-loading { text-align: center; }

  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  .gh-header { text-align: center; padding: 1.1rem 0 1.6rem; }
  .gh-avatar-wrap { display: flex; justify-content: center; margin-bottom: 0.7rem; }
  .gh-avatar-wrap .pa-img, .gh-avatar-wrap .pa-fallback { box-shadow: 0 0 0 3px var(--bg-2), 0 0 0 5px var(--accent-glow); }

  /* ── AVATARES (fotos de perfil publicadas desde velada.html) ── */
  .pa-img { border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block; }
  .pa-fallback { border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text); opacity: 0.92; }
  .pa-duo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .pa-duo > *:nth-child(2) { margin-left: -8px; }
  .pa-duo > *:nth-child(1) { z-index: 1; position: relative; }
  .ranking-name { display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .ranking-you { display: inline-block; margin-left: .2rem; padding: .12rem .35rem;
    border-radius: 99px; background: rgba(200,240,96,.16); color: var(--accent);
    font: 800 9px var(--font-head); letter-spacing: .05em; vertical-align: middle; white-space: nowrap; }
  .card.f2 .ranking-you { background: rgba(96,180,240,.16); color: var(--info); }
  .gh-eyebrow { font-family: var(--font-head); font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-title { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; text-shadow: 0 0 24px var(--accent-glow); }

  /* selection grid */
  /* La selección respira: en celular quedan 2 columnas, y en pantalla ancha
     se reparte en más para no dejar una tira angosta con todo vacío al lado. */
  .gh-sel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .65rem; margin-top: .5rem; }
  @media (min-width: 620px)  { .gh-sel-grid { grid-template-columns: repeat(3, 1fr); gap: .8rem; } }

  /* Solo esta pantalla se ensancha: el resto del panel sigue en 560px */
  body.sel-mode #app { max-width: 1100px; }
  .gh-sel-btn {

    border-radius: var(--radius-lg);
    padding: 1.35rem 0.5rem 1.1rem;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    transition: border-color 0.18s var(--ease), background 0.18s var(--ease), transform 0.18s var(--ease), box-shadow .18s var(--ease);
  }

  /* cards */

    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.85;
  }
  .card.f2::before { background: linear-gradient(90deg, transparent, var(--info), transparent); }

  .gh-stat-row { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.8rem; }
  .gh-pts { font-family: var(--font-display); font-size: 38px; font-weight: 800; color: var(--accent); line-height: 1; text-shadow: 0 0 20px var(--accent-glow); font-variant-numeric: tabular-nums; }

  .gh-pts-label { font-size: 12px; color: var(--muted); }
  .gh-pos {
    font-family: var(--font-head); font-size: 12.5px; font-weight: 700; color: var(--text);
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 99px;
    padding: 0.3rem 0.7rem; white-space: nowrap;
  }
  .gh-record { font-size: 12.5px; color: var(--muted); margin-bottom: 0.6rem; letter-spacing: 0.02em; }
  .gh-record .win { color: var(--success); font-weight: 700; }
  .gh-record .lose { color: var(--danger); font-weight: 700; }

  .gh-match {
    display: flex; align-items: center; gap: 0.65rem;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.7rem 0.85rem; margin-top: 0.55rem; font-size: 12.5px;
    transition: border-color .18s;
  }
  .gh-match-icon { font-size: 17px; flex-shrink: 0; }
  .gh-match-text { flex: 1; }
  .gh-match-tag { font-family: var(--font-head); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.2rem; }

  .gh-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 0.5rem 0; }

  /* ranking table */
  .gh-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; padding: 0.35rem 0; margin-top: 0.4rem; border-top: 1px dashed var(--border); padding-top: 0.75rem; list-style: none; }
  .gh-toggle::-webkit-details-marker { display: none; }
  .gh-toggle-arrow { transition: transform 0.18s var(--ease); color: var(--muted); font-size: 11px; }
  .gh-toggle.open .gh-toggle-arrow, details[open] > .gh-toggle .gh-toggle-arrow { transform: rotate(90deg); color: var(--accent); }
  .ranking { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 0.75rem; }
  .ranking th { font-family: var(--font-head); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--border); }
  .ranking td { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 13px; }

  .ranking tr:nth-child(1) td.pos::before { content: '🥇 '; }

  .ranking .pos { color: var(--muted); font-weight: 700; width: 34px; white-space: nowrap; }
  .ranking .pts { text-align: right; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card.f2 .ranking .pts { color: var(--info); }

  /* footer */
  .gh-footer { text-align: center; font-size: 11.5px; color: var(--muted); padding: 1.2rem 0 1.6rem; }
  .gh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 0.4rem; box-shadow: 0 0 8px rgba(255,95,95,0.7); animation: gh-pulse 1.4s infinite; }

  .gh-switch { display: block; margin: 0.75rem auto 0; background: transparent; border: 1px solid var(--border2); color: var(--muted); border-radius: var(--radius); padding: 0.45rem 1rem; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: color .18s, border-color .18s, background .18s; }
  .gh-switch:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

  .gh-wall-card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1rem; text-align: center; position: relative; overflow: hidden; }

  .gh-wall-sub { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-bottom: 0.9rem; }
  .gh-wall-btn { width: 100%; padding: 0.8rem; border-radius: 12px; border: 1.5px solid var(--info); background: var(--info-dim); color: var(--info); font-family: var(--font-head); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }

  /* ── Certificado individual ── */

  .gh-cert-card.team .gh-cert-btn { border-color: var(--info); background: var(--info-dim); color: var(--info); }
  .gh-cert-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.9; }

  .cert-overlay { position: fixed; inset: 0; z-index: 9700; display: none; align-items: flex-end; justify-content: center; }

  .cert-sheet { position: relative; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; background: var(--bg-2); border-radius: 22px 22px 0 0; padding: 1.4rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom)); animation: certUp .3s var(--ease); -webkit-overflow-scrolling: touch; }

  .cert-card { position: relative; border-radius: 20px; padding: 1.6rem 1.3rem 1.3rem; overflow: hidden; text-align: center; color: #fff;
    background: linear-gradient(160deg, var(--cert-color, #c8f060) 0%, #14141c 65%); }

  .cert-card::after { content:''; position:absolute; inset:0; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 20px; pointer-events: none; }

  .cert-name { position: relative; font-family: var(--font-display); font-size: 22px; font-weight: 900; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }

  .gh-bet-card, .gh-mii-card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1rem; position: relative; overflow: hidden; }

  /* ── acordeones (secciones plegables, se acuerdan si las abriste) ── */

  /* ── EVOLUCIÓN (gráfico de líneas embebido) ── */

  .gh-b-summary { font-size: 12px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem; margin-bottom: 0.75rem; line-height: 1.5; }

    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch (e) { lock = null; }
  }
  pedir();
  document.addEventListener('visibilitychange', pedir);
  // Algunos navegadores (Safari) solo lo dan después de un toque
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, pedir, { passive: true }));
})();
</script>
