<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  :root {
    --bg: #08080c;
    --bg-2: #0f0f16;
    --surface: #15151d;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f2f1ea;
    --muted: #8b8b96;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.10);
    --accent-glow: rgba(200,240,96,0.35);
    --gold: #f5c842;
    --gold-dim: rgba(245,200,66,0.10);
    --silver: #a0b4c8;
    --silver-dim: rgba(160,180,200,0.12);
    --danger: #ff5f6b;
    --success: #4ecb7e;
    --info: #60b4f0;
    --info-dim: rgba(96,180,240,0.10);
    --info-glow: rgba(96,180,240,0.35);
    --radius: 10px;
    --radius-lg: 18px;
    --font-display: 'Orbitron', 'Segoe UI', sans-serif;
    --font-head: 'Rajdhani', -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  html { background: var(--bg); }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(200,240,96,0.10), transparent 60%),
      radial-gradient(ellipse 600px 380px at 105% 8%, rgba(96,180,240,0.09), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 110%, rgba(245,200,66,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── layout raíz: paneles (Yo / En vivo) + barra de pestañas ── */
  #panels { flex: 1; min-height: 0; position: relative; }
  .panel { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .panel.hidden { display: none; }
  #app, #vivo-app { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 1.75rem; }

  .tabbar {
    display: flex; flex-shrink: 0; border-top: 1px solid var(--border2);
    background: rgba(15,15,22,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar.hidden { display: none; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
    padding: 0.6rem 0 0.5rem; font-family: var(--font-head); font-size: 11px; font-weight: 700;
    letter-spacing: 0.03em; transition: color .15s;
  }
  .tab-btn .tab-ic { font-size: 19px; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active .tab-ic { filter: drop-shadow(0 0 8px var(--accent-glow)); }

  /* ── selector de fase (En vivo) ── */
  .gh-seg { display: flex; background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; padding: 3px; margin-bottom: 1rem; }
  .gh-seg-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: var(--font-head); font-size: 12.5px; font-weight: 700; padding: 0.55rem 0.4rem; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; }
  .gh-seg-btn.active { background: var(--accent-dim); color: var(--accent); }
  .gh-seg-btn.active.f2 { background: var(--info-dim); color: var(--info); }

  /* ── relator: cartel fijo con novedades automáticas ── */
  .gh-relator {
    display: flex; align-items: center; gap: 0.55rem;
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border2); border-radius: var(--radius-lg);
    padding: 0.75rem 0.95rem; margin-bottom: 1rem; min-height: 44px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
    position: relative; overflow: hidden;
  }
  .gh-relator::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8; }
  .gh-relator-emoji { font-size: 17px; flex-shrink: 0; }
  .gh-relator-txt { flex: 1; transition: opacity .35s var(--ease); }
  .gh-relator-txt.fade { opacity: 0; }
  .gh-relator-txt b { color: var(--gold); }
  .gh-relator-empty { color: var(--muted); font-style: italic; }

  /* ── podio vertical (En vivo) ── */
  .gh-podium { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.9rem; }
  .gh-pod-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.8rem; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); }
  .gh-pod-row.p1 { border-color: rgba(245,200,66,0.45); background: var(--gold-dim); }
  .gh-pod-row.p2 { border-color: rgba(160,180,200,0.4); background: var(--silver-dim); }
  .gh-pod-row.p3 { border-color: rgba(205,127,50,0.4); background: var(--bronze-dim); }
  .gh-pod-medal { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
  .gh-pod-name { flex: 1; min-width: 0; font-family: var(--font-head); font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.55rem; }
  .gh-pod-pts { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card.f2 .gh-pod-pts { color: var(--info); }

  /* ── barra de progreso de duelos jugados ── */
  .gh-progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-progress-label b { color: var(--text); }
  .gh-progress-bar { height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .gh-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #9fe066); transition: width .4s var(--ease); }
  .card.f2 .gh-progress-fill { background: linear-gradient(90deg, var(--info), #7fc4f5); }

  /* ── logros (En vivo) ── */
  .gh-logro-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.6rem 0.7rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); margin-bottom: 0.5rem; }
  .gh-logro-row:last-child { margin-bottom: 0; }
  .gh-logro-emoji { font-size: 20px; flex-shrink: 0; line-height: 1.3; }
  .gh-logro-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .gh-logro-title { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--gold); }
  .gh-logro-who { font-size: 12px; font-weight: 700; color: var(--text); }
  .gh-logro-desc { font-size: 11px; color: var(--muted); }

  #vivo-app .gh-empty, #vivo-app .gh-loading { text-align: center; }

  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  .gh-header { text-align: center; padding: 1.1rem 0 1.6rem; }
  .gh-avatar-wrap { display: flex; justify-content: center; margin-bottom: 0.7rem; }
  .gh-avatar-wrap .pa-img, .gh-avatar-wrap .pa-fallback { box-shadow: 0 0 0 3px var(--bg-2), 0 0 0 5px var(--accent-glow); }

  /* ── AVATARES (fotos de perfil publicadas desde velada.html) ── */
  .pa-img { border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block; }
  .pa-fallback { border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text); opacity: 0.92; }
  .pa-duo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .pa-duo > *:nth-child(2) { margin-left: -8px; }
  .pa-duo > *:nth-child(1) { z-index: 1; position: relative; }
  .ranking-name { display: inline-flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .ranking-you { display: inline-block; margin-left: .2rem; padding: .12rem .35rem;
    border-radius: 99px; background: rgba(200,240,96,.16); color: var(--accent);
    font: 800 9px var(--font-head); letter-spacing: .05em; vertical-align: middle; white-space: nowrap; }
  .card.f2 .ranking-you { background: rgba(96,180,240,.16); color: var(--info); }
  .gh-eyebrow { font-family: var(--font-head); font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-title { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; text-shadow: 0 0 24px var(--accent-glow); }

  /* selection grid */
  /* La selección respira: en celular quedan 2 columnas, y en pantalla ancha
     se reparte en más para no dejar una tira angosta con todo vacío al lado. */
  .gh-sel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .65rem; margin-top: .5rem; }
  @media (min-width: 620px)  { .gh-sel-grid { grid-template-columns: repeat(3, 1fr); gap: .8rem; } }
  @media (min-width: 900px)  { .gh-sel-grid { grid-template-columns: repeat(4, 1fr); gap: .9rem; } }
  @media (min-width: 1200px) { .gh-sel-grid { grid-template-columns: repeat(5, 1fr); gap: 1rem; } }
  /* Solo esta pantalla se ensancha: el resto del panel sigue en 560px */
  body.sel-mode #app { max-width: 1100px; }
  .gh-sel-btn {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border2);

    padding: 1.35rem 0.5rem 1.1rem;

  }
  .gh-sel-btn .pa-img, .gh-sel-btn .pa-fallback { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px rgba(255,255,255,0.06); }
  .gh-sel-btn:hover .pa-img, .gh-sel-btn:hover .pa-fallback { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--accent-glow); }

  /* cards */

  .card::before {

  }
  .card.f2::before { background: linear-gradient(90deg, transparent, var(--info), transparent); }

  .gh-stat-row { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.8rem; }
  .gh-pts { font-family: var(--font-display); font-size: 38px; font-weight: 800; color: var(--accent); line-height: 1; text-shadow: 0 0 20px var(--accent-glow); font-variant-numeric: tabular-nums; }

  .gh-pts-label { font-size: 12px; color: var(--muted); }
  .gh-pos {
    font-family: var(--font-head); font-size: 12.5px; font-weight: 700; color: var(--text);
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 99px;
    padding: 0.3rem 0.7rem; white-space: nowrap;
  }
  .gh-record { font-size: 12.5px; color: var(--muted); margin-bottom: 0.6rem; letter-spacing: 0.02em; }

  .gh-record .lose { color: var(--danger); font-weight: 700; }

  .gh-match {
    display: flex; align-items: center; gap: 0.65rem;

  }

  .gh-match-tag { font-family: var(--font-head); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.2rem; }

  .gh-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 0.5rem 0; }

  /* ranking table */
  .gh-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; padding: 0.35rem 0; margin-top: 0.4rem; border-top: 1px dashed var(--border); padding-top: 0.75rem; list-style: none; }
  .gh-toggle::-webkit-details-marker { display: none; }

  .ranking { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 0.75rem; }

  .ranking tr.me td { background: var(--accent-dim); font-weight: 700; box-shadow: none; border-bottom-color: transparent; }

  /* footer */

  .gh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 0.4rem; box-shadow: 0 0 8px rgba(255,95,95,0.7); animation: gh-pulse 1.4s infinite; }

  .gh-switch { display: block; margin: 0.75rem auto 0; background: transparent; border: 1px solid var(--border2); color: var(--muted); border-radius: var(--radius); padding: 0.45rem 1rem; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: color .18s, border-color .18s, background .18s; }

  .gh-wall-card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1rem; text-align: center; position: relative; overflow: hidden; }

  .gh-wall-sub { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-bottom: 0.9rem; }
  .gh-wall-btn { width: 100%; padding: 0.8rem; border-radius: 12px; border: 1.5px solid var(--info); background: var(--info-dim); color: var(--info); font-family: var(--font-head); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }

  /* ── Certificado individual ── */
  .gh-cert-card { background: linear-gradient(135deg, var(--gold-dim), var(--surface) 60%); border: 1px solid rgba(245,200,66,0.3); border-radius: var(--radius-lg); padding: 1.05rem 1.15rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.9rem; position: relative; overflow: hidden; }

  .gh-cert-card.team .gh-cert-btn { border-color: var(--info); background: var(--info-dim); color: var(--info); }
  .gh-cert-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.9; }
  .gh-cert-card-emoji { font-size: 28px; line-height: 1; flex-shrink: 0; }
  .gh-cert-card-text { flex: 1; min-width: 0; }

  .gh-cert-card-sub { font-size: 11px; color: var(--muted); margin-top: 0.15rem; line-height: 1.4; }
  .gh-cert-btn { flex-shrink: 0; padding: 0.55rem 0.95rem; border-radius: 99px; border: 1.5px solid var(--gold); background: var(--gold-dim); color: var(--gold); font-family: var(--font-head); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: transform .15s var(--ease); }
  .gh-cert-btn:active { transform: scale(0.96); }

  .cert-overlay { position: fixed; inset: 0; z-index: 9700; display: none; align-items: flex-end; justify-content: center; }
  .cert-overlay.show { display: flex; }
  .cert-backdrop { position: absolute; inset: 0; background: rgba(4,4,7,0.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .cert-sheet { position: relative; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; background: var(--bg-2); border-radius: 22px 22px 0 0; padding: 1.4rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom)); animation: certUp .3s var(--ease); -webkit-overflow-scrolling: touch; }

  .cert-card { position: relative; border-radius: 20px; padding: 1.6rem 1.3rem 1.3rem; overflow: hidden; text-align: center; color: #fff;
    background: linear-gradient(160deg, var(--cert-color, #c8f060) 0%, #14141c 65%); }

  .cert-name { position: relative; font-family: var(--font-display); font-size: 22px; font-weight: 900; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }

  .gh-bet-card, .gh-mii-card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 1.15rem; margin-bottom: 1rem; position: relative; overflow: hidden; }

  /* ── acordeones (secciones plegables, se acuerdan si las abriste) ── */

  @keyframes gh-acc-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ── EVOLUCIÓN (gráfico de líneas embebido) ── */
  .gh-evo-titlebar { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.7rem; }

  .gh-evo-pos { font-size: 12px; font-weight: 800; color: var(--muted); min-width: 26px; }

    font-size: 13px; font-weight: 700; min-width: 0; }

  .gh-b-summary { font-size: 12px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem; margin-bottom: 0.75rem; line-height: 1.5; }

  .gh-b-row { display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.65rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); transition: border-color .18s; }

  .gh-b-game { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .gh-b-opts { display: flex; gap: 0.32rem; flex-shrink: 0; }
  .gh-b-opt { padding: 0.45rem 0.6rem; border-radius: 8px; border: 1.5px solid var(--border2); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .12s var(--ease), border-color .12s; }
  .gh-b-opt:active { transform: scale(0.95); }
  .gh-b-opt.picked { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }

  .gh-b-row.locked { opacity: 0.5; }
  .gh-b-window { font-size: 12px; font-weight: 700; text-align: center; padding: 0.6rem; border-radius: 10px; margin-bottom: 0.65rem; background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
  .gh-b-window.open { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

// Lee → modifica → escribe de forma ATÓMICA. Antes era getDoc + setDoc: si dos
// invitados guardaban a la vez (típico cuando se abren las apuestas), el
// segundo pisaba al primero y esa apuesta/foto se perdía sin aviso.
// mutate(obj) recibe el valor actual ya parseado y devuelve el nuevo.
async function mergeNdjDoc(key, fallback, mutate) {
  return runTransaction(db, async (tx) => {
    const ref = doc(db, 'ndj', key);
    const snap = await tx.get(ref);
    let cur = fallback;
    if (snap.exists()) {
      try { const o = JSON.parse(snap.data().data); if (o && typeof o === typeof fallback) cur = o; } catch (e) {}
    }
    const out = mutate(cur);
    tx.set(ref, { data: out.json, ts: Date.now() });
    return out;
  });
}

// Confirma la apuesta contra el estado actual del conductor en una sola
// transacción: si cerró la ronda, no guarda una elección tardía.
async function saveBetAtomically(type, key, myName, pick) {
  const bucket = type === 'f1' ? 'bets' : 'betsF2';
  return runTransaction(db, async tx => {
    const stateSnap = await tx.get(doc(db, 'ndj', 'state'));
    const betRef = doc(db, 'ndj', bucket);
    const betSnap = await tx.get(betRef);
    if (!stateSnap.exists()) throw new Error('Sin estado publicado');
    const current = JSON.parse(stateSnap.data().data);
    const bw = current[type === 'f1' ? 'betWindow' : 'betWindowF2'] || {};
    if (!bw.open || Number(key.split('-')[0]) !== bw.round || (current[type] || {})[key])
      throw new Error('La apuesta ya está cerrada para este duelo');
    const all = betSnap.exists() ? JSON.parse(betSnap.data().data || '{}') : {};
    all[key] = all[key] || {};
    all[key][myName] = pick;
    tx.set(betRef, { data: JSON.stringify(all), ts: Date.now() });
    return all;
  });
}

function findNextMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const pending = mine.filter(([r, a, b]) => !store[r + '-' + a + '-' + b]).sort((x, y) => x[0] - y[0]);
  if (!pending.length) return null;
  const [r, a, b, g] = pending[0];
  const oppIdx = a === idx ? b : a;
  const oppName = entities[oppIdx];
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  return { round: type==='f2'?guestRoundNumber(r):r, rawRound:r, oppName, game, key: r + '-' + a + '-' + b, phase: type };
}

function findLastMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const done = mine.filter(([r, a, b]) => store[r + '-' + a + '-' + b]).sort((x, y) => y[0] - x[0]);
  if (!done.length) return null;
  const [r, a, b, g] = done[0];
  const res = store[r + '-' + a + '-' + b];
  const oppIdx = a === idx ? b : a;
  const oppName = entities[oppIdx];
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  if (res.winner === 'empate') return { result: 'empate', oppName, game };
  const won = res.winner === idx;
  return { result: won ? 'gano' : 'perdio', oppName, game, bonus: !!res.bonus };
}

// ── CERTIFICADO INDIVIDUAL ───────────────────────────────────────────
// A diferencia del Wrapped grupal, esto arma UNA tarjeta con los datos de
// UN jugador puntual: su mejor racha, contra quién le costó más ganarle
// (su "némesis") y en qué juego brilló. Recorre F1_FIXTURE en orden de
// ronda (mismo criterio que detectLogros/computePhaseStats).
function computeCertStats(myName, myIdx) {
  const seq = []; // partidos de este jugador, en orden de ronda
  F1_FIXTURE.forEach(([r, a, b, g]) => {
    if (a !== myIdx && b !== myIdx) return;
    const key = r + '-' + a + '-' + b;
    const res = (latestState.f1 || {})[key];
    if (!res) return;
    const oppIdx = a === myIdx ? b : a;
    seq.push({ r, oppIdx, g, res });
  });
  seq.sort((x, y) => x.r - y.r);

  // Mejor racha de victorias seguidas
  let curStreak = 0, bestStreak = 0;
  seq.forEach(m => {
    if (m.res.winner === myIdx) { curStreak++; if (curStreak > bestStreak) bestStreak = curStreak; }
    else curStreak = 0;
  });

  // Némesis: rival contra el que más perdió (si hay empate en cantidad de
  // derrotas, el que además tiene el mejor balance a su favor)
  const vsRival = {}; // oppIdx -> { wins, losses, draws }
  seq.forEach(m => {
    const v = vsRival[m.oppIdx] || (vsRival[m.oppIdx] = { wins: 0, losses: 0, draws: 0 });
    if (m.res.winner === 'empate') v.draws++;
    else if (m.res.winner === myIdx) v.wins++;
    else v.losses++;
  });
  let nemesisIdx = -1, nemesisRec = null;
  Object.keys(vsRival).forEach(k => {
    const idx = Number(k), v = vsRival[k];
    if (v.losses <= 0) return;
    if (!nemesisRec || v.losses > nemesisRec.losses) { nemesisIdx = idx; nemesisRec = v; }
  });

  // Mejor juego: aquel donde tiene el mejor balance (victorias - derrotas),
  // priorizando más victorias en caso de empate
  const byGame = {}; // g -> { wins, losses, draws }
  seq.forEach(m => {
    const v = byGame[m.g] || (byGame[m.g] = { wins: 0, losses: 0, draws: 0 });
    if (m.res.winner === 'empate') v.draws++;
    else if (m.res.winner === myIdx) v.wins++;
    else v.losses++;
  });
  let bestGameIdx = -1, bestGameRec = null, bestGameScore = -Infinity;
  Object.keys(byGame).forEach(k => {
    const idx = Number(k), v = byGame[k];
    if (v.wins <= 0) return;
    const score = (v.wins - v.losses) * 10 + v.wins;
    if (score > bestGameScore) { bestGameScore = score; bestGameIdx = idx; bestGameRec = v; }
  });

  const list = ranked('f1');
  const posIdx = list.findIndex(e => e.i === myIdx);
  const mine = list[posIdx];

  return {
    total: mine ? mine.total : 0,
    wins: mine ? mine.wins : 0,
    losses: mine ? mine.losses : 0,
    position: posIdx + 1,
    outOf: list.length,
    played: seq.length,
    bestStreak,
    nemesisName: nemesisIdx >= 0 ? PLAYERS[nemesisIdx] : null,
    nemesisLosses: nemesisRec ? nemesisRec.losses : 0,
    nemesisPlayed: nemesisRec ? (nemesisRec.wins + nemesisRec.losses + nemesisRec.draws) : 0,
    bestGameName: bestGameIdx >= 0 ? gameNameF1(bestGameIdx) : null,
    bestGameWins: bestGameRec ? bestGameRec.wins : 0,
    bestGamePlayed: bestGameRec ? (bestGameRec.wins + bestGameRec.losses + bestGameRec.draws) : 0,
  };
}

// Carga html2canvas + jsPDF bajo demanda (recién cuando alguien quiere
// descargar), para no pesar el dashboard con librerías que casi nadie usa.
let _certLibsPromise = null;
function ensureCertLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (_certLibsPromise) return _certLibsPromise;
  const load = src => new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error('No se pudo cargar ' + src));
    document.head.appendChild(el);
  });
  _certLibsPromise = Promise.all([
    window.html2canvas ? Promise.resolve() : load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    window.jspdf ? Promise.resolve() : load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).catch(err => { _certLibsPromise = null; throw err; });
  return _certLibsPromise;
}

function downloadCertificatePdf(myName) {
  const card = document.getElementById('cert-card-capture');
  const btn = document.getElementById('cert-dl-btn');
  const status = document.getElementById('cert-dl-status');
  if (!card) return;
  btn.classList.add('busy'); btn.textContent = '⏳ Generando...';
  if (status) status.textContent = '';
  ensureCertLibs().then(() => {
    return window.html2canvas(card, { backgroundColor: null, useCORS: true, scale: 3 });
  }).then(canvas => {
    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');
    // PDF vertical tipo tarjeta, centrado, con margen — no una hoja A4 en blanco
    // alrededor de un cuadradito perdido.
    const marginMm = 12;
    const cardWmm = 100;
    const cardHmm = cardWmm * (canvas.height / canvas.width);
    const pageW = cardWmm + marginMm * 2;
    const pageH = cardHmm + marginMm * 2;
    const doc = new jsPDF({ orientation: pageH >= pageW ? 'portrait' : 'landscape', unit: 'mm', format: [pageW, pageH] });
    doc.setFillColor(10, 10, 14);
    doc.rect(0, 0, pageW, pageH, 'F');
    doc.addImage(imgData, 'PNG', marginMm, marginMm, cardWmm, cardHmm);
    const safeName = String(myName || 'jugador').split('/')[0].trim().replace(/[^a-z0-9áéíóúñ]+/gi, '-');
    doc.save(`certificado-${safeName}.pdf`);
    if (status) status.textContent = '¡Listo! Revisá tus descargas 🎉';
  }).catch(err => {
    console.warn('No se pudo generar el certificado:', err);
    if (status) status.textContent = 'No se pudo generar el PDF. Probá de nuevo.';
  }).finally(() => {
    btn.classList.remove('busy'); btn.textContent = '⬇️ Descargar PDF';
  });
}

// ── FOTOS DE PERFIL (las publica el organizador desde velada.html) ──
// Mismo documento Firestore ('ndj/photos') que arma velada.html: un mapa
// { nombre: dataURL }. Para jugadores solo (Impostor) la clave es el apodo
// (ej. "Risu"); para integrantes de equipo (Fase grupal) la clave es el nombre
// completo tal como aparece en TEAMS (ej. "Martín H."). Replicamos acá el
// mismo criterio de resolución que usa velada.html para que coincidan.
let PLAYER_PHOTOS = {};
function getPlayerPhoto(name) { return PLAYER_PHOTOS[String(name || '').trim()] || PLAYER_PHOTOS[name] || null; }
function entityMembers(name) { return String(name || '').split('/').map(s => s.trim()).filter(Boolean); }
function entityPhotos(name) {
  const parts = entityMembers(name);
  if (parts.length > 1) {
    const teamPhoto = getPlayerPhoto(name);
    return parts.map(p => getPlayerPhoto(p) || null).map((p, i) => p || (i === 0 ? teamPhoto : null));
  }
  return [getPlayerPhoto(name) || null];
}
function avatarColor(name) {
  const s = String(name || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return MII_COLORS[h % MII_COLORS.length];
}
function avatarFallbackHtml(name, size) {
  const initial = (String(name).trim()[0] || '?').toUpperCase();
  return `<div class="pa-fallback" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px;background:${avatarColor(name)}">${escapeHtml(initial)}</div>`;
}
// Avatar (foto real si hay, si no un círculo de color con la inicial). Para
// equipos de dos (nombre con "/") arma un dúo de avatares solapados.
function avatarHtml(name, size) {
  size = size || 28;
  const parts = entityMembers(name);
  if (parts.length > 1) {
    const s2 = Math.round(size * 0.86);
    const ph = entityPhotos(name);
    const one = (p, m) => p ? `<img class="pa-img" src="${p}" style="width:${s2}px;height:${s2}px" alt="">` : avatarFallbackHtml(m, s2);
    return `<span class="pa-duo">${one(ph[0], parts[0])}${one(ph[1], parts[1])}</span>`;
  }
  const photo = getPlayerPhoto(name);
  if (photo) return `<img class="pa-img" src="${photo}" style="width:${size}px;height:${size}px" alt="">`;
  return avatarFallbackHtml(name.split('/')[0], size);
}

// ── LA NOCHE EN VIVO (pantalla de selección) ─────────────────
// Debajo de la grilla, para que quien agarra el celular vea cómo viene todo
// antes de identificarse. En escritorio además llena el espacio que sobraba.
function estadoNoche() {
  const f1Tot = (F1_FIXTURE || []).length;
  const f1Hay = (F1_FIXTURE || []).filter(m => (latestState.f1 || {})[m[0]+'-'+m[1]+'-'+m[2]]).length;
  const f2Tot = (F2_FIXTURE || []).length;
  const f2Hay = (F2_FIXTURE || []).filter(m => (latestState.f2 || {})[m[0]+'-'+m[1]+'-'+m[2]]).length;
  const imp   = ((latestState.impostor || {}).rounds || []).length;

  let fase, icono, hechos, total;
  if (f1Hay < f1Tot)      { fase = 'Impostor'; icono = '🎮'; hechos = f1Hay; total = f1Tot; }
  else if (f2Hay < f2Tot) { fase = 'Fase grupal';    icono = '👥'; hechos = f2Hay; total = f2Tot; }
  else                    { fase = 'Fase final';          icono = '🏆'; hechos = 1;     total = 1; }

  const arrancó = (f1Hay + f2Hay + imp) > 0;
  return { fase, icono, hechos, total, arrancó, f1Hay, f1Tot, f2Hay, f2Tot };
}

function ultimosResultados(n) {
  const out = [];
  (F1_FIXTURE || []).forEach(m => {
    const r = (latestState.f1 || {})[m[0]+'-'+m[1]+'-'+m[2]];
    if (r) out.push({ f: 'f1', r, a: PLAYERS[m[1]], b: PLAYERS[m[2]], g: gameNameF1(m[3]) });
  });
  (F2_FIXTURE || []).forEach(m => {
    const r = (latestState.f2 || {})[m[0]+'-'+m[1]+'-'+m[2]];
    if (r) out.push({ f: 'f2', r, a: TEAMS[m[1]], b: TEAMS[m[2]], g: gameNameF2(m[3]) });
  });
  return out.reverse().slice(0, n || 3);
}

// Cuántas rondas faltan para tu próximo duelo. Sirve para saber si podés ir a
// comer tranquilo o si tenés que estar yendo a la mesa.
function roundsAway(type, nextRound) {
  const fx = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = (type === 'f1' ? latestState.f1 : latestState.f2) || {};
  const pend = new Set();
  fx.forEach(m => { if (!store[m[0] + '-' + m[1] + '-' + m[2]]) pend.add(m[0]); });
  // Rondas pendientes anteriores a la tuya
  return [...pend].filter(r => (type==='f2'?guestRoundNumber(r):r) < nextRound).length;
}

function nextBadge(type, nextRound) {
  const away = roundsAway(type, nextRound);
  if (away === 0) return '<span class="gh-away soon">Ronda próxima</span>';
  if (away === 1) return '<span class="gh-away soon">⏱️ Falta 1 ronda</span>';
  return '<span class="gh-away">Faltan ' + away + ' rondas</span>';
}

function matchIsActive(next) {
  return !!(next && (latestState.activeMatches || []).some(m =>
    m.phase === next.phase && m.key === next.key && !(latestState[next.phase] || {})[m.key]));
}

function renderNextHero(myIdx, teamIdx) {
  const order=RoundPlan.order(latestState,F2_FIXTURE,(latestRules?.f2||[]).map(g=>g.name));
  const id=order.find(id=>!guestRoundDone(id));
  if(id&&!id.startsWith('duel:')){
    const name={guess:'Guess Movies/Songs',argentinos:'100 Argentinos Dicen',impostor:'Impostor',qld:'¿Quién lo dijo?',teg:'🌍 TEG Express'}[id];
    return `<div class="gh-next-hero"><div class="gh-next-kicker">Tu próxima ronda</div><div class="gh-next-main">${name}${id==='teg'?'<br><a href="teg.html" style="font-size:13px;color:var(--accent)">Entrar a TEG Express →</a>':''}</div><div class="gh-next-meta">Ronda ${order.indexOf(id)+1} · ${id==='impostor'?'Individual · solo puntúa en Impostor':'Todos los equipos juntos'}</div></div>`;
  }
  const solo = null;
  const team = teamIdx >= 0 ? findNextMatch('f2', teamIdx) : null;
  const active = [solo, team].find(matchIsActive);
  const next = active || solo || team;
  if (!F1_FIXTURE.length && !F2_FIXTURE.length)
    return `<div class="gh-next-hero"><div class="gh-next-kicker">Tus duelos</div>
      <div class="gh-next-main">Esperando el fixture del organizador</div></div>`;
  if (!next) return `<div class="gh-next-hero"><div class="gh-next-kicker">Tus duelos</div>
    <div class="gh-next-main">No te quedan duelos pendientes en el fixture</div></div>`;
  return `<div class="gh-next-hero${active ? ' active' : ''}">
    <div class="gh-next-kicker">${active ? '👉 Cruce activado por el conductor' : 'Tu próximo duelo · ' + (next.phase === 'f1' ? 'Impostor' : 'Fase grupal')}</div>
    <div class="gh-next-main">${next.phase === 'f2' ? 'Tu equipo vs. ' : 'Vos vs. '}${escapeHtml(next.oppName)}</div>
    <div class="gh-next-meta">Ronda ${next.round} · ${escapeHtml(next.game)}${active ? ' · Acercate a jugar' : ' · Esperá la activación del conductor'}</div>
  </div>`;
}


// ── ES TU TURNO ──────────────────────────────────────────────
// Cuando no quedan rondas por delante, la pantalla entera lo avisa: en una
// fiesta nadie está mirando el celular fijo, y un cartelito chico se pierde.
let _turnoAvisado = null;
let _turnoListo = false;   // no avisamos apenas se abre la app

function chequearTurno(myName, myIdx, teamIdx) {
  let aviso = null;
  const n1 = findNextMatch('f1', myIdx);
  if (matchIsActive(n1)) {
    aviso = { key: 'f1-' + n1.key, fase: 'Impostor',
              rival: n1.oppName, juego: n1.game, color: 'var(--accent)' };
  } else if (teamIdx >= 0) {
    const n2 = findNextMatch('f2', teamIdx);
    if (matchIsActive(n2)) {
      aviso = { key: 'f2-' + n2.key, fase: 'Fase grupal',
                rival: n2.oppName, juego: n2.game, color: 'var(--info)' };
    }
  }
  if (!aviso) { _turnoAvisado = null; return; }
  if (_turnoAvisado === aviso.key) return;   // ya avisamos este duelo
  _turnoAvisado = aviso.key;
  // La primera lectura evita una interrupción a pantalla completa al abrir.
  if (!_turnoListo) { _turnoListo = true; return; }
  mostrarTurno(aviso);
}

function mostrarTurno(a) {
  let el = document.getElementById('gh-turno');
  if (!el) {
    el = document.createElement('div');
    el.id = 'gh-turno';
    el.className = 'gh-turno';
    document.body.appendChild(el);
  }
  el.style.setProperty('--tc', a.color);
  el.innerHTML =
    '<div class="gt-lbl">' + a.fase + ' · te toca</div>' +
    '<div class="gt-vs">vs</div>' +
    '<div class="gt-rival">' + escapeHtml(a.rival) + '</div>' +
    '<div class="gt-juego">' + escapeHtml(a.juego || '') + '</div>' +
    '<button class="gt-ok">Voy para allá</button>';
  el.classList.add('show');
  el.querySelector('.gt-ok').onclick = () => el.classList.remove('show');
  el.onclick = (e) => { if (e.target === el) el.classList.remove('show'); };
  buzz([60, 80, 60, 80, 200]);
  try { sfxTurno(); } catch (e) {}
}

function sfxTurno() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!window._ghAC) window._ghAC = new AC();
  const ctx = window._ghAC;
  if (ctx.state === 'suspended') ctx.resume();
  const t = ctx.currentTime;
  [659.25, 880, 1046.5].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, t + i * 0.11);
    g.gain.setValueAtTime(0.0001, t + i * 0.11);
    g.gain.exponentialRampToValueAtTime(0.20, t + i * 0.11 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.55);
  });
}

// ── TU MOMENTO ───────────────────────────────────────────────
// Rescata lo mejor que te pasó hasta ahora. Cambia solo con la noche.
function renderMyMoment(myName, myIdx) {
  const f1 = latestState.f1 || {};
  let mejorRacha = 0, racha = 0, conBonus = 0, victorias = 0;

  F1_FIXTURE.forEach(m => {
    const res = f1[m[0] + '-' + m[1] + '-' + m[2]];
    if (!res) return;
    if (m[1] !== myIdx && m[2] !== myIdx) return;
    if (res.winner === myIdx) {
      victorias++; racha++;
      if (racha > mejorRacha) mejorRacha = racha;
      if (res.bonus) conBonus++;
    } else if (res.winner !== 'empate') racha = 0;
  });

  const t = myBetTally(myName);
  const cands = [];
  if (mejorRacha >= 3) cands.push({ e:'🔥', t:'Racha de ' + mejorRacha, s:'Ganaste ' + mejorRacha + ' duelos seguidos' });
  if (conBonus > 0)    cands.push({ e:'⭐', t:conBonus + ' victoria' + (conBonus>1?'s':'') + ' con bonus', s:'Ganaste en grande' });
  if (t.hits >= 3)     cands.push({ e:'🃏', t:t.hits + ' apuestas acertadas', s:'Ojo clínico' });
  if (mejorRacha === 2) cands.push({ e:'⚡', t:'Doblete', s:'Dos victorias al hilo' });
  if (victorias > 0 && !cands.length) cands.push({ e:'✅', t:'Primera victoria', s:'Ya rompiste el hielo' });

  if (!cands.length) return '';
  const m = cands[0];
  return `<div class="gh-moment">
    <span class="gm-emoji">${m.e}</span>

// ── NÚMEROS QUE SE MUEVEN ────────────────────────────────────
// Antes los puntajes saltaban de golpe y el cambio pasaba desapercibido.
function contarHasta(el, desde, hasta, dur) {
  if (!el || desde === hasta) { if (el) el.textContent = hasta; return; }
  dur = dur || 650;
  const t0 = performance.now();
  const dec = (hasta % 1 !== 0) || (desde % 1 !== 0);
  function paso(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const v = desde + (hasta - desde) * e;
    el.textContent = dec ? v.toFixed(1) : Math.round(v);
    if (k < 1) requestAnimationFrame(paso);
    else { el.textContent = hasta; el.classList.add('num-pop');
           setTimeout(() => el.classList.remove('num-pop'), 500); }
  }
  requestAnimationFrame(paso);
}

// ── POSICIÓN CON FLECHA DE MOVIMIENTO ────────────────────────
// Guarda dónde estabas la última vez para poder decirte si subiste o bajaste.
function leerPosPrevia(who) {
  try { const v = localStorage.getItem('ndj_pos_' + who); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function guardarPos(who, pos, pts) {
  try { localStorage.setItem('ndj_pos_' + who, JSON.stringify({ pos, pts, ts: Date.now() })); }
  catch (e) {}
}

// A cuántos puntos estás del que tenés arriba
function distanciaArriba(myName) {
  const r = ranked('f1');
  const i = r.findIndex(x => x.n === myName);
  if (i <= 0) return null;                     // sos primero o no estás
  const arriba = r[i - 1];
  return { puesto: i, faltan: Math.max(0, (arriba.total || 0) - (r[i].total || 0)),
           quien: arriba.n };
}

// ── AVISO DE QUE TE PASARON ──────────────────────────────────
let _ultimaPos = null;
function chequearAdelantamiento(myName) {
  const r = ranked('f1');
  const pos = r.findIndex(x => x.n === myName) + 1;
  if (!pos) return;
  if (_ultimaPos !== null && pos > _ultimaPos) {
    const quien = r[pos - 2];                  // el que quedó justo arriba
    avisoBreve('📉', 'Te pasaron', quien ? 'Ahora ' + shortName(quien.n, true) + ' está arriba tuyo' : '');
  } else if (_ultimaPos !== null && pos < _ultimaPos) {
    avisoBreve('📈', '¡Subiste!', 'Ahora vas ' + pos + '°');
  }
  _ultimaPos = pos;
}

function avisoBreve(emoji, titulo, sub) {
  let el = document.getElementById('gh-aviso');
  if (!el) {
    el = document.createElement('div');
    el.id = 'gh-aviso'; el.className = 'gh-aviso';
    document.body.appendChild(el);
  }
  el.innerHTML = '<span class="ga-e">' + emoji + '</span>' +
                 '<span class="ga-t"><b>' + escapeHtml(titulo) + '</b>' +
                 (sub ? '<span>' + escapeHtml(sub) + '</span>' : '') + '</span>';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  buzz(30);
  clearTimeout(avisoBreve._t);
  avisoBreve._t = setTimeout(() => el.classList.remove('show'), 3200);
}

// ── RESUMEN DE UN VISTAZO ────────────────────────────────────
// Los tres datos que uno mira cada vez que saca el celular: en qué puesto va,
// cuántos puntos tiene y cómo viene su récord. Antes había que scrollear y
// armarlos de memoria.
function miResumen(myName, myIdx, teamIdx) {
  const ranking=ranked('f2'),name=TEAMS[teamIdx];
  const yo=ranking.find(x=>x.n===name)||{total:0,wins:0,losses:0};
  const position=ranking.findIndex(x=>x.n===name)+1;
  return {pos1:position,pts1:yo.total,wins:yo.wins||0,losses:yo.losses||0,pos2:position,pts2:yo.total,total:TEAMS.length};
}

function renderResumen(myName, myIdx, teamIdx) {
  const r = miResumen(myName, myIdx, teamIdx);
  const medalla = r.pos1 === 1 ? '🥇' : r.pos1 === 2 ? '🥈' : r.pos1 === 3 ? '🥉' : '';
  const cls = r.pos1 === 1 ? ' lider' : '';

  // Comparación con la última vez que miró: el dato que más engancha
  const prev = leerPosPrevia(myName);
  let flecha = '';
  if (prev && prev.pos && r.pos1 && prev.pos !== r.pos1) {
    const d = prev.pos - r.pos1;   // positivo = subió
    flecha = d > 0
      ? `<span class="gr-mov sube">▲${d}</span>`
      : `<span class="gr-mov baja">▼${Math.abs(d)}</span>`;
  }
  if (r.pos1) guardarPos(myName, r.pos1, r.pts1);

  return `<div class="gh-resumen${cls}">
    <div class="gr-item">
      <div class="gr-lbl">Puesto</div>
      <div class="gr-val">${medalla}${r.pos1 || '—'}<span class="gr-sub">/${r.total}</span>${flecha}</div>
    </div>
    <div class="gr-sep"></div>
    <div class="gr-item">
      <div class="gr-lbl">Puntos</div>
      <div class="gr-val">${r.pts1}</div>
    </div>
    <div class="gr-sep"></div>
    <div class="gr-item">
      <div class="gr-lbl">Récord</div>
      <div class="gr-val small">${r.wins}<span class="gr-sub">G</span> ${r.losses}<span class="gr-sub">P</span></div>
    </div>
    ${teamIdx >= 0 ? `<div class="gr-sep"></div>
    <div class="gr-item">
      <div class="gr-lbl">Tu equipo</div>
      <div class="gr-val small">${r.pos2 || '—'}<span class="gr-sub">°</span> · ${r.pts2}<span class="gr-sub">pt</span></div>
    </div>` : ''}
  </div>
`;
}

// Cuánto te falta para pasar al de arriba: da un objetivo concreto
function renderDistancia(myName) {
  const d = distanciaArriba(myName);
  if (!d) {
    const r = ranked('f1');
    const yo = r.find(x => x.n === myName);
    if (yo && yo.total > 0 && r[0] && r[0].n === myName && r[1]) {
      const vent = yo.total - (r[1].total || 0);
      return `<div class="gh-dist lider">👑 Vas primero · <b>${vent}</b> de ventaja sobre ${escapeHtml(shortName(r[1].n, true))}</div>`;
    }
    return '';
  }
  if (d.faltan === 0) {
    return `<div class="gh-dist empate">⚖️ Empatado con ${escapeHtml(shortName(d.quien, true))} por el ${d.puesto}° puesto</div>`;
  }
  const pct = Math.max(6, Math.min(100, 100 - (d.faltan * 12)));
  return `<div class="gh-dist">
    <div class="gd-txt">A <b>${d.faltan}</b> ${d.faltan === 1 ? 'punto' : 'puntos'} del ${d.puesto}° puesto
      <span class="gd-quien">(${escapeHtml(shortName(d.quien, true))})</span></div>
    <div class="gd-bar"><div class="gd-fill" style="width:${pct}%"></div></div>
  </div>`;
}

// ── TU MOMENTO ───────────────────────────────────────────────
// Rescata lo mejor que te pasó hasta ahora y lo pone en primer plano.
function miMomento(myName, myIdx) {
  const store = latestState.f1 || {};
  let mejorRacha = 0, rachaActual = 0, conBonus = 0, ultimaVict = null;
  (F1_FIXTURE || []).forEach(m => {
    const res = store[m[0] + '-' + m[1] + '-' + m[2]];
    if (!res) return;
    if (m[1] !== myIdx && m[2] !== myIdx) return;
    if (res.winner === myIdx) {
      rachaActual++;
      if (rachaActual > mejorRacha) mejorRacha = rachaActual;
      if (res.bonus) conBonus++;
      ultimaVict = gameNameF1(m[3]);
    } else if (res.winner !== 'empate') rachaActual = 0;
  });
  const t = myBetTally(myName);

  if (mejorRacha >= 3) return { e: '🔥', t: `${mejorRacha} victorias al hilo`, s: 'Estás en llamas' };
  if (conBonus >= 2)   return { e: '⭐', t: `${conBonus} victorias con bonus`, s: 'Ganás en grande' };
  if (t.net >= 3)      return { e: '🃏', t: `${t.net} apuestas acertadas`, s: 'Ojo de vidente' };
  if (ultimaVict)      return { e: '🏆', t: `Ganaste en ${ultimaVict}`, s: 'Tu última victoria' };
  if (mejorRacha === 2) return { e: '⚡', t: 'Doblete', s: 'Dos seguidas' };
  return null;
}

function renderMomento(myName, myIdx) {
  const m = miMomento(myName, myIdx);
  if (!m) return '';
  return `<div class="gh-momento">
    <span class="gm-emoji">${m.e}</span>
    <span class="gm-txt"><b>${escapeHtml(m.t)}</b><span>${escapeHtml(m.s)}</span></span>
  </div>`;
}

// ── COMPARACIÓN CON EL GRUPO ─────────────────────────────────
function promedioGrupo() {
  const r = ranked('f1');
  if (!r.length) return { pts: 0, wins: 0 };
  const pts = r.reduce((a, x) => a + (x.total || 0), 0) / r.length;
  const wins = r.reduce((a, x) => a + (x.wins || 0), 0) / r.length;
  return { pts: Math.round(pts * 10) / 10, wins: Math.round(wins * 10) / 10 };
}

    ${mine ? `<div class="gh-path-note">${escapeHtml(mine)}</div>` : ''}
    ${row('Gran final', f2[0], f2[1], grand.ganador)}

// Si una tarjeta opcional falla, no debe tumbar todo el dashboard
function safeBlock(fn) { try { return fn() || ''; } catch (e) { console.warn('bloque omitido:', e); return ''; } }

// ── APUESTAS ─────────────────────────────────────────────────
// Se puede apostar en TODOS los duelos, incluido el propio.
const betFeedback = { f1: '', f2: '' };
// Cada acierto = 1 pt. Pero si apostás a tu propio duelo y lo perdés,
// se te borran todos los puntos que hayas ganado apostando.
function myBetTally(myName) {
  const bets = latestState.bets || {};
  const myIdx = PLAYERS.indexOf(myName);
  let hits = 0, misses = 0, blown = false, pending = 0;
  Object.keys(bets).forEach(key => {
    const b = bets[key][myName];
    if (typeof b !== 'number') return;
    const res = (latestState.f1 || {})[key];
    if (!res) { pending++; return; }
    if (res.winner === 'empate') return;
    const p = key.split('-').map(Number);
    const own = (p[1] === myIdx || p[2] === myIdx);
    if (res.winner === b) hits++;
    else { misses++; if (own) blown = true; }
  });
  return { hits: hits, misses: misses, blown: blown, pending: pending, net: blown ? 0 : hits };
}

function renderBetCard(myName, myIdx) {
  const bets = latestState.bets || {};
  const bw = latestState.betWindow || { open: false, round: 0 };
  const t = myBetTally(myName);

  const buildRow = m => {
    const key = m[0] + '-' + m[1] + '-' + m[2];
    const res = (latestState.f1 || {})[key];
    const own = (m[1] === myIdx || m[2] === myIdx);
    const mine = (bets[key] || {})[myName];
    const nA = String(PLAYERS[m[1]] || '?').split(' ')[0];
    const nB = String(PLAYERS[m[2]] || '?').split(' ')[0];
    const game = gameNameF1(m[3]);
    // Solo se puede apostar la ronda que el conductor tenga abierta
    const bettable = bw.open && m[0] === bw.round && !res;

    if (res) {
      let mark = '<span class="gh-b-none">sin apuesta</span>';
      if (typeof mine === 'number') {
        if (res.winner === 'empate') mark = '<span class="gh-b-none">empate</span>';
        else if (res.winner === mine) mark = '<span class="gh-b-hit" aria-label="Acertaste, +1 punto">✓ +1</span>';
        else mark = own ? '<span class="gh-b-blown">✕ perdiste el tuyo</span>' : '<span class="gh-b-miss" title="No acertaste" aria-label="No acertaste">✕</span>';
      }
      const wName = res.winner === 'empate' ? 'Empate' : String(PLAYERS[res.winner] || '?').split(' ')[0];
      return `<div class="gh-b-row done${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)} · ganó ${escapeHtml(wName)}</span></div>
        <div class="gh-b-mark">${mark}</div>
      </div>`;
    }

    if (!bettable) {
      const why = typeof mine === 'number'
        ? '<span class="gh-b-locked">🔒 ' + escapeHtml(String(PLAYERS[mine] || '').split(' ')[0]) + '</span>'
        : '<span class="gh-b-locked">🔒</span>';
      return `<div class="gh-b-row locked${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu duelo</b>' : ''}</span></div>
        <div class="gh-b-mark">${why}</div>
      </div>`;
    }

    const btn = (idx, nm) => `<button class="gh-b-opt${mine === idx ? ' picked' : ''}" data-key="${key}" data-bet="${idx}">${escapeHtml(nm)}</button>`;
    return `<div class="gh-b-row${own ? ' own' : ''}">
      <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
      <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu duelo</b>' : ''}</span></div>
      <div class="gh-b-opts">${btn(m[1], nA)}${btn(m[2], nB)}</div>
    </div>`;
  };

  // Los duelos de la ronda abierta van siempre visibles y primero: son los
  // únicos en los que realmente se puede apostar ahora. El resto (jugados
  // o todavía bloqueados) queda colapsado debajo, para no obligar a
  // scrollear entre 30 duelos para encontrar dónde apostar.
  const fixture = F1_FIXTURE || [];
  const openMatches = bw.open ? fixture.filter(m => m[0] === bw.round) : [];
  const restMatches = bw.open ? fixture.filter(m => m[0] !== bw.round) : fixture;

  const openRows = openMatches.map(buildRow).join('');
  const restRows = restMatches.map(buildRow).join('');

  const banner = bw.open

// Mismo mecanismo que en Impostor, pero apostando a los duelos de equipos.
// Cada acierto suma 1 punto al EQUIPO del apostador (Fase grupal puntúa por equipo).
function myBetTallyF2(myName) {
  const bets = latestState.betsF2 || {};
  const myTeamIdx = teamIndexForPlayer(myName);
  let hits = 0, misses = 0, blown = false, pending = 0;
  Object.keys(bets).forEach(key => {
    const b = bets[key][myName];
    if (typeof b !== 'number') return;
    const res = (latestState.f2 || {})[key];
    if (!res) { pending++; return; }
    if (res.winner === 'empate') return;
    const p = key.split('-').map(Number);
    const own = (p[1] === myTeamIdx || p[2] === myTeamIdx);
    if (res.winner === b) hits++;
    else { misses++; if (own) blown = true; }
  });
  return { hits: hits, misses: misses, blown: blown, pending: pending, net: blown ? 0 : hits };
}

const WIN_SOUNDS = [
  { id: 'fanfarria', nom: 'Fanfarria',  emoji: '🎺', desc: 'Clásico de podio' },
  { id: 'arcade',    nom: 'Arcade',     emoji: '🕹️', desc: 'Subida ochentosa' },
  { id: 'campanas',  nom: 'Campanas',   emoji: '🔔', desc: 'Brillante y limpio' },
  { id: 'grave',     nom: 'Grave',      emoji: '🥁', desc: 'Golpe con peso' },

];

// Reproduce el sonido elegido. Vive acá para poder probarlo desde el celular;
// la pantalla grande usa su propia copia con la misma receta.
function tocarWinSound(id) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!window._wsAC) window._wsAC = new AC();
  const ctx = window._wsAC;
  if (ctx.state === 'suspended') ctx.resume();
  const t = ctx.currentTime;

  const nota = (f, cuando, dur, tipo, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo || 'triangle';
    o.frequency.setValueAtTime(f, t + cuando);
    g.gain.setValueAtTime(0.0001, t + cuando);
    g.gain.exponentialRampToValueAtTime(vol || 0.20, t + cuando + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + cuando + (dur || 0.4));
    o.connect(g); g.connect(ctx.destination);
    o.start(t + cuando); o.stop(t + cuando + (dur || 0.4) + 0.05);
  };

  if (id === 'arcade') {
    [523,659,784,1047,1319].forEach((f, i) => nota(f, i * 0.055, 0.25, 'square', 0.14));
  } else if (id === 'campanas') {
    [1047,1319,1568].forEach((f, i) => nota(f, i * 0.09, 0.9, 'sine', 0.18));
    nota(2093, 0.27, 1.2, 'sine', 0.10);
  } else if (id === 'grave') {
    nota(110, 0, 0.5, 'sine', 0.32);
    nota(165, 0.06, 0.45, 'triangle', 0.20);
    nota(220, 0.12, 0.6, 'sine', 0.16);
  } else if (id === 'chiflido') {
    // Silbido que sube y baja, tipo "uuuh"
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + 0.18);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.6);
  } else {
    // fanfarria (por defecto)
    [392,523,659].forEach((f, i) => nota(f, i * 0.07, 0.3, 'triangle', 0.18));
    nota(784, 0.21, 0.8, 'triangle', 0.24);
  }
}

const WALL_MAX_GUEST = 40;
const WALL_FB_BUDGET_GUEST = 700000; // ~700 KB, con margen bajo el límite de 1 MB

// Deja el muro dentro del presupuesto descartando las fotos más viejas.
// Devuelve el JSON listo para subir y cuántas se tuvieron que sacar.
function wallWithinBudget(list) {
  let arr = list.slice();
  let json = JSON.stringify(arr);
  let dropped = 0;
  while (json.length > WALL_FB_BUDGET_GUEST && arr.length > 1) {
    arr = arr.slice(1);
    dropped++;
    json = JSON.stringify(arr);
  }
  return { arr, json, dropped };
}
function compressPhotoGuest(file) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 520;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}
function pickAndUploadPhotos(myName) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    const status = document.getElementById('gh-wall-status');
    const setStatus = (t, ok) => { if (status) { status.textContent = t; status.className = 'gh-wall-status' + (ok ? ' ok' : ''); } };
    setStatus('Comprimiendo…', false);
    try {
      const shots = [];
      for (const f of files) {
        const d = await compressPhotoGuest(f);
        if (d) shots.push({ id: 'w' + Date.now() + Math.floor(Math.random() * 9999), src: d, by: myName, ts: Date.now() });
      }
      if (!shots.length) { setStatus('No se pudo leer las fotos', false); return; }
      setStatus('Subiendo…', false);
      // Merge con lo que ya haya para no pisar las fotos de los demás
      const fit = await mergeNdjDoc('wall', [], (wall) => {
        if (!Array.isArray(wall)) wall = [];
        wall = wall.concat(shots).sort((a, b) => (a.ts || 0) - (b.ts || 0));
        if (wall.length > WALL_MAX_GUEST) wall = wall.slice(-WALL_MAX_GUEST);
        return wallWithinBudget(wall);
      });
      setStatus(
        '✓ ' + shots.length + ' foto(s) subida(s)' +
        (fit.dropped ? ' · se archivaron ' + fit.dropped + ' de las más viejas por espacio' : ''),
        true
      );
    } catch (e) {
      console.warn('muro:', e);
      setStatus('No se pudo subir. Probá con menos fotos o de a una.', false);
    }
  };
  inp.click();
}


// ── HÁPTICA: el celular avisa cuando pasa algo TUYO ──────────
// Antes el teléfono del invitado no vibraba nunca; ahora reacciona a sus
// propios resultados y apuestas, que es lo que mira toda la noche.
let _seenF1 = null, _seenF2 = null, _hapticArmed = false;

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

// Devuelve las claves de duelos ya cargados, para comparar entre actualizaciones
function resultKeys(store) { return new Set(Object.keys(store || {})); }

function checkMyNews(myName) {
  const f1 = resultKeys(latestState.f1), f2 = resultKeys(latestState.f2);
  // La primera vez solo tomamos la foto: no queremos vibrar por lo ya jugado
  if (!_hapticArmed) { _seenF1 = f1; _seenF2 = f2; _hapticArmed = true; return; }

  const myIdx = PLAYERS.indexOf(myName);
  const myTeam = teamIndexForPlayer(myName);
  const toast = [];

  f1.forEach(k => {
    if (_seenF1.has(k)) return;
    const res = latestState.f1[k], p = k.split('-').map(Number);
    if (myIdx < 0 || (p[1] !== myIdx && p[2] !== myIdx)) return;
    if (res.winner === 'empate')      { buzz([40, 60, 40]);            toast.push('🤝 Empataste tu duelo'); }
    else if (res.winner === myIdx)    { buzz(res.bonus ? [70,50,70,50,110] : [60,50,110]); toast.push(res.bonus ? '⭐ ¡Ganaste con bonus!' : '🏆 ¡Ganaste tu duelo!'); }
    else                              { buzz(140);                     toast.push('😕 Perdiste tu duelo'); }
  });

  f2.forEach(k => {
    if (_seenF2.has(k)) return;
    const res = latestState.f2[k], p = k.split('-').map(Number);
    if (myTeam < 0 || (p[1] !== myTeam && p[2] !== myTeam)) return;
    if (res.winner === 'empate')      { buzz([40, 60, 40]);            toast.push('🤝 Tu equipo empató'); }
    else if (res.winner === myTeam)   { buzz(res.bonus ? [70,50,70,50,110] : [60,50,110]); toast.push(res.bonus ? '⭐ ¡Tu equipo ganó con bonus!' : '🏆 ¡Ganó tu equipo!'); }
    else                              { buzz(140);                     toast.push('😕 Perdió tu equipo'); }
  });

  _seenF1 = f1; _seenF2 = f2;
  if (toast.length) showNews(toast[toast.length - 1]);
}

// Cartelito flotante que acompaña a la vibración
function showNews(txt) {
  let el = document.getElementById('gh-news');
  if (!el) {
    el = document.createElement('div');
    el.id = 'gh-news';
    el.className = 'gh-news';
    document.body.appendChild(el);
  }
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(showNews._t);
  showNews._t = setTimeout(() => el.classList.remove('show'), 3600);
}

// ── CARA A CARA: tu récord contra cada rival ─────────────────
function headToHead(myName) {
  const myIdx = PLAYERS.indexOf(myName);
  if (myIdx < 0) return [];
  const rec = {};
  Object.keys(latestState.f1 || {}).forEach(k => {
    const res = latestState.f1[k], p = k.split('-').map(Number);
    if (p[1] !== myIdx && p[2] !== myIdx) return;
    const rivalIdx = p[1] === myIdx ? p[2] : p[1];
    const rival = PLAYERS[rivalIdx];
    if (!rival) return;
    rec[rival] = rec[rival] || { w: 0, l: 0, e: 0 };
    if (res.winner === 'empate') rec[rival].e++;
    else if (res.winner === myIdx) rec[rival].w++;
    else rec[rival].l++;
  });
  return Object.keys(rec)
    .map(n => ({ n, ...rec[n] }))
    .sort((a, b) => (b.w + b.l + b.e) - (a.w + a.l + a.e));
}

function renderH2H(myName) {
  const h = headToHead(myName);
  // Antes esta sección simplemente no aparecía y daba sensación de que faltaba algo
  if (!h.length) return `<div class="gh-card">
    <div class="gh-card-title">⚔️ Cara a cara</div>
    <div class="gh-empty">Todavía no jugaste ningún duelo.<br>
      Acá vas a ver tu récord contra cada rival.</div>
  </div>`;
  const rows = h.map(x => {
    const tot = x.w + x.l + x.e;
    const col = x.w > x.l ? 'var(--accent)' : (x.l > x.w ? 'var(--danger)' : 'var(--muted)');
    return `<div class="gh-h2h-row">
      <span class="gh-h2h-name">${escapeHtml(String(x.n).split(' ')[0])}</span>
      <span class="gh-h2h-rec" style="color:${col}">${x.w}–${x.l}${x.e ? ' (' + x.e + 'E)' : ''}</span>
      <span class="gh-h2h-tot">${tot} duelo${tot === 1 ? '' : 's'}</span>
    </div>`;
  }).join('');
  // Contexto: tus números solos no dicen si vas bien o mal
  const prom = promedioGrupo();
  const mio = ranked('f1').find(x => x.n === myName) || { total: 0, wins: 0 };
  const dif = mio.total - prom.pts;
  const comp = `<div class="gh-vs-prom ${dif >= 0 ? 'arriba' : 'abajo'}">
    ${dif >= 0 ? '▲' : '▼'} Tenés <b>${mio.total}</b> puntos ·
    el promedio del grupo es <b>${prom.pts}</b>
  </div>`;

  return `<div class="gh-card">
    <div class="gh-card-title">⚔️ Cara a cara</div>
    <div class="gh-card-sub">Tu récord contra cada rival en Impostor</div>
    ${comp}
    <div class="gh-h2h">${rows}</div>
  </div>`;
}

// ── EN VIVO: relator, resultados y logros (misma lógica del modo TV,
// reutilizando el mismo estado y las mismas funciones que la pestaña "Yo") ──
let evPhase = 'f2';

function detectLogros() {
  const found = [];
  const add = (id, emoji, title, who, desc) => found.push({ id, emoji, title, who, desc });
  const state = latestState;

  const f1Seq = [];
  F1_FIXTURE.forEach(m => {
    const k = m[0] + '-' + m[1] + '-' + m[2];
    const res = (state.f1 || {})[k];
    if (res) f1Seq.push({ key: k, a: m[1], b: m[2], res });
  });

  if (f1Seq.length) {
    const first = f1Seq.find(x => x.res.winner !== 'empate');
    if (first) { const w = PLAYERS[first.res.winner]; if (w) add('primera-sangre', '💥', 'Primera Sangre', w, 'Ganó el primer duelo de la noche'); }
  }
  const streaks = {};
  f1Seq.forEach(x => {
    if (x.res.winner === 'empate') { streaks[PLAYERS[x.a]] = 0; streaks[PLAYERS[x.b]] = 0; return; }
    const w = PLAYERS[x.res.winner], l = PLAYERS[x.res.winner === x.a ? x.b : x.a];
    streaks[w] = (streaks[w] || 0) + 1; streaks[l] = 0;
    if (streaks[w] === 2) add('doblete-' + w, '⚡', 'Doblete', w, 'Dos victorias al hilo');
    if (streaks[w] === 3) add('triplete-' + w, '🔥', 'Triplete', w, 'Tres victorias seguidas');
    if (streaks[w] === 4) add('imparable-' + w, '🚀', 'Imparable', w, 'Cuatro victorias sin perder');
    if (x.res.bonus) add('bonus-' + x.key, '⭐', 'Con Estilo', w, 'Ganó con bonus incluido');
  });
  try {
    const pts = getPoints('f1');
    if (pts.length) {
      const sorted = PLAYERS.map((n, i) => ({ n, t: pts[i] ? pts[i].total : 0 })).sort((a, b) => a.t - b.t);
      const lastName = sorted.length ? sorted[0].n : null;
      const lastWin = f1Seq.slice().reverse().find(x => x.res.winner !== 'empate' && PLAYERS[x.res.winner] === lastName);
      if (lastName && lastWin) add('superviviente-' + lastWin.key, '🧟', 'Superviviente', lastName, 'Ganó estando último en la tabla');
    }
  } catch (e) {}
  try {
    (((state.impostor || {}).rounds) || []).forEach((rd, i) => {
      if (!rd || !rd.impostorName) return;
      if (rd.mode === 'noDescubierto') add('villano-' + i, '😈', 'El Villano', rd.impostorName, 'Fue impostor y nadie lo descubrió');
      else add('cazador-' + i, '🔍', 'Cazado', rd.impostorName, 'Lo descubrieron como impostor');
    });
  } catch (e) {}
  try {
    const f2Seq = [];
    F2_FIXTURE.forEach(m => { const k = m[0] + '-' + m[1] + '-' + m[2]; if ((state.f2 || {})[k]) f2Seq.push({ key: k, a: m[1], b: m[2], res: state.f2[k] }); });
    const tstreaks = {};
    f2Seq.forEach(x => {
      if (x.res.winner === 'empate') { tstreaks[TEAMS[x.a]] = 0; tstreaks[TEAMS[x.b]] = 0; return; }
      const w = TEAMS[x.res.winner], l = TEAMS[x.res.winner === x.a ? x.b : x.a];
      tstreaks[w] = (tstreaks[w] || 0) + 1; tstreaks[l] = 0;
      if (tstreaks[w] === 2) add('duo-doblete-' + w, '🤝', 'Dupla Encendida', w, 'Dos victorias seguidas en equipo');
      if (tstreaks[w] === 3) add('duo-triplete-' + w, '🏆', 'Dupla Imparable', w, 'Tres victorias al hilo');
    });
  } catch (e) {}
  try {
    (state.comodines || []).forEach(c => {
      if (c.status !== 'done') return;
      if (c.key === 'robo') add('ladron-' + c.id, '🥷', 'Ladrón', c.player, c.note || 'Le robó un punto a otro');
      if (c.key === 'peaje') add('peaje-' + c.id, '💸', 'Mala Racha', c.player, 'La ruleta le sacó un punto');
    });
    (state.comodinesF2 || []).forEach(c => {
      if (c.status !== 'done') return;
      if (c.key === 'robo') add('ladron-eq-' + c.id, '🥷', 'Ladrón', c.player, c.note || 'Le robó un punto a otro equipo');
      if (c.key === 'peaje') add('peaje-eq-' + c.id, '💸', 'Mala Racha', c.player, 'La ruleta le sacó un punto');
    });
  } catch (e) {}
  return found;
}

function buildRelatorLines() {
  const out = [];
  const push = (id, emoji, html) => out.push({ id, emoji, html });
  const state = latestState;
  let ppts = [], tpts = [];
  try { ppts = getPoints('f1'); } catch (e) {}
  try { tpts = getPoints('f2'); } catch (e) {}

  if (ppts.length) {
    const sortedP = PLAYERS.map((n, i) => ({ n, t: ppts[i] ? ppts[i].total : 0 })).sort((a, b) => b.t - a.t);
    if (sortedP.length >= 2 && sortedP[0].t > 0) {
      const gap = sortedP[0].t - sortedP[1].t;
      if (gap === 0) push('tie-f1-' + sortedP[0].t, '⚖️', '<b>' + shortName(sortedP[0].n, true) + '</b> y <b>' + shortName(sortedP[1].n, true) + '</b> empatados en la punta con ' + sortedP[0].t);
      else if (gap >= 5) push('lead-f1-' + sortedP[0].n + '-' + gap, '👑', '<b>' + shortName(sortedP[0].n, true) + '</b> se escapa: ' + gap + ' puntos de ventaja');
      else push('close-f1-' + sortedP[0].n + '-' + gap, '🎯', '<b>' + shortName(sortedP[0].n, true) + '</b> puntero por ' + gap + ' — ' + shortName(sortedP[1].n, true) + ' lo persigue');
    }
  }
  if (tpts.length && TEAMS.length) {
    const sortedT = TEAMS.map((n, i) => ({ n, t: tpts[i] ? tpts[i].total : 0 })).sort((a, b) => b.t - a.t);
    if (sortedT.length && sortedT[0].t > 0) {
      push('lead-f2-' + sortedT[0].n + '-' + sortedT[0].t, '🏆', '<b>' + sortedT[0].n + '</b> manda en la Fase Grupal con ' + sortedT[0].t + ' puntos');
      if (sortedT.length >= 2 && sortedT[0].t - sortedT[1].t <= 1) push('close-f2-' + sortedT[1].n, '🔥', '<b>' + sortedT[1].n + '</b> a un suspiro de la punta');
    }
  }
  try {
    const f1Done = F1_FIXTURE.filter(m => (state.f1 || {})[m[0] + '-' + m[1] + '-' + m[2]]).length;
    const f2Done = F2_FIXTURE.filter(m => (state.f2 || {})[m[0] + '-' + m[1] + '-' + m[2]]).length;
    if (f1Done && f1Done === F1_FIXTURE.length) push('f1-done', '✅', 'Impostor completa — se viene el Impostor');
    else if (f1Done && F1_FIXTURE.length - f1Done <= 2) push('f1-almost-' + f1Done, '⏳', 'Quedan ' + (F1_FIXTURE.length - f1Done) + ' duelos para cerrar la Impostor');
    if (f2Done && f2Done === F2_FIXTURE.length) push('f2-done', '✅', 'Fase Grupal completa — a la gran final');
    else if (f2Done && F2_FIXTURE.length - f2Done <= 2) push('f2-almost-' + f2Done, '⏳', 'Quedan ' + (F2_FIXTURE.length - f2Done) + ' duelos de Fase Grupal');
  } catch (e) {}
  try {
    const rounds = ((state.impostor || {}).rounds) || [];
    if (rounds.length) {
      const last = rounds[rounds.length - 1];
      if (last && last.impostorName) push('imp-' + rounds.length, last.mode === 'noDescubierto' ? '🕵️' : '🎭',
        last.mode === 'noDescubierto' ? '<b>' + shortName(last.impostorName, true) + '</b> fue impostor y nadie se dio cuenta' : 'Descubrieron a <b>' + shortName(last.impostorName, true) + '</b> como impostor');
    }
  } catch (e) {}
  try {
    const comos = (state.comodines || []).filter(c => c.status === 'done');
    if (comos.length) { const last = comos[comos.length - 1]; const d = last.delta || 0; push('como-' + last.id, d >= 0 ? '🍀' : '💀', '<b>' + shortName(last.player, true) + '</b>: ' + (last.note || 'comodín aplicado') + ' (' + (d > 0 ? '+' : '') + d + ')'); }
    const comosF2 = (state.comodinesF2 || []).filter(c => c.status === 'done');
    if (comosF2.length) { const last = comosF2[comosF2.length - 1]; const d = last.delta || 0; push('como-eq-' + last.id, d >= 0 ? '🍀' : '💀', '<b>' + last.player + '</b>: ' + (last.note || 'comodín aplicado') + ' (' + (d > 0 ? '+' : '') + d + ')'); }
  } catch (e) {}
  return out;
}

let _relatorSeen = {};
let _relatorTimer = null;

  const txt = document.getElementById('gh-relator-txt');
