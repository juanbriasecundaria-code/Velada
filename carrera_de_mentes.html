<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrera de Mentes</title>
<meta name="apple-mobile-web-app-title" content="Carrera de Mentes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
:root{--bg:#0a0a0e;--surface:#14141c;--surface2:#1e1e2a;--border:rgba(255,255,255,.1);--text:#f0efe8;--muted:#8a8a96;--gold:#f5c842;--gold-dim:rgba(245,200,66,.14);--red:#ff5f5f;--green:#4cdb7a;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}
body{padding:calc(52px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.hub-link{position:fixed;top:0;left:max(.6rem,env(safe-area-inset-left));height:44px;margin-top:env(safe-area-inset-top);display:inline-flex;align-items:center;z-index:50;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
#gate{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;min-height:16px}
#gate a{color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.team{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 8px;text-align:center;min-width:0}
.team.me{border-color:var(--gold);background:var(--gold-dim)}
.team img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);display:block;margin:0 auto 6px}
.team img.none{display:none}
.team b{display:block;font-size:14px;overflow-wrap:anywhere}
.team small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.vs>i{font-style:normal;font-weight:800;color:var(--muted);font-size:12px}
.sheet{background:#f4f1e8;color:#14141c;border-radius:16px;padding:14px 12px 10px;border:2px dashed #14141c55}
.sheet h1{font-family:Georgia,'Times New Roman',serif;font-size:19px;letter-spacing:.02em;text-align:center;margin-bottom:4px}
.sheet .who{font-size:12.5px;text-align:center;border-bottom:2px solid #14141c;padding-bottom:8px;margin-bottom:8px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.row .ltr{width:44px;height:44px;border:2.5px solid #14141c;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--c)}
.row .nm b{font-size:14px;display:block}.row .nm span{font-size:11.5px;color:#14141c99}
.row .nm em{font-style:normal;margin-right:4px}
.boxes{display:flex;gap:7px}
.box{width:46px;height:46px;border:2.5px solid #14141c;border-radius:8px;background:#fff;font-size:30px;line-height:1;color:#1a2a8c;font-family:'Segoe Print','Bradley Hand',cursive;touch-action:manipulation;cursor:pointer}
.box.on{background:var(--c)}
.row.full .nm b::after{content:' 👑'}
.foot{border-top:1px solid #14141c66;margin-top:6px;padding-top:7px;text-align:center;font-size:12px}
.score{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.score .crowns{font-size:26px;letter-spacing:2px}
.rv{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
button.b{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font:700 14px inherit;font-family:inherit;min-height:44px;cursor:pointer}
button.b:disabled{opacity:.4}
button.gold{background:var(--gold);color:#14141c;border-color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tools .b{flex:1;min-width:110px}
#timer{font:800 22px ui-monospace,Menlo,monospace;color:var(--gold);text-align:center;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0;font-size:12px;color:var(--muted);align-items:center}
.chips .b{padding:6px 10px;min-height:36px;font-size:13px}.chips .b.sel{border-color:var(--gold);color:var(--gold)}
#cgate{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}
#cgate .b{min-height:36px;padding:6px 12px;font-size:12px;color:var(--muted)}
#cgate input{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:14px;width:130px;min-height:36px}
#over{position:fixed;inset:0;background:rgba(10,10,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:100}
#over.show{display:flex}#over .big{font-size:84px}#over h2{font-size:30px}#over p{color:var(--muted);max-width:320px}
</style>
</head>
<body>
<a class="hub-link" href="index.html?hub=1">← Volver</a>
<div id="gate"></div>
<div class="vs" id="vs"></div>
<div class="sheet">
  <h1>CARRERA DE MENTES</h1>
  <div class="who" id="who"></div>
  <div id="rows"></div>
  <div class="foot">3 casilleros tachados = <b>1 corona</b> 👑</div>
</div>
<div id="cond" hidden>
<div class="score">
  <div><div class="crowns" id="mine"></div><div style="font-size:12px;color:var(--muted)">Nuestras coronas</div></div>
  <div class="rv"><span>Rival</span><button class="b" id="rvm">−</button><b id="rvn" style="font-size:20px;color:var(--text)">0</b><button class="b" id="rvp">+</button></div>
</div>
<div id="timer"></div>
<div class="chips" id="chips"></div>
<div class="tools"><button class="b" id="undo">↩️ Deshacer</button><button class="b" id="tbtn">⏱️ Iniciar tiempo</button><button class="b" id="rst">🔄 Reiniciar</button></div>
</div>
<div id="cgate"><button class="b" id="clock">🔒 Conductor</button><span id="cpass" hidden><input id="cpi" type="password" placeholder="Contraseña" autocomplete="off"> <button class="b gold" id="cok">Entrar</button></span></div>
<div id="over"><div class="big" id="ov-i"></div><h2 id="ov-t"></h2><p id="ov-p"></p><button class="b gold" id="ov-r">🔄 Reiniciar y seguir jugando</button><button class="b" id="ov-c">Ver la hoja</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="buzzer-rounds.js"></script>
<script src="auto-live.js"></script>
<script src="duplas-fotos.js"></script>
<script src="carrera-rounds.js"></script>
<script>
const L=CarreraLogic, q=new URLSearchParams(location.search), $=id=>document.getElementById(id);
let match=null, connected=false, db=null, S=L.fresh(3), dismissed=false;
const CONDUCTOR_PASS='100'; // ← cambiá la contraseña del conductor acá
let COND=false; try{COND=sessionStorage.getItem('carrera_mode')==='conductor';}catch(e){}
let cfgRef=null, lastCfg='';
let hojas={}, hojasRef=null, hojasId=null, hojasLoaded=false, lastPub='';
const KEY=()=>'carrera_v1_'+(match&&match.id||'manual');
function load(){try{const r=JSON.parse(localStorage.getItem(KEY()));if(r&&r.cells)return r;}catch(e){}return L.fresh(3);}
function save(){try{localStorage.setItem(KEY(),JSON.stringify(S));}catch(e){}}
const mySide=()=>{const p=match&&(match.players||[]).find(x=>x.name===q.get('player'));return p?p.side:'a';};
const membersOf=side=>match?match.players.filter(p=>p.side===side).map(p=>p.name):[];
function photo(side){
  const m=membersOf(side).slice().sort().join('|');
  let f=null;try{f=VeladaDuplas.filename(membersOf(side));}catch(e){}
  if(!f&&m==='Cori|Flor|Mica')f='equipo5.jpg';
  return f;
}
function teamHtml(side){
  const f=photo(side), me=side===mySide();
  return '<div class="team'+(me?' me':'')+'">'+(f?'<img src="'+f+'" alt="" onerror="this.className=\'none\'">':'')+
    '<b>'+esc(match.names[side])+'</b><small>'+esc(membersOf(side).join(' · '))+'</small></div>';
}
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
// ── Coronas en vivo: cada celular publica SUS coronas; el rival las ve solas ──
const safeKey=v=>String(v).replace(/[.$#\[\]\/]/g,'_');
const rivalSide=()=>mySide()==='a'?'b':'a';
// Equipo = la hoja con más coronas entre sus integrantes (no se suman: no se duplica si ambos marcan lo mismo).
const teamCrowns=side=>Object.values(hojas).filter(h=>h&&h.side===side).reduce((m,h)=>Math.max(m,+h.crowns||0),0);
const liveOn=()=>!!(db&&connected&&match&&match.active&&q.get('player')&&membersOf(mySide()).includes(q.get('player')));
const hojasPath=()=>BuzzerRounds.paths.carrera+'/hojas/'+safeKey(match.id);
function publish(){
  if(!liveOn())return;
  const me=q.get('player'), c=L.crowns(S.cells), sig=match.id+'|'+me+'|'+mySide()+'|'+c;
  if(sig===lastPub)return; lastPub=sig;
  db.ref(hojasPath()+'/'+safeKey(me)).set({side:mySide(),crowns:c,t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{lastPub='';});
}
function syncRival(){
  if(!liveOn()||!hojasLoaded)return;
  const n=teamCrowns(rivalSide());
  if(n!==S.rival){L.applyRival(S,n,Date.now());dismissed=false;save();}
}
const cfgPath=()=>BuzzerRounds.paths.carrera+'/config/'+safeKey(match.id);
function publishCfg(){
  if(!COND||!db||!connected||!match||!match.active)return;
  const c={target:S.target,mins:S.mins,endAt:S.endAt||null}, sig=match.id+'|'+JSON.stringify(c);
  if(sig===lastCfg)return; lastCfg=sig;
  db.ref(cfgPath()).set({...c,t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{lastCfg='';});
}
function onCfg(c){
  if(COND||!c)return;
  let ch=false;
  if(c.target&&c.target!==S.target){S.target=c.target;ch=true;}
  if((c.mins|0)!==S.mins){S.mins=c.mins|0;ch=true;}
  const e=c.endAt||null; if(e!==S.endAt){S.endAt=e;ch=true;}
  if(ch){L.settle(S,Date.now());save();render();}
}
function watchHojas(){
  const id=match&&match.id||null; if(id===hojasId)return;
  if(hojasRef){hojasRef.off();hojasRef=null;}
  if(cfgRef){cfgRef.off();cfgRef=null;}
  hojas={};hojasLoaded=false;hojasId=id;lastPub='';lastCfg='';
  if(!id||!db)return;
  cfgRef=db.ref(cfgPath());cfgRef.on('value',s=>onCfg(s.val()),()=>{});
  hojasRef=db.ref(hojasPath());
  hojasRef.on('value',s=>{hojas=s.val()||{};hojasLoaded=true;render();},()=>{hojasLoaded=false;});
}
// Evita reconstruir el DOM si no cambió: así no parpadean las fotos ni los casilleros ya marcados
const _html={};
function setHtml(id,h){if(_html[id]===h)return;_html[id]=h;$(id).innerHTML=h;}
let rowsCache=[];
function setRows(list){
  const el=$('rows');
  if(el.children.length!==list.length){el.innerHTML=list.join('');rowsCache=list.slice();return;}
  list.forEach((h,i)=>{if(rowsCache[i]!==h){const t=document.createElement('div');t.innerHTML=h;el.replaceChild(t.firstChild,el.children[i]);rowsCache[i]=h;}});
}
function render(){
  syncRival();
  const valid=match&&match.active, visitor=q.has('match');
  const stale=visitor&&(!valid||q.get('match')!==match.id);
  setHtml('gate',stale?'El cruce cambió. <a href="index.html?game=carrera">Volvé a elegir tu nombre</a>':
    valid?'Ronda '+match.round+(connected?'':' · Sin conexión: la hoja se guarda en este celular'):'Partida manual · sin cruce asignado');
  setHtml('vs',valid?teamHtml('a')+'<i>VS</i>'+teamHtml('b'):'');
  $('who').textContent=valid?'EQUIPO: '+match.names[mySide()]+(q.get('player')?' · '+q.get('player'):''):'NOMBRE: ________';
  setRows(L.CATS.map((c,r)=>'<div class="row'+(S.cells[r].every(Boolean)?' full':'')+'" style="--c:'+c.c+'"><div class="ltr">'+c.k+'</div><div class="nm"><b><em>'+c.e+'</em>'+c.n.toUpperCase()+'</b><span>'+c.s+'</span></div><div class="boxes">'+
    S.cells[r].map((v,i)=>'<button class="box'+(v?' on':'')+'" data-r="'+r+'" data-i="'+i+'" aria-label="'+c.n+' casillero '+(i+1)+'">'+(v?'✕':'')+'</button>').join('')+'</div></div>'));
  const n=L.crowns(S.cells);
  const auto=liveOn()&&hojasLoaded;
  $('rvp').disabled=$('rvm').disabled=auto;document.querySelector('.rv span').textContent=auto?'Rival · en vivo':'Rival';
  $('mine').textContent=n?'👑'.repeat(n):'—';$('rvn').textContent=S.rival;
  setHtml('chips','Coronas para ganar: '+[1,2,3,4,5].map(t=>'<button class="b'+(S.target===t?' sel':'')+'" data-t="'+t+'">'+t+'</button>').join('')+'<br style="flex-basis:100%">Tiempo: '+[0,5,10,15].map(m=>'<button class="b'+(S.mins===m?' sel':'')+'" data-m="'+m+'">'+(m?m+' min':'Sin límite')+'</button>').join(''));
  $('tbtn').disabled=!S.mins||!!S.endAt||!!S.over;$('undo').disabled=!S.hist.length;
  const o=S.over;
  if(o&&!dismissed){
    $('ov-i').textContent=o.kind==='win'?'👑':o.kind==='lose'?'😤':'🤝';
    $('ov-t').textContent=o.kind==='win'?'¡Ganaron!':o.kind==='lose'?'Ganó el rival':'Empate';
    $('ov-p').textContent=L.crowns(S.cells)+' a '+S.rival+' en coronas'+(o.reason==='tiempo'?' · terminó el tiempo':'')+'. El conductor carga el resultado desde la velada.';
  }
  $('over').classList.toggle('show',!!o&&!dismissed);
  tick();publish();publishCfg();
}
function tick(){
  if(S.endAt&&!S.over){const left=S.endAt-Date.now();if(left<=0){L.settle(S,Date.now());save();render();return;}
    const s=Math.ceil(left/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  else $('timer').textContent='';
}
setInterval(tick,500);
function act(fn){fn();dismissed=false;save();render();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.r!=null)act(()=>L.toggle(S,+b.dataset.r,+b.dataset.i));
  else if(b.dataset.t)act(()=>{S.target=+b.dataset.t;L.settle(S,Date.now());});
  else if(b.dataset.m!=null)act(()=>{S.mins=+b.dataset.m;S.endAt=null;});
});
$('rvp').onclick=()=>act(()=>L.setRival(S,1));$('rvm').onclick=()=>act(()=>L.setRival(S,-1));
$('undo').onclick=()=>act(()=>L.undo(S));
$('tbtn').onclick=()=>act(()=>{S.endAt=Date.now()+S.mins*60000;});
function restart(){if(S.hist.length&&!S.over&&!confirm('¿Reiniciar la hoja?'))return;act(()=>{S=L.restart(S);});}
$('rst').onclick=restart;$('ov-r').onclick=()=>act(()=>{S=L.restart(S);});$('ov-c').onclick=()=>{dismissed=true;render();};

// ── Firebase: cruce + coronas en vivo por equipo (velada/carrera/hojas/<cruce>/<jugador>) ──
(function(){
  try{
    const app=firebase.apps.find(a=>a.name==='carrera-game')||firebase.initializeApp({
      apiKey:"AIzaSyB37WkRQqBWVYkZ84AE2u17pAOs_9ZCgCg",authDomain:"guessmovie-905e2.firebaseapp.com",
      databaseURL:"https://guessmovie-905e2-default-rtdb.firebaseio.com",projectId:"guessmovie-905e2",
      storageBucket:"guessmovie-905e2.firebasestorage.app",messagingSenderId:"313601369235",
      appId:"1:313601369235:web:f8b28a2ec187a934fa1966"},'carrera-game');
    db=app.database();
    db.ref('.info/connected').on('value',s=>{connected=!!s.val();render();});
    db.ref(BuzzerRounds.paths.carrera+'/fixture').on('value',s=>{
      const next=s.val()||null;
      if((next&&next.id)!==(match&&match.id)){match=next;S=load();dismissed=false;}else match=next;
      watchHojas();render();
    },()=>{$('gate').textContent='No se pudo leer la ronda. Revisá la conexión.';});
    // Cada celular publica su hoja (propias coronas) y el rival cargado. El conductor congela el resultado.
    BuzzerAutoLive.start({db,game:'carrera',legacyPath:BuzzerRounds.paths.carrera,getMatch:()=>match,
      getScore:()=>liveOn()&&hojasLoaded?{a:teamCrowns('a'),b:teamCrowns('b')}:null});
    BuzzerAutoLive.watchReset('carrera',()=>db,()=>{S=L.restart(S);dismissed=false;save();render();});
  }catch(e){console.warn('Sin Firebase: modo manual',e);}
})();
// ── Modo conductor (contraseña): solo él ve Coronas para ganar, Tiempo, Rival y herramientas ──
function applyCond(on){
  COND=on; try{sessionStorage.setItem('carrera_mode',on?'conductor':'');}catch(e){}
  $('cond').hidden=!on; $('cpass').hidden=true; $('cpi').value='';
  $('clock').textContent=on?'🔓 Salir de modo conductor':'🔒 Conductor';
  if(on){lastCfg='';publishCfg();}
}
function condCheck(){
  if($('cpi').value.trim()===CONDUCTOR_PASS)applyCond(true);
  else{alert('Contraseña incorrecta');$('cpi').value='';}
}
$('clock').onclick=()=>{
  if(COND){applyCond(false);return;}
  $('cpass').hidden=!$('cpass').hidden; if(!$('cpass').hidden)setTimeout(()=>$('cpi').focus(),50);
};
$('cok').onclick=condCheck;
$('cpi').onkeydown=e=>{if(e.key==='Enter')condCheck();};
applyCond(COND);
S=load();render();
</script>
</body>
</html>
